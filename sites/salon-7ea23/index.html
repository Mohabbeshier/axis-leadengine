<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   AXIS — demo template v7
   Ten decisions, all of them structural:
   1  A feminine palette. Rose, lilac and peach on blush — the sage/olive
      set read as a wellness clinic, not a salon for women under thirty.
   2  Green now means one thing only: WhatsApp. It is the booking colour,
      never a surface colour.
   3  A real header — mark, salon name, section links, and a booking pill
      that is on screen from the first pixel to the last.
   4  A full-screen intro that states the salon, then leaves.
   5  Buttons that never wrap. One primary, one quiet secondary.
   6  Chip rows wrap tidily instead of being sliced by a scroll mask.
   7  A "why us" block, because the site had claims but no reasons.
   8  Service filtering, because a menu of nine is a wall.
   9  An FAQ that answers what a client actually asks before booking.
   10 An hours table and directions, so the page can close the visit.
   Motion is still CSS only — no animation library anywhere.
   Arabic never gets letter-spacing: it is a joined script.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --fa:"Tajawal",system-ui,sans-serif;
  --fl:"Outfit",system-ui,sans-serif;
  --f:var(--fa);
  --e:cubic-bezier(.16,1,.3,1);
  --eo:cubic-bezier(.34,1.4,.64,1);
  --r:clamp(20px,3.4vw,28px);
  --r-s:16px;
  --pad:clamp(3.5rem,8vw,6.5rem);
  --sx:1;
  --wa:#25D366;
}
html[lang="en"]{--f:var(--fl)}
html[dir="rtl"]{--sx:-1}

html[data-theme="light"]{
  --paper:#FFF7F8;  --paper:oklch(97.6% .012 8);
  --paper2:#FDE9EE; --paper2:oklch(93.5% .030 6);
  --card:#FFFFFF;   --card:oklch(100% 0 0);
  --ink:#2B1A21;    --ink:oklch(24% .032 352);
  --dim:rgba(43,26,33,.62); --dim:oklch(24% .032 352/.62);
  --rose:#E15385;   --rose:oklch(63% .175 6);
  --rose-s:#FDD9E5; --rose-s:oklch(90% .055 4);
  --lilac:#8E5FD8;  --lilac:oklch(57% .165 300);
  --lilac-s:#EBDFFB;--lilac-s:oklch(91% .050 300);
  --peach:#F0804F;  --peach:oklch(70% .150 45);
  --peach-s:#FFE2D4;--peach-s:oklch(92% .050 45);
  --gold:#C9962B;   --gold:oklch(70% .130 88);
  --gold-s:#FBEECB; --gold-s:oklch(94% .050 90);
  --line:rgba(43,26,33,.11); --line:oklch(24% .032 352/.11);
  --on:#FFFFFF;     --on:oklch(100% 0 0);
  --sh:0 14px 34px -18px rgba(120,40,70,.28);
  --sh-l:0 30px 70px -30px rgba(120,40,70,.34);
  --img:saturate(1.06) contrast(1.02);
  --sheen:oklch(24% .032 352/.05);
  --glass:oklch(97.6% .012 8/.82);
}
html[data-theme="dark"]{
  --paper:#140E12;  --paper:oklch(15% .016 348);
  --paper2:#1D151B; --paper2:oklch(19.5% .022 348);
  --card:#241A21;   --card:oklch(24% .028 350);
  --ink:#F8EFF3;    --ink:oklch(96% .010 350);
  --dim:rgba(248,239,243,.62); --dim:oklch(96% .010 350/.62);
  --rose:#FF87AE;   --rose:oklch(78% .140 5);
  --rose-s:#3D2029; --rose-s:oklch(28% .055 5);
  --lilac:#C4A0FF;  --lilac:oklch(78% .130 300);
  --lilac-s:#2E2340;--lilac-s:oklch(28% .060 300);
  --peach:#FFA87F;  --peach:oklch(80% .120 45);
  --peach-s:#3D2419;--peach-s:oklch(28% .055 45);
  --gold:#F0C55E;   --gold:oklch(84% .120 88);
  --gold-s:#3A2E17; --gold-s:oklch(28% .055 88);
  --line:rgba(248,239,243,.13); --line:oklch(96% .010 350/.13);
  --on:#140E12;     --on:oklch(15% .016 348);
  --sh:0 14px 34px -18px rgba(0,0,0,.72);
  --sh-l:0 30px 70px -30px rgba(0,0,0,.86);
  --img:saturate(1.04) contrast(1.05) brightness(.94);
  --sheen:oklch(96% .010 350/.07);
  --glass:oklch(15% .016 348/.82);
}

*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f);
  font-size:clamp(1rem,.95rem + .22vw,1.09rem);line-height:1.8;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;transition:background .5s var(--e),color .5s var(--e)}
html[lang="en"] .tr{letter-spacing:.14em;text-transform:uppercase}
html[lang="ar"] .tr{letter-spacing:normal}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
h1,h2,h3{font-weight:800;line-height:1.3;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.42}
p{text-wrap:pretty}
::selection{background:var(--rose);color:var(--on)}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:6px}
.wrap{width:min(1200px,92vw);margin-inline:auto;position:relative}
section{position:relative}

/* ══ 4 · THE INTRO ══ */
#intro{position:fixed;inset:0;z-index:400;display:grid;place-items:center;text-align:center;
  background:linear-gradient(160deg,var(--rose-s),var(--paper) 46%,var(--lilac-s));
  animation:introOut .85s var(--e) 1.65s forwards}
#intro .mk{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin:0 auto 1.1rem;
  background:var(--rose);color:var(--on);font-weight:900;font-size:1.9rem;
  animation:mkIn .8s var(--eo) both}
#intro .nm{font-weight:900;font-size:clamp(1.35rem,5.4vw,2.4rem);padding-inline:1.5rem;
  animation:nmIn .8s var(--e) .3s both}
#intro .ln{width:0;height:3px;border-radius:3px;margin:1.1rem auto 0;
  background:linear-gradient(90deg,var(--rose),var(--lilac),var(--peach));
  animation:lnIn 1s var(--e) .55s forwards}
@keyframes mkIn{from{opacity:0;transform:scale(.4) rotate(-25deg)}to{opacity:1;transform:none}}
@keyframes nmIn{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes lnIn{to{width:min(220px,45vw)}}
@keyframes introOut{to{opacity:0;transform:translateY(-16px);visibility:hidden}}

.in-1,.in-2,.in-3,.in-4{animation:enter .8s var(--e) both}
.in-1{animation-delay:2.05s}.in-2{animation-delay:2.18s}
.in-3{animation-delay:2.31s}.in-4{animation-delay:2.44s}
@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.h-name span{display:inline-block;animation:unmask .8s var(--e) both}
@keyframes unmask{from{opacity:0;clip-path:inset(0 0 105% 0);transform:translateY(.42em)}
                  to{opacity:1;clip-path:inset(0 0 -18% 0);transform:none}}
.bento .tile{animation:deal .75s var(--eo) both}
.bento .tile:nth-child(1){animation-delay:2.5s}
.bento .tile:nth-child(2){animation-delay:2.58s}
.bento .tile:nth-child(3){animation-delay:2.66s}
.bento .tile:nth-child(4){animation-delay:2.74s}
.bento .tile:nth-child(5){animation-delay:2.82s}
@keyframes deal{from{opacity:0;transform:translateY(52px) rotate(calc(var(--sx) * -3deg)) scale(.94)}
                to{opacity:1;transform:none}}

/* ══ SCROLL ══ */
.rv{opacity:1}
@supports (animation-timeline: view()){
  .rv{animation:rise both;animation-timeline:view();animation-range:entry 2% cover 26%}
  @keyframes rise{from{opacity:0;transform:translateY(38px) scale(.97)}to{opacity:1;transform:none}}
  .mask{animation:wipe linear both;animation-timeline:view();animation-range:entry 12% entry 88%}
  @keyframes wipe{from{clip-path:inset(0 0 100% 0);opacity:.25}to{clip-path:inset(0 0 -12% 0);opacity:1}}
  .stagger>*{animation:tilt both;animation-timeline:view();animation-range:entry 0% cover 24%}
  @keyframes tilt{from{opacity:0;transform:translateY(48px) rotate(calc(var(--sx) * -2deg)) scale(.95)}
                  to{opacity:1;transform:none}}
  .drift img{animation:drift linear both;animation-timeline:view();animation-range:cover}
  @keyframes drift{from{transform:scale(1.24) translateY(-5%)}to{transform:scale(1.24) translateY(5%)}}
  #recede{animation:recede linear both;animation-timeline:view();animation-range:exit 0% exit 100%}
  @keyframes recede{to{opacity:0;transform:translateY(-46px) scale(.95);filter:blur(6px)}}
  .num{animation:tick .1s linear both;animation-timeline:view();animation-range:entry 22% entry 92%}
  @keyframes tick{to{--n:var(--to)}}
  #prog{animation:fill linear both;animation-timeline:scroll(root)}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .rail{animation:slide linear both;animation-timeline:view();animation-range:cover}
  @keyframes slide{from{transform:translateX(calc(var(--sx) * -4%))}to{transform:translateX(calc(var(--sx) * 26%))}}
  .stack .ph{animation:sink linear both;animation-timeline:view();animation-range:exit -12% exit 92%}
  @keyframes sink{to{transform:scale(.9) translateY(-4%);opacity:.45;filter:saturate(.5)}}
}
@property --n{syntax:"<integer>";initial-value:0;inherits:false}
.num{counter-reset:n var(--n)}
.num::after{content:counter(n)}

#prog{position:fixed;top:0;inset-inline:0;height:3px;z-index:200;transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--rose),var(--lilac),var(--peach),var(--gold))}
html[dir="rtl"] #prog{transform-origin:100% 50%}

/* ══ 3 · THE HEADER ══ */
header.top{position:fixed;top:0;inset-inline:0;z-index:150;background:var(--glass);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);
  animation:enter .7s var(--e) 2.15s both;padding-top:env(safe-area-inset-top)}
header.top .bar{width:min(1200px,94vw);margin-inline:auto;height:60px;
  display:flex;align-items:center;gap:.7rem}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0;flex:1}
.brand .mk{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--rose);color:var(--on);font-weight:900;font-size:.95rem}
.brand .nm{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.links{display:none;gap:.2rem}
nav.links a{font-size:.88rem;font-weight:600;color:var(--dim);padding:.4rem .7rem;border-radius:999px}
nav.links a:hover{color:var(--rose);background:var(--rose-s)}
@media(min-width:840px){nav.links{display:flex}}
.icons{display:flex;gap:.35rem;flex:none}
.icons button{cursor:pointer;font-family:var(--f);display:grid;place-items:center;
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:.76rem;font-weight:700;transition:transform .25s var(--e)}
.icons button:hover{transform:translateY(-2px);color:var(--rose)}
.icons svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#themeBtn .sun{display:none}
html[data-theme="dark"] #themeBtn .sun{display:block}
html[data-theme="dark"] #themeBtn .moon{display:none}
.book-pill{display:inline-flex;align-items:center;gap:.4rem;background:var(--wa);color:#fff;
  font-weight:700;font-size:.86rem;padding:.55rem 1rem;border-radius:999px;white-space:nowrap;flex:none;
  box-shadow:0 8px 20px -10px rgba(37,211,102,.9);transition:transform .25s var(--e)}
.book-pill:hover{transform:translateY(-2px)}
.book-pill svg{width:17px;height:17px;flex:none}
@media(max-width:420px){.book-pill span{display:none}.book-pill{padding:.55rem .7rem}}

/* ══ atoms ══ */
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .95rem;border-radius:999px;
  font-size:.84rem;font-weight:600;background:var(--card);border:1px solid var(--line)}
.chip.r{background:var(--rose-s);border-color:transparent;color:var(--rose)}
.chip.l{background:var(--lilac-s);border-color:transparent;color:var(--lilac)}
.chip.p{background:var(--peach-s);border-color:transparent;color:var(--peach)}
.chip.a{background:var(--gold-s);border-color:transparent;color:var(--gold)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
/* 6 · chips wrap tidily; nothing is sliced by a mask */
.chips{display:flex;flex-wrap:wrap;gap:.42rem}

/* 5 · buttons never wrap */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:1rem 1.4rem;border-radius:999px;font-family:var(--f);font-weight:700;
  font-size:clamp(.92rem,2.6vw,1rem);white-space:nowrap;position:relative;overflow:hidden;
  transition:transform .3s var(--e),box-shadow .4s;box-shadow:var(--sh)}
.btn svg{width:19px;height:19px;flex:none}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 14px 34px -16px rgba(37,211,102,.95)}
.btn-wa::after{content:"";position:absolute;top:0;bottom:0;width:34%;inset-inline-start:-50%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-18deg);animation:gleam 5s ease-in-out 3.2s infinite}
@keyframes gleam{0%,64%{inset-inline-start:-50%}86%,100%{inset-inline-start:125%}}
.btn-o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:hover{transform:translateY(-3px);box-shadow:var(--sh-l)}
.btn:active{transform:scale(.97)}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:700;color:var(--rose)}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:currentColor}
.h2{font-size:clamp(1.75rem,4.8vw,3rem);margin:.7rem 0 0}
.lead{color:var(--dim);margin-top:.85rem;max-width:56ch}
.ph{position:relative;overflow:hidden;background:var(--paper2);border-radius:var(--r)}
.ph img{width:100%;height:100%;object-fit:cover;filter:var(--img)}
.ph img.dead{display:none}

/* ══ HERO ══ */
#hero{padding:calc(60px + env(safe-area-inset-top) + clamp(2.2rem,7vh,4rem)) 0 clamp(2rem,5vw,3rem);
  overflow:hidden}
.blob{position:absolute;border-radius:50%;pointer-events:none;z-index:0;filter:blur(8px);
  animation:float 22s ease-in-out infinite alternate}
.blob.b1{inset-inline-end:-20vw;top:-18vh;width:72vw;aspect-ratio:1;
  background:radial-gradient(circle,color-mix(in oklab,var(--rose) 44%,transparent),transparent 68%)}
.blob.b2{inset-inline-start:-24vw;top:28vh;width:62vw;aspect-ratio:1;animation-delay:-8s;
  background:radial-gradient(circle,color-mix(in oklab,var(--lilac) 42%,transparent),transparent 68%)}
.blob.b3{inset-inline-end:6vw;top:54vh;width:40vw;aspect-ratio:1;animation-delay:-15s;
  background:radial-gradient(circle,color-mix(in oklab,var(--peach) 42%,transparent),transparent 68%)}
@keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(3%,5%,0) scale(1.14)}}
#hero .wrap{z-index:2}
.h-name{font-size:clamp(2.2rem,8vw,5.4rem);font-weight:900;margin:.9rem 0 0}
.h-cta{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.7rem}
.h-cta .btn{flex:1 1 auto;min-width:0}

/* ══ BENTO ══ */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(10px,1.4vw,15px);
  margin-top:clamp(1.8rem,4.5vw,2.8rem)}
.tile{border-radius:var(--r);padding:clamp(1.15rem,2.3vw,1.7rem);position:relative;overflow:hidden;
  box-shadow:var(--sh);transition:transform .35s var(--e),box-shadow .35s;
  background:var(--card);border:1px solid var(--line)}
.tile:hover{transform:translateY(-4px)!important;box-shadow:var(--sh-l)}
.tile::before{content:"";position:absolute;top:-40%;bottom:-40%;width:45%;inset-inline-start:-60%;
  pointer-events:none;transform:skewX(-16deg);
  background:linear-gradient(100deg,transparent,var(--sheen),transparent);
  animation:pass 9s ease-in-out infinite}
.tile:nth-child(2)::before{animation-delay:-1.6s}
.tile:nth-child(3)::before{animation-delay:-3.1s}
.tile:nth-child(4)::before{animation-delay:-4.6s}
.tile:nth-child(5)::before{animation-delay:-6.1s}
@keyframes pass{0%,55%{inset-inline-start:-60%}90%,100%{inset-inline-start:135%}}
.tile .k{font-size:.75rem;font-weight:700;margin-bottom:.35rem;opacity:.9}
.tile .big{font-size:clamp(1.9rem,5vw,3.1rem);font-weight:900;line-height:1.08}
.tile .sm{font-size:.86rem;opacity:.72;margin-top:.25rem}
.t-photo{padding:0;grid-column:span 3;min-height:clamp(210px,26vw,320px);border:0}
.t-photo .ph{position:absolute;inset:0;border-radius:inherit}
.t-rate{grid-column:span 3;background:var(--rose-s);border-color:transparent;color:var(--rose);
  display:flex;flex-direction:column;justify-content:center}
.t-rate .stars{font-size:1.1rem;letter-spacing:2px}
.t-a{grid-column:span 2;background:var(--gold-s);border-color:transparent;color:var(--gold)}
.t-c{grid-column:span 2;background:var(--lilac-s);border-color:transparent;color:var(--lilac)}
.t-wa{grid-column:span 2;background:var(--wa);border-color:transparent;color:#fff;
  display:flex;flex-direction:column;justify-content:space-between;gap:.9rem;min-height:150px}
.t-wa .go{display:inline-flex;align-items:center;gap:.45rem;font-weight:700;font-size:.94rem}
.t-wa svg{width:19px;height:19px}
.t-wa .big{font-size:clamp(1.25rem,3vw,1.7rem)}
@media(max-width:900px){
  .bento{grid-template-columns:repeat(4,1fr)}
  .t-photo,.t-rate{grid-column:span 4}.t-a,.t-c{grid-column:span 2}.t-wa{grid-column:span 4}
}
@media(max-width:560px){
  .bento{grid-template-columns:repeat(2,1fr)}
  .t-photo,.t-rate,.t-wa{grid-column:span 2}.t-a,.t-c{grid-column:span 1}
}

/* ══ TICKER ══ */
#ticker{margin-top:clamp(2rem,5vw,3rem);padding:.85rem 0;overflow:hidden;
  border-block:1px solid var(--line);background:var(--paper2)}
#ticker .run{display:flex;width:max-content;animation:run 34s linear infinite}
#ticker span{display:flex;align-items:center;gap:1.7rem;padding-inline-end:1.7rem;
  font-weight:700;font-size:1rem;white-space:nowrap;color:var(--dim)}
#ticker b{width:7px;height:7px;border-radius:50%;background:var(--rose);flex:none}
@keyframes run{to{transform:translateX(-50%)}}
html[dir="rtl"] #ticker .run{animation-name:runr}
@keyframes runr{to{transform:translateX(50%)}}

/* ══ 7 · WHY US ══ */
#why{padding:var(--pad) 0}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));
  gap:clamp(10px,1.4vw,15px);margin-top:clamp(1.8rem,4.5vw,2.8rem)}
.why article{border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  padding:1.5rem 1.35rem;box-shadow:var(--sh)}
.why .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;margin-bottom:.8rem;
  background:var(--rose-s);color:var(--rose)}
.why article:nth-child(2) .ic{background:var(--lilac-s);color:var(--lilac)}
.why article:nth-child(3) .ic{background:var(--peach-s);color:var(--peach)}
.why article:nth-child(4) .ic{background:var(--gold-s);color:var(--gold)}
.why .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.why h3{font-size:1.05rem;margin-bottom:.3rem}
.why p{font-size:.88rem;color:var(--dim)}

/* ══ 8 · SERVICES + FILTER ══ */
#svc{padding:var(--pad) 0;background:var(--paper2)}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.4rem}
.filters button{cursor:pointer;font-family:var(--f);font-size:.85rem;font-weight:600;
  padding:.42rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--dim);transition:.25s var(--e)}
.filters button[aria-pressed="true"]{background:var(--rose);border-color:transparent;color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));
  gap:clamp(10px,1.4vw,15px);margin-top:1.4rem}
.svc{border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:1.4rem 1.3rem;
  display:flex;flex-direction:column;gap:.28rem;box-shadow:var(--sh);position:relative;overflow:hidden;
  transition:transform .35s var(--e),box-shadow .35s}
.svc:hover{transform:translateY(-5px)!important;box-shadow:var(--sh-l)}
.svc::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--rose)}
.svc:nth-child(4n+2)::before{background:var(--lilac)}
.svc:nth-child(4n+3)::before{background:var(--peach)}
.svc:nth-child(4n+4)::before{background:var(--gold)}
.svc .nm{font-size:1.12rem;font-weight:700}
.svc .ds{font-size:.87rem;color:var(--dim);flex:1}
.svc .foot{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.9rem}
.svc .pr{display:inline-flex;align-items:baseline;gap:.25rem;padding:.3rem .8rem;border-radius:999px;
  font-weight:800;font-size:1rem;background:var(--paper2)}
.svc .pr small{font-size:.66em;font-weight:600;opacity:.7}
.svc .go{font-size:.82rem;font-weight:700;color:var(--wa);display:inline-flex;align-items:center;gap:.3rem}
.svc .go svg{width:15px;height:15px}

/* ══ GALLERY ══ */
#gal{padding:var(--pad) 0;overflow:clip}
.stack{margin-top:clamp(1.8rem,4.5vw,2.8rem);display:flex;flex-direction:column;gap:clamp(1rem,3vw,2rem)}
.stack .ph{position:sticky;top:clamp(5.5rem,15vh,8rem);aspect-ratio:4/3;box-shadow:var(--sh-l)}
@media(min-width:900px){.stack .ph{aspect-ratio:16/9}}

/* ══ REVIEWS ══ */
#say{padding:var(--pad) 0;background:var(--paper2)}
.says{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr));
  gap:clamp(10px,1.4vw,15px);margin-top:clamp(1.8rem,4.5vw,2.8rem)}
.say{border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:1.6rem 1.45rem;box-shadow:var(--sh)}
.say .q{font-family:var(--fl);font-size:2.4rem;line-height:.4;color:var(--rose);display:block;margin-bottom:1rem}
.say p{font-size:.94rem;color:var(--dim)}
.say cite{display:block;margin-top:.9rem;font-size:.79rem;font-weight:700;font-style:normal;color:var(--lilac)}

/* ══ 9 · FAQ · 10 · HOURS ══ */
#faq{padding:var(--pad) 0}
.two{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(1.4rem,4vw,3rem);align-items:start;
  margin-top:clamp(1.8rem,4.5vw,2.8rem)}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.qa{display:grid;gap:.6rem}
details{border-radius:var(--r-s);background:var(--card);border:1px solid var(--line);overflow:hidden}
summary{cursor:pointer;list-style:none;padding:1rem 1.2rem;font-weight:700;font-size:.97rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;flex:none;border-inline-end:2px solid var(--rose);
  border-block-end:2px solid var(--rose);transform:rotate(45deg);transition:transform .3s var(--e)}
details[open] summary::after{transform:rotate(-135deg)}
details p{padding:0 1.2rem 1.1rem;color:var(--dim);font-size:.9rem}
.hours{border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  padding:1.4rem 1.3rem;box-shadow:var(--sh)}
.hours h3{font-size:1.02rem;margin-bottom:.8rem}
.hours .line{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;
  border-bottom:1px dashed var(--line);font-size:.9rem}
.hours .line:last-of-type{border-bottom:0}
.hours .line span:last-child{color:var(--dim);font-variant-numeric:tabular-nums}
.hours .free{margin-top:1rem;font-size:.88rem;color:var(--dim)}
.hours .btn{width:100%;margin-top:1rem}

/* ══ BOOK ══ */
#book{padding:0 0 var(--pad)}
.clay{border-radius:clamp(26px,4vw,38px);padding:clamp(2.2rem,6vw,3.8rem) clamp(1.3rem,4vw,2.8rem);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-l);
  text-align:center;position:relative;overflow:hidden}
.clay .g1,.clay .g2{position:absolute;border-radius:50%;filter:blur(6px);pointer-events:none;
  animation:float 20s ease-in-out infinite alternate}
.clay .g1{inset-inline-start:-14%;top:-46%;width:56%;aspect-ratio:1;
  background:radial-gradient(circle,color-mix(in oklab,var(--rose) 48%,transparent),transparent 68%)}
.clay .g2{inset-inline-end:-16%;bottom:-50%;width:60%;aspect-ratio:1;animation-delay:-9s;
  background:radial-gradient(circle,color-mix(in oklab,var(--lilac) 46%,transparent),transparent 68%)}
.clay .in{position:relative;z-index:2}
.clay h2{font-size:clamp(1.7rem,5vw,2.8rem)}
.clay p{margin:.75rem auto 1.7rem;max-width:44ch;color:var(--dim)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:clamp(8px,1.2vw,12px);
  margin-top:2.1rem;text-align:start}
.info>div{background:var(--paper2);border-radius:var(--r-s);padding:1rem 1.1rem}
.info .k{font-size:.7rem;font-weight:700;color:var(--rose);margin-bottom:.25rem}
.info .v{font-size:.91rem}
.info a.v{display:inline-flex;align-items:center;gap:.35rem;color:var(--lilac);font-weight:700}
.info a.v svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

footer{padding:2.4rem 0 5rem;text-align:center;border-top:1px solid var(--line)}
footer .n{font-size:1.2rem;font-weight:800}
footer .c{font-size:.82rem;color:var(--dim);margin-top:.15rem}
footer .a{font-family:var(--fl);font-size:.77rem;color:var(--dim);margin-top:1.2rem;opacity:.75}

#bar{position:fixed;bottom:0;inset-inline:0;z-index:120;display:none;
  padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);transform:translateY(115%);transition:transform .45s var(--e)}
#bar.on{transform:none}
#bar .btn{width:100%}
@media(max-width:768px){#bar{display:block}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;
    transition-duration:.01ms!important}
  #intro{display:none}
  html{scroll-behavior:auto}
}

var lang=root.getAttribute("lang")==="en"?"en":"ar";
function F(k){if(lang==="en"&&C[k+"_en"])return C[k+"_en"];return C[k]||""}
function S(v){return String(v==null?"":v)}
function dead(i){i.addEventListener("error",function(){i.classList.add("dead")})}

var STOCK=[
 "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1600&q=80",
 "https://images.unsplash.com/photo-1519415510236-718bdfcd89c8?auto=format&fit=crop&w=1400&q=80",
 "https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&w=1400&q=80"];
var POOL=(C.photos&&C.photos.length)?C.photos.concat(STOCK):STOCK;

$("#ph1").src=POOL[0];dead($("#ph1"));
POOL.slice(0,3).forEach(function(u){
  var f=document.createElement("figure");f.className="ph drift";
  var m=document.createElement("img");m.src=u;m.alt="";m.loading="lazy";m.decoding="async";dead(m);
  f.appendChild(m);$("#gg").appendChild(f);
});
(function(){var sec=$("#say"),r=C.reviews||[];
  if(!r.length){sec.parentNode.removeChild(sec);return}
  r.slice(0,6).forEach(function(x){
    var d=document.createElement("div");d.className="say";
    var q=document.createElement("span");q.className="q";q.textContent="”";
    var p=document.createElement("p");p.textContent=S(x.text);
    var c=document.createElement("cite");c.textContent=S(x.who);
    d.appendChild(q);d.appendChild(p);d.appendChild(c);$("#says").appendChild(d);
  });
})();

var RATE=parseFloat(C.rating)||0;
function priceOf(s){return parseInt(S(s.price).replace(/[^\d]/g,""),10)||0}
var PRICES=(C.services||[]).map(priceOf).filter(function(n){return n>0});
var WA="";

function target(el,n){if(!el)return;el.style.setProperty("--to",n);
  if(!CSS.supports("animation-timeline: view()"))el.style.setProperty("--n",n)}

/* the salon's initial, for the intro badge and the header mark */
function initial(nm){var w=nm.replace(/^(صالون|مركز|مشغل)\s+/,"").trim();return w.charAt(0)||"•"}

var BANDS=[["fAll",function(){return true}],
           ["fLow",function(p){return p<200}],
           ["fMid",function(p){return p>=200&&p<=300}],
           ["fHigh",function(p){return p>300}]];
var band=0;

function drawCards(){
  var t=TXT[lang],box=$("#cards");box.textContent="";
  (C.services||[]).slice(0,12).forEach(function(s){
    var p=priceOf(s);
    if(!BANDS[band][1](p))return;
    var c=document.createElement("article");c.className="svc";
    var a=document.createElement("div");a.className="nm";
    a.textContent=S((lang==="en"&&s.name_en)?s.name_en:s.name);
    var b=document.createElement("div");b.className="ds";
    b.textContent=S((lang==="en"&&s.desc_en)?s.desc_en:s.desc);
    var f=document.createElement("div");f.className="foot";
    var pr=document.createElement("div");pr.className="pr";
    pr.textContent=(S(s.price).replace(/[^\d٠-٩]/g,"")||S(s.price))+" ";
    var sm=document.createElement("small");sm.textContent=t.cur;pr.appendChild(sm);
    var go=document.createElement("a");go.className="go";go.href=WA;
    var ic=document.createElementNS("http://www.w3.org/2000/svg","svg");
    ic.setAttribute("viewBox","0 0 24 24");ic.setAttribute("fill","currentColor");
    var u=document.createElementNS("http://www.w3.org/2000/svg","use");
    u.setAttribute("href","#wa");ic.appendChild(u);
    go.appendChild(ic);go.appendChild(document.createTextNode(t.ask));
    f.appendChild(pr);f.appendChild(go);
    c.appendChild(a);c.appendChild(b);c.appendChild(f);box.appendChild(c);
  });
}

function drawHours(){
  var body=$("#hrBody");body.textContent="";
  var raw=F("hours");
  if(!raw){$("#faq").querySelector(".hours").hidden=true;return}
  $("#faq").querySelector(".hours").hidden=false;
  /* Google gives one string. Split it into readable lines rather than
     printing a wall of text in a card. */
  raw.split(/[،,]/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(part){
    var m=part.match(/^(.*?)([\d٠-٩].*)$/);
    var d=document.createElement("div");d.className="line";
    var a=document.createElement("span");a.textContent=m?m[1].trim():part;
    var b=document.createElement("span");b.textContent=m?m[2].trim():"";
    d.appendChild(a);d.appendChild(b);body.appendChild(d);
  });
}

function paint(){
  var t=TXT[lang];
  root.setAttribute("lang",lang);
  root.setAttribute("dir",lang==="ar"?"rtl":"ltr");
  $("#langTxt").textContent=t.lang;
  $$("[data-t]").forEach(function(e){e.textContent=t[e.getAttribute("data-t")]||""});

  var nm=F("salon_name"),ct=F("city");
  document.title=nm+" — "+ct;
  $("#fName").textContent=nm;$("#hCity").textContent=ct;$("#fCity").textContent=ct;
  $("#bNm").textContent=nm;$("#iNm").textContent=nm;
  $("#bMk").textContent=initial(nm);$("#iMk").textContent=initial(nm);

  var h=$("#hName");h.textContent="";
  nm.split(/\s+/).filter(Boolean).forEach(function(w,i){
    var s=document.createElement("span");s.textContent=w;
    s.style.animationDelay=(2.1+i*.09).toFixed(2)+"s";
    h.appendChild(s);h.appendChild(document.createTextNode(" "));
  });

  var tg=$("#hTags");tg.textContent="";
  F("tagline").split("·").map(function(s){return s.trim()}).filter(Boolean).forEach(function(x){
    var s=document.createElement("span");s.className="chip";s.textContent=x;tg.appendChild(s)});

  var r=Math.max(0,Math.min(5,Math.round(RATE)));
  $("#bStars").textContent="★★★★★☆☆☆☆☆".slice(5-r,10-r);
  $("#bRate").textContent=RATE.toFixed(1);
  target($("#bRevs"),parseInt(C.reviews_count,10)||0);
  target($("#bSvc"),(C.services||[]).length);
  target($("#bFrom"),PRICES.length?Math.min.apply(null,PRICES):0);

  var msg=(lang==="en"&&C.whatsapp_msg_en)?C.whatsapp_msg_en:C.whatsapp_msg;
  WA="https://wa.me/"+encodeURIComponent(C.whatsapp)+"?text="+encodeURIComponent(msg||"");
  ["ctaHero","ctaTile","ctaBook","ctaBar","ctaTop"].forEach(function(id){var e=$("#"+id);if(e)e.href=WA});

  var names=(C.services||[]).map(function(s){return (lang==="en"&&s.name_en)?s.name_en:s.name});
  var run=$("#run");run.textContent="";
  for(var k=0;k<4;k++){var sp=document.createElement("span");
    names.forEach(function(n){var e=document.createElement("em");e.style.fontStyle="normal";
      e.textContent=n;sp.appendChild(e);sp.appendChild(document.createElement("b"))});
    run.appendChild(sp)}

  var fl=$("#filters");fl.textContent="";
  BANDS.forEach(function(bnd,i){
    var b=document.createElement("button");b.type="button";b.textContent=t[bnd[0]];
    b.setAttribute("aria-pressed",i===band?"true":"false");
    b.addEventListener("click",function(){band=i;
      $$("#filters button").forEach(function(x,j){x.setAttribute("aria-pressed",j===i?"true":"false")});
      drawCards()});
    fl.appendChild(b);
  });
  drawCards();

  var qa=$("#qa");qa.textContent="";
  [1,2,3,4,5,6].forEach(function(i){
    var d=document.createElement("details");
    var s=document.createElement("summary");s.textContent=t["q"+i];
    var p=document.createElement("p");p.textContent=t["a"+i];
    d.appendChild(s);d.appendChild(p);qa.appendChild(d);
  });
  $("#hrFree").textContent=t.hrFree;
  drawHours();

  function put(id,val,txt){var e=$("#"+id);if(!txt){e.hidden=true;return}
    e.hidden=false;if(val)$("#"+val).textContent=txt}
  put("cAddr","vAddr",F("address"));
  put("cHours","vHours",F("hours"));
  put("cPhone",null,C.phone);
  if(C.phone){$("#vPhone").textContent=C.phone;$("#vPhone").href="tel:"+S(C.phone).replace(/\s/g,"")}
  put("cMap",null,C.maps_url);
  if(C.maps_url){$("#vMap").href=C.maps_url;$("#ctaMap").href=C.maps_url}
  else{$("#ctaMap").hidden=true}

  var op=$("#hOpen"),hh=F("hours");
  if(hh){op.hidden=false;op.textContent=hh}else{op.hidden=true}
}

function swap(fn){
  if(document.startViewTransition&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    document.startViewTransition(fn)}else{fn()}
}
$("#langBtn").addEventListener("click",function(){
  swap(function(){lang=lang==="ar"?"en":"ar";
    try{localStorage.setItem("axis-lang",lang)}catch(e){}paint()})});
$("#themeBtn").addEventListener("click",function(){
  swap(function(){var n=root.getAttribute("data-theme")==="light"?"dark":"light";
    root.setAttribute("data-theme",n);
    try{localStorage.setItem("axis-theme",n)}catch(e){}
    var m=$("#metaTheme");if(m)m.setAttribute("content",n==="light"?"#FFF7F8":"#140E12")})});

paint();

/* the intro is animation-only — take it out so it can never sit over a tap target */
setTimeout(function(){var i=$("#intro");if(i&&i.parentNode)i.parentNode.removeChild(i)},2700);

addEventListener("scroll",function(){
  $("#bar").classList.toggle("on",scrollY>520)},{passive:true});

if(!CSS.supports("animation-timeline: view()")&&"IntersectionObserver" in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
    e.target.animate([{opacity:0,transform:"translateY(30px)"},{opacity:1,transform:"none"}],
      {duration:700,easing:"cubic-bezier(.16,1,.3,1)",fill:"both"});io.unobserve(e.target)}})},
    {threshold:.1});
  $$(".rv").concat($$(".stagger>*")).forEach(function(e){io.observe(e)});
}
})();
