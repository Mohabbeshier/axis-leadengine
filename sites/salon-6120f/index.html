<style>
/* ═══════════════════════════════════════════════════════════════════════
   AXIS — demo template v4  ·  "شبابي سعودي"
   Written for who actually opens it: Saudi women under 30, on a phone,
   from an Instagram-shaped visual diet. So: light-first sand, pistachio
   and terracotta — not noir and gold; geometric Tajawal — not calligraphy;
   a bento grid — not vertical luxury bands; and type as the architecture,
   because heavy photography is the slowest thing on a cold mobile link.
   Copy leads on privacy, hygiene, women-only and punctuality, which is
   what this market's advertising guidance actually asks for.
   Arabic never gets letter-spacing — it is a joined script.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --fa:"Tajawal",system-ui,sans-serif;
  --fl:"Outfit",system-ui,sans-serif;
  --f:var(--fa);
  --e:cubic-bezier(.16,1,.3,1);
  --r:clamp(20px,3.2vw,30px);      /* the bento corner */
  --r-s:14px;
  --pad:clamp(3.5rem,8vw,6.5rem);
}
html[lang="en"]{--f:var(--fl)}

html[data-theme="light"]{
  --paper:#F7F1E6;  --paper:oklch(95.5% .022 88);
  --paper2:#EFE5D4; --paper2:oklch(92% .034 86);
  --card:#FFFDF9;   --card:oklch(99.3% .008 95);
  --ink:#2A2119;    --ink:oklch(24% .028 60);
  --dim:rgba(42,33,25,.62); --dim:oklch(24% .028 60/.62);
  --sage:#8FA97C;   --sage:oklch(72% .075 140);
  --sage-d:#5E7A4B; --sage-d:oklch(54% .085 142);
  --terra:#D08A5E;  --terra:oklch(72% .105 55);
  --terra-d:#A85F33;--terra-d:oklch(58% .125 50);
  --pop:#D4576E;    --pop:oklch(64% .155 15);
  --line:rgba(42,33,25,.13); --line:oklch(24% .028 60/.13);
  --on-accent:#FFFDF9; --on-accent:oklch(99.3% .008 95);
  --shade:0 18px 44px -22px rgba(70,52,30,.34);
  --shade-lg:0 34px 80px -34px rgba(70,52,30,.42);
  --img:saturate(1.04) contrast(1.02) brightness(1.03);
}
html[data-theme="dark"]{
  --paper:#191512;  --paper:oklch(18.5% .014 70);
  --paper2:#221D18; --paper2:oklch(23% .018 68);
  --card:#241E19;   --card:oklch(24.5% .020 66);
  --ink:#F5EFE6;    --ink:oklch(95% .016 90);
  --dim:rgba(245,239,230,.62); --dim:oklch(95% .016 90/.62);
  --sage:#A8C293;   --sage:oklch(80% .075 140);
  --sage-d:#8AAA73; --sage-d:oklch(72% .085 142);
  --terra:#E4A177;  --terra:oklch(79% .095 55);
  --terra-d:#C97F4F;--terra-d:oklch(68% .115 50);
  --pop:#EE7E92;    --pop:oklch(75% .125 15);
  --line:rgba(245,239,230,.14); --line:oklch(95% .016 90/.14);
  --on-accent:#1B1713; --on-accent:oklch(19% .015 68);
  --shade:0 18px 44px -22px rgba(0,0,0,.7);
  --shade-lg:0 34px 80px -34px rgba(0,0,0,.85);
  --img:saturate(1.02) contrast(1.04) brightness(.95);
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f);
  font-size:clamp(1rem,.95rem + .22vw,1.09rem);line-height:1.8;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;transition:background .5s var(--e),color .5s var(--e)}
html[lang="en"] .tr{letter-spacing:.16em;text-transform:uppercase}
html[lang="ar"] .tr{letter-spacing:normal}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
h1,h2,h3{font-weight:800;line-height:1.32;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.42}
p{text-wrap:pretty}
::selection{background:var(--sage);color:var(--on-accent)}
.wrap{width:min(1200px,92vw);margin-inline:auto;position:relative}
section{position:relative}

/* ══ motion: scroll-driven, zero libraries ══ */
.rv{opacity:1}
@supports (animation-timeline: view()){
  .rv{animation:rise both;animation-timeline:view();animation-range:entry 4% cover 30%}
  @keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  #prog{animation:fill linear both;animation-timeline:scroll(root)}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
#prog{position:fixed;top:0;inset-inline:0;height:3px;z-index:120;transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--sage),var(--terra),var(--pop))}
html[dir="rtl"] #prog{transform-origin:100% 50%}

/* ══ controls ══ */
#ctrl{position:fixed;top:0;inset-inline-end:0;z-index:130;display:flex;gap:.45rem;
  padding:.85rem clamp(.8rem,3vw,1.5rem);padding-top:calc(.85rem + env(safe-area-inset-top))}
#ctrl button{cursor:pointer;font-family:var(--f);display:inline-flex;align-items:center;justify-content:center;
  height:42px;min-width:46px;padding:0 .85rem;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:.82rem;font-weight:700;box-shadow:var(--shade);
  transition:transform .3s var(--e),background .3s}
#ctrl button:hover{transform:translateY(-2px);background:var(--paper2)}
#ctrl button:active{transform:scale(.93)}
#ctrl svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#themeBtn .sun{display:none}
html[data-theme="dark"] #themeBtn .sun{display:block}
html[data-theme="dark"] #themeBtn .moon{display:none}

/* ══ pieces ══ */
.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.42rem 1rem;border-radius:999px;
  font-size:.84rem;font-weight:500;background:var(--card);border:1px solid var(--line)}
.chip.sage{background:color-mix(in oklab,var(--sage) 26%,var(--card));border-color:transparent}
.chip.terra{background:color-mix(in oklab,var(--terra) 26%,var(--card));border-color:transparent}
.chip b{width:7px;height:7px;border-radius:50%;background:var(--sage-d);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:1.05rem 2rem;
  border-radius:999px;font-family:var(--f);font-weight:700;font-size:1.02rem;
  transition:transform .3s var(--e),box-shadow .4s;box-shadow:var(--shade)}
.btn svg{width:20px;height:20px;flex:none}
.btn-p{background:var(--sage-d);color:var(--on-accent)}
.btn-p:hover{transform:translateY(-3px);box-shadow:var(--shade-lg)}
.btn-p:active{transform:scale(.97)}
.btn-o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-o:hover{transform:translateY(-3px);background:var(--paper2)}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:700;color:var(--terra-d)}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:currentColor}
.h2{font-size:clamp(1.75rem,4.6vw,3rem);margin:.7rem 0 0}
.lead{color:var(--dim);margin-top:.9rem;max-width:58ch}

/* photos */
.ph{position:relative;overflow:hidden;background:var(--paper2);border-radius:var(--r)}
.ph img{width:100%;height:100%;object-fit:cover;filter:var(--img);
  animation:drift 34s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.14)}}
.ph img.dead{display:none}

/* ══ HERO — type is the architecture ══ */
#hero{padding:clamp(6.5rem,15vh,9rem) 0 clamp(2.5rem,6vw,4rem);overflow:hidden}
#hero::before{content:"";position:absolute;inset-inline-end:-18vw;top:-28vh;width:78vw;aspect-ratio:1;
  border-radius:50%;pointer-events:none;z-index:0;filter:blur(10px);
  background:radial-gradient(circle at 50% 50%,color-mix(in oklab,var(--terra) 34%,transparent),transparent 66%)}
#hero::after{content:"";position:absolute;inset-inline-start:-22vw;top:34vh;width:62vw;aspect-ratio:1;
  border-radius:50%;pointer-events:none;z-index:0;filter:blur(10px);
  background:radial-gradient(circle at 50% 50%,color-mix(in oklab,var(--sage) 34%,transparent),transparent 66%)}
#hero .wrap{z-index:2}
.h-top{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem}
.h-name{font-size:clamp(2.4rem,8.6vw,6rem);font-weight:900;margin:1.1rem 0 0;letter-spacing:-.01em}
html[lang="ar"] .h-name{letter-spacing:normal}
.h-name .g{background:linear-gradient(96deg,var(--terra-d),var(--pop) 52%,var(--sage-d));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.h-tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.3rem}
.h-cta{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:2rem}
.h-strip{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.6rem}

/* ══ BENTO ══ */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(10px,1.4vw,16px);
  margin-top:clamp(2rem,5vw,3.2rem)}
.tile{border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  padding:clamp(1.2rem,2.4vw,1.9rem);position:relative;overflow:hidden;box-shadow:var(--shade);
  transition:transform .35s var(--e),box-shadow .35s}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shade-lg)}
.tile.t-photo{padding:0;grid-column:span 3;min-height:clamp(220px,30vw,340px)}
.tile.t-photo .ph{position:absolute;inset:0;border-radius:inherit}
.tile.t-rate{grid-column:span 3;display:flex;flex-direction:column;justify-content:center;
  background:color-mix(in oklab,var(--sage) 24%,var(--card))}
.tile.t-3{grid-column:span 2}
.tile.t-2{grid-column:span 2}
.tile.t-6{grid-column:span 6}
.tile .k{font-size:.76rem;font-weight:700;color:var(--terra-d);margin-bottom:.4rem}
.tile .big{font-size:clamp(2rem,5.4vw,3.4rem);font-weight:900;line-height:1.1}
.tile .sm{color:var(--dim);font-size:.9rem;margin-top:.3rem}
.tile.t-wa{background:var(--sage-d);color:var(--on-accent);display:flex;flex-direction:column;
  justify-content:space-between;gap:1rem;min-height:170px}
.tile.t-wa .k{color:color-mix(in oklab,var(--on-accent) 78%,transparent)}
.tile.t-wa .big{font-size:clamp(1.3rem,3vw,1.8rem)}
.tile.t-wa .go{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;font-size:.95rem}
.tile.t-wa svg{width:20px;height:20px}
.stars{color:var(--terra-d);font-size:1.05rem;letter-spacing:2px}
@media(max-width:900px){
  .bento{grid-template-columns:repeat(4,1fr)}
  .tile.t-photo,.tile.t-rate,.tile.t-6{grid-column:span 4}
  .tile.t-3,.tile.t-2{grid-column:span 2}
}
@media(max-width:560px){
  .bento{grid-template-columns:repeat(2,1fr)}
  .tile.t-photo,.tile.t-rate,.tile.t-6{grid-column:span 2}
  .tile.t-3{grid-column:span 2}
  .tile.t-2{grid-column:span 1}
}

/* ══ SERVICES ══ */
#svc{padding:var(--pad) 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));
  gap:clamp(10px,1.4vw,16px);margin-top:clamp(2rem,5vw,3rem)}
.svc{border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:1.5rem 1.4rem;
  display:flex;flex-direction:column;gap:.35rem;box-shadow:var(--shade);position:relative;overflow:hidden;
  transition:transform .35s var(--e),box-shadow .35s}
.svc:hover{transform:translateY(-4px);box-shadow:var(--shade-lg)}
.svc::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--sage)}
.svc:nth-child(3n+2)::before{background:var(--terra)}
.svc:nth-child(3n+3)::before{background:var(--pop)}
.svc .no{font-family:var(--fl);font-size:.78rem;font-weight:700;color:var(--dim)}
.svc .nm{font-size:1.15rem;font-weight:700}
.svc .ds{font-size:.88rem;color:var(--dim);flex:1}
.svc .pr{margin-top:.8rem;align-self:flex-start;display:inline-flex;align-items:baseline;gap:.3rem;
  padding:.34rem .9rem;border-radius:999px;font-weight:800;font-size:1.05rem;
  background:color-mix(in oklab,var(--terra) 24%,var(--card))}
.svc .pr small{font-size:.66em;font-weight:600;opacity:.75}

/* ══ GALLERY ══ */
#gal{padding:var(--pad) 0;background:var(--paper2)}
.grid-g{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(130px,15vw,200px);
  gap:clamp(10px,1.3vw,15px);margin-top:clamp(2rem,5vw,3rem)}
.grid-g .ph{border-radius:var(--r-s)}
.grid-g .ph:nth-child(1){grid-column:span 2;grid-row:span 2;border-radius:var(--r)}
.grid-g .ph:nth-child(4){grid-row:span 2}
.grid-g .ph:nth-child(6){grid-column:span 2}
@media(max-width:640px){.grid-g{grid-template-columns:repeat(2,1fr)}
  .grid-g .ph:nth-child(1),.grid-g .ph:nth-child(6){grid-column:span 2}}

/* ══ REVIEWS ══ */
#say{padding:var(--pad) 0}
.says{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));
  gap:clamp(10px,1.4vw,16px);margin-top:clamp(2rem,5vw,3rem)}
.say{border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:1.7rem 1.5rem;box-shadow:var(--shade)}
.say .q{font-family:var(--fl);font-size:2.6rem;line-height:.4;color:var(--terra);display:block;margin-bottom:1.1rem}
.say p{font-size:.95rem;color:var(--dim)}
.say cite{display:block;margin-top:1rem;font-size:.8rem;font-weight:700;font-style:normal;color:var(--sage-d)}

/* ══ BOOK ══ */
#book{padding:0 0 var(--pad)}
.clay{border-radius:clamp(26px,4vw,40px);padding:clamp(2.2rem,6vw,4rem) clamp(1.4rem,4vw,3rem);
  background:linear-gradient(140deg,color-mix(in oklab,var(--sage) 40%,var(--card)),
    color-mix(in oklab,var(--terra) 34%,var(--card)));
  box-shadow:var(--shade-lg);text-align:center;position:relative;overflow:hidden}
.clay::after{content:"";position:absolute;inset-inline-end:-12%;bottom:-42%;width:52%;aspect-ratio:1;
  border-radius:50%;background:color-mix(in oklab,var(--card) 40%,transparent)}
.clay .in{position:relative;z-index:2}
.clay h2{font-size:clamp(1.7rem,5vw,2.9rem)}
.clay p{margin:.8rem auto 1.9rem;max-width:46ch;color:var(--ink);opacity:.78}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(8px,1.2vw,12px);
  margin-top:2.4rem;text-align:start}
.info>div{background:var(--card);border-radius:var(--r-s);padding:1.1rem 1.2rem}
.info .k{font-size:.7rem;font-weight:700;color:var(--terra-d);margin-bottom:.3rem}
.info .v{font-size:.92rem}
.info a.v{display:inline-flex;align-items:center;gap:.4rem;color:var(--sage-d);font-weight:700}
.info a.v svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

footer{padding:2.6rem 0 3rem;text-align:center;border-top:1px solid var(--line)}
footer .n{font-size:1.25rem;font-weight:800}
footer .c{font-size:.82rem;color:var(--dim);margin-top:.2rem}
footer .a{font-family:var(--fl);font-size:.78rem;color:var(--dim);margin-top:1.3rem;opacity:.8}

#bar{position:fixed;bottom:0;inset-inline:0;z-index:100;display:none;
  padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
  background:color-mix(in oklab,var(--paper) 86%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  transform:translateY(115%);transition:transform .45s var(--e)}
#bar.on{transform:none}
#bar .btn{width:100%}
@media(max-width:768px){#bar{display:block}body{padding-bottom:0}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
::view-transition-old(root),::view-transition-new(root){animation-duration:.4s}
</style>
</head>

<div id="prog" aria-hidden="true"></div>

<div id="ctrl">
  <button id="langBtn" type="button" aria-label="Language"><span id="langTxt">EN</span></button>
  <button id="themeBtn" type="button" aria-label="Theme">
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>

  </button>
</div>

<!-- ═══ HERO ═══ -->
<section id="hero"><div class="wrap">
  <div class="h-top">
    <span class="chip sage"><b></b><span id="hCity"></span></span>
    <span class="chip" id="hOpen" hidden></span>
  </div>
  <h1 class="h-name"><span id="hName"></span></h1>
  <div class="h-tags" id="hTags"></div>
  <div class="h-cta">
    <a class="btn btn-p" id="ctaHero" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#wa"/></svg><span data-t="ctaBook"></span></a>
    <a class="btn btn-o" href="#svc"><span data-t="ctaMenu"></span></a>
  </div>
  <div class="h-strip">
    <span class="chip terra" data-t="tr1"></span><span class="chip terra" data-t="tr2"></span>
    <span class="chip terra" data-t="tr3"></span><span class="chip terra" data-t="tr4"></span>
  </div>

  <div class="bento">
    <div class="tile t-photo rv"><div class="ph"><img id="ph1" alt="" decoding="async" fetchpriority="high"></div></div>
    <div class="tile t-rate rv">

<!-- ═══ SERVICES ═══ -->
<section id="svc"><div class="wrap">

<section id="say"><div class="wrap">

<section id="book"><div class="wrap">

    <a class="btn btn-p" id="ctaBook" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#wa"/></svg><span data-t="ctaBook"></span></a>
    <div class="info">
      <div id="cAddr"><div class="k tr" data-t="kAddr"></div><div class="v" id="vAddr"></div></div>
      <div id="cHours"><div class="k tr" data-t="kHours"></div><div class="v" id="vHours"></div></div>
      <div id="cPhone"><div class="k tr" data-t="kPhone"></div><a class="v" id="vPhone" href="#" dir="ltr"></a></div>
      <div id="cMap"><div class="k tr" data-t="kMap"></div>
        <a class="v" id="vMap" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 10-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
          <span data-t="openMap"></span></a>

<footer><div class="wrap">

<script>
const CONFIG = {

  "city": "الرياض · النرجس",
  "tagline": "تصفيف الشعر · قص الشعر · صبغة شعر كاملة · كيراتين",

  "hours": "",
  "maps_url": "https://www.google.com/maps/search/?api=1&query=%D8%B5%D8%A7%D9%84%D9%88%D9%86%20%D8%B3%D8%AA%D8%B1%D8%A7%D9%8A%DA%A4%20%D9%81%D9%88%D8%B1%20%D8%A8%D9%8A%D9%88%D8%AA%D9%8A&query_place_id=ChIJ5zWoUVP7Lj4RonBWvTmSOJM",

      "price": "250 SAR",
      "name_en": "Full Hair Color",
      "desc_en": "Full hair color application"
    },
    {
      "name": "كيراتين",
      "desc": "علاج كيراتين لفرد الشعر",
      "price": "400 SAR",
      "name_en": "Keratin",
      "desc_en": "Keratin treatment for hair straightening"
    },
    {
      "name": "مكياج سهرة",
      "desc": "مكياج كامل للمناسبات",
      "price": "350 SAR",
      "name_en": "Evening Makeup",
      "desc_en": "Full makeup for special occasions"
    },
    {
      "name": "عناية بالبشرة",
      "desc": "تنظيف بشرة مع ترطيب",
      "price": "300 SAR",
      "name_en": "Skin Care",
      "desc_en": "Facial cleanse with moisturizing"
    },
    {
      "name": "باقة العروس",
      "desc": "مكياج وشعر يوم الزفاف",
      "price": "1200 SAR",
      "name_en": "Bridal Package",
      "desc_en": "Wedding day makeup and hair"
    }
  ],
  "photos": [],
  "reviews": [],
  "salon_name_en": "Strive for Beauty Salon",
  "city_en": "Riyadh · Al Narjis",
  "address_en": "2698 No. 378, Al Narjis, Riyadh 13328, Saudi Arabia",
  "tagline_en": "Hair Styling · Haircut · Full Hair Color · Keratin",
  "whatsapp_msg_en": "Hello, I would like to book an appointment"
};
</script>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)},
    $$=function(s){return [].slice.call(document.querySelectorAll(s))},
    C=CONFIG,root=document.documentElement;

/* Copy leads on privacy, hygiene, women-only and punctuality — that is what
   this market's advertising guidance asks for, and what the reviews reward. */
var TXT={
 ar:{lang:"EN",
  ctaBook:"احجزي على واتساب",ctaMenu:"شوفي الأسعار",
  tr1:"للنساء فقط",tr2:"خصوصية تامة",tr3:"تعقيم لكل أداة",tr4:"مواعيد بالدقيقة",
  kRate:"تقييم جوجل",revs:"تقييم",
  kSvc:"الخدمات",kSvcSub:"خدمة متاحة",
  kFrom:"تبدأ من",kFromSub:"ريال سعودي",
  kWa:"أسرع طريقة",kWaBig:"احجزي في ثانية",kWaGo:"افتحي واتساب",
  svcK:"الخدمات والأسعار",svcH:"كل شي واضح من البداية",
  svcP:"الأسعار مكتوبة قدامك — تعرفين وش تدفعين قبل لا تجين، وما فيه مفاجآت.",
  galK:"من داخل الصالون",galH:"شوفي المكان قبل لا تحجزين",
  sayK:"آراء العميلات",sayH:"كلامهن، مو كلامنا",
  bkH:"جاهزة؟ احجزي موعدك",
  bkP:"رسالة وحدة على واتساب وبنرتّب لك الموعد اللي يناسبك.",
  kAddr:"العنوان",kHours:"أوقات العمل",kPhone:"الجوال",kMap:"الموقع",openMap:"افتحي الخريطة",
  cur:"ر.س"},
 en:{lang:"ع",
  ctaBook:"Book on WhatsApp",ctaMenu:"See prices",
  tr1:"Women only",tr2:"Full privacy",tr3:"Sterilised tools",tr4:"On-time slots",
  kRate:"Google rating",revs:"reviews",
  kSvc:"Services",kSvcSub:"available",
  kFrom:"Starting from",kFromSub:"Saudi riyal",
  kWa:"Fastest way",kWaBig:"Book in seconds",kWaGo:"Open WhatsApp",
  svcK:"Services & prices",svcH:"Everything clear, up front",
  svcP:"Prices are on the page — you know what you are paying before you arrive. No surprises.",
  galK:"Inside the salon",galH:"See the place before you book",
  sayK:"Client reviews",sayH:"Their words, not ours",
  bkH:"Ready? Book your slot",
  bkP:"One WhatsApp message and we will arrange the time that suits you.",
  kAddr:"Address",kHours:"Opening hours",kPhone:"Mobile",kMap:"Location",openMap:"Open map",
  cur:"SAR"}
};

var lang=root.getAttribute("lang")==="en"?"en":"ar";
function F(k){if(lang==="en"&&C[k+"_en"])return C[k+"_en"];return C[k]||""}
function S(v){return String(v==null?"":v)}
function dead(i){i.addEventListener("error",function(){i.classList.add("dead")})}

var STOCK=[
 "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1600&q=80",
 "https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&w=1200&q=80",
 "https://images.unsplash.com/photo-1519415510236-718bdfcd89c8?auto=format&fit=crop&w=1600&q=80",
 "https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&w=1200&q=80",
 "https://images.unsplash.com/photo-1583416750470-965b2707b355?auto=format&fit=crop&w=1200&q=80",
 "https://images.unsplash.com/photo-1519710164239-da123dc03ef4?auto=format&fit=crop&w=1200&q=80",
 "https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=1200&q=80"];
var POOL=(C.photos&&C.photos.length)?C.photos.concat(STOCK):STOCK;

$("#ph1").src=POOL[0];dead($("#ph1"));
POOL.slice(0,6).forEach(function(u){
  var f=document.createElement("figure");f.className="ph rv";
  var m=document.createElement("img");m.src=u;m.alt="";m.loading="lazy";m.decoding="async";dead(m);
  f.appendChild(m);$("#gg").appendChild(f);
});
(function(){var sec=$("#say"),r=C.reviews||[];
  if(!r.length){sec.parentNode.removeChild(sec);return}
  r.slice(0,6).forEach(function(x){
    var d=document.createElement("div");d.className="say rv";
    var q=document.createElement("span");q.className="q";q.textContent="”";
    var p=document.createElement("p");p.textContent=S(x.text);
    var c=document.createElement("cite");c.textContent=S(x.who);
    d.appendChild(q);d.appendChild(p);d.appendChild(c);$("#says").appendChild(d);
  });
})();

var RATE=parseFloat(C.rating)||0;
var PRICES=(C.services||[]).map(function(s){
  return parseInt(S(s.price).replace(/[^\d]/g,""),10)}).filter(function(n){return n>0});

function paint(){
  var t=TXT[lang];
  root.setAttribute("lang",lang);
  root.setAttribute("dir",lang==="ar"?"rtl":"ltr");
  $("#langTxt").textContent=t.lang;
  $$("[data-t]").forEach(function(e){e.textContent=t[e.getAttribute("data-t")]||""});

  var nm=F("salon_name"),ct=F("city");
  document.title=nm+" — "+ct;
  $("#hName").textContent=nm;$("#fName").textContent=nm;
  $("#hCity").textContent=ct;$("#fCity").textContent=ct;

  var tg=$("#hTags");tg.textContent="";
  F("tagline").split("·").map(function(s){return s.trim()}).filter(Boolean).forEach(function(x){
    var s=document.createElement("span");s.className="chip";s.textContent=x;tg.appendChild(s)});

  var r=Math.max(0,Math.min(5,Math.round(RATE)));
  $("#bStars").textContent="★★★★★☆☆☆☆☆".slice(5-r,10-r);
  $("#bRate").textContent=RATE.toFixed(1);
  $("#bRevs").textContent=(C.reviews_count?C.reviews_count+" ":"")+t.revs;
  $("#bSvc").textContent=(C.services||[]).length;
  $("#bFrom").textContent=PRICES.length?Math.min.apply(null,PRICES):"—";

  var msg=(lang==="en"&&C.whatsapp_msg_en)?C.whatsapp_msg_en:C.whatsapp_msg;
  var wa="https://wa.me/"+encodeURIComponent(C.whatsapp)+"?text="+encodeURIComponent(msg||"");
  ["ctaHero","ctaTile","ctaBook","ctaBar"].forEach(function(id){var e=$("#"+id);if(e)e.href=wa});

  var box=$("#cards");box.textContent="";
  (C.services||[]).slice(0,9).forEach(function(s,i){
    var c=document.createElement("article");c.className="svc rv";
    var no=document.createElement("div");no.className="no";no.textContent=(i<9?"0":"")+(i+1);
    var a=document.createElement("div");a.className="nm";
    a.textContent=S((lang==="en"&&s.name_en)?s.name_en:s.name);
    var b=document.createElement("div");b.className="ds";
    b.textContent=S((lang==="en"&&s.desc_en)?s.desc_en:s.desc);
    /* price arrives as "80", "80 SAR" or "٨٠ ر.س" — keep the digits, the
       template owns the currency word so it follows the language */
    var d=S(s.price).replace(/[^\d٠-٩]/g,"")||S(s.price);
    var p=document.createElement("div");p.className="pr";p.textContent=d+" ";
    var sm=document.createElement("small");sm.textContent=t.cur;p.appendChild(sm);
    c.appendChild(no);c.appendChild(a);c.appendChild(b);c.appendChild(p);box.appendChild(c);
  });

  function put(box,val,txt){var e=$("#"+box);if(!txt){e.style.display="none";return}
    e.style.display="";if(val)$("#"+val).textContent=txt}
  put("cAddr","vAddr",F("address"));
  put("cHours","vHours",F("hours"));
  put("cPhone",null,C.phone);
  if(C.phone){$("#vPhone").textContent=C.phone;$("#vPhone").href="tel:"+S(C.phone).replace(/\s/g,"")}
  put("cMap",null,C.maps_url);
  if(C.maps_url)$("#vMap").href=C.maps_url;

  var op=$("#hOpen"),h=F("hours");
  if(h){op.hidden=false;op.textContent=h}else{op.hidden=true}
}

function swap(fn){
  if(document.startViewTransition&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    document.startViewTransition(fn)}else{fn()}
}
$("#langBtn").addEventListener("click",function(){
  swap(function(){lang=lang==="ar"?"en":"ar";
    try{localStorage.setItem("axis-lang",lang)}catch(e){}paint()})});
$("#themeBtn").addEventListener("click",function(){
  swap(function(){var n=root.getAttribute("data-theme")==="light"?"dark":"light";
    root.setAttribute("data-theme",n);
    try{localStorage.setItem("axis-theme",n)}catch(e){}
    var m=$("#metaTheme");if(m)m.setAttribute("content",n==="light"?"#F7F1E6":"#191512")})});

paint();

addEventListener("scroll",function(){
  $("#bar").classList.toggle("on",scrollY>420)},{passive:true});

if(!CSS.supports("animation-timeline: view()")&&"IntersectionObserver" in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
    e.target.animate([{opacity:0,transform:"translateY(28px)"},{opacity:1,transform:"none"}],
      {duration:700,easing:"cubic-bezier(.16,1,.3,1)",fill:"both"});io.unobserve(e.target)}})},
    {threshold:.1});
  $$(".rv").forEach(function(e){io.observe(e)});
}
})();
</script>
