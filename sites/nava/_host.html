<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#0a0a0a}
 #f{width:390px;height:844px;border:0;display:block}</style>
<iframe id="f" src="index.html"></iframe>
<script>
var y    = +(location.search.match(/y=(\d+)/)      || [0,0])[1];
var lang =  (location.search.match(/lang=(\w+)/)   || [0,"ar"])[1];
var f = document.getElementById("f");

function ready(){
  var w = f.contentWindow;
  return w && w.document && w.document.readyState === "complete" && w.document.body;
}
function go(){
  if(!ready()){ setTimeout(go, 120); return }
  var w = f.contentWindow, d = w.document;
  if(lang === "en" && d.documentElement.lang !== "en"){
    var b = d.getElementById("langBtn"); if(b) b.click();
  }
  // smooth scrolling never settles under virtual time — force it off
  d.documentElement.style.scrollBehavior = "auto";
  // teleporting straight to an offset leaves every below-the-fold image
  // unfetched, so the frame photographs its LQIP instead of the photo.
  // Every src is already assigned; only loading=lazy defers the fetch.
  d.querySelectorAll('img[loading="lazy"]').forEach(function(im){
    im.loading = "eager";
    im.src = im.src;            // re-kick any fetch the lazy flag deferred
  });
  setTimeout(function(){
    w.scrollTo(0, y);
    setTimeout(function(){
      w.scrollTo(0, y);         // settle after any late layout shift
      document.title = "at" + Math.round(w.scrollY) + "of" +
                       d.documentElement.scrollHeight;
    }, 900);
  }, 1600);
}
go();
</script>
