/* ══════════════════════════════════════════════════════════════════════
   THE HERO ENGINE — three scenes, one pin, one purpose each. GSAP
   ScrollTrigger only, scoped to #hero. No WebGL. Under reduced motion,
   #hero gets .static and the pin/scrub never initialises — three stacked
   full-height frames, full text always visible, no JS needed to read it.
   Full rationale in docs/nava-editorial-rebuild.md.
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  var hero = $("#hero"); if(!hero) return;
  /* Scene 0 is the LCP image and loads immediately. Scenes 1 and 2 are
     absolutely positioned inside the in-viewport sticky frame, so
     loading="lazy" defers nothing — all three used to fetch at once
     (~490KB racing the first paint). They are not revealed by the
     clip-path timeline until well into the hero scroll, so they now
     wait for the first scroll or an idle moment, whichever comes first. */
  function loadScene(i){
    var img = $("#hsImg"+i); if(!img || img.src) return;
    var key = HERO[i].key;
    img.srcset = [640,900,1300,1600].map(function(w){
      return JY_BASE+key+"-"+w+"."+IMG_EXT+" "+w+"w" }).join(", ");
    img.sizes = "100vw";
    img.src = JY_BASE+key+"-1300."+IMG_EXT;
  }
  loadScene(0);
  var restLoaded = false;
  function loadRest(){
    if(restLoaded) return; restLoaded = true;
    loadScene(1); loadScene(2);
  }
  addEventListener("scroll", loadRest, {once:true, passive:true});
  (window.requestIdleCallback || function(f){ setTimeout(f, 1800) })(loadRest, {timeout:3000});

  /* header theme flips exactly where the ivory world starts — measured
     from the DOM, not guessed from viewport multiples (which flipped the
     header to light while the hero was still dark). Registered before the
     reduced-motion early-return so both paths get it. */
  /* Ground awareness must work in BOTH directions: the old one-way
     threshold left a cream header slab sitting over four dark chapters
     (the full-bleed experience photo, the ticker, the editorial and the
     visit chapter). Now every chapter reports its own ground as it
     passes under the header line. */
  var LIGHT = ["#proof-strip","#chExp","#rf","#chMoments","#chServices"];
  var DARK  = ["#hero",".ticker",".ebm","#chVisit"];
  function groundAt(){
    var hdr = $("#hdr"), y = (hdr ? hdr.offsetHeight : 64) * 0.6, light = false;
    DARK.concat(LIGHT).forEach(function(sel){
      var el = document.querySelector(sel); if(!el) return;
      var r = el.getBoundingClientRect();
      if(r.top <= y && r.bottom > y) light = LIGHT.indexOf(sel) > -1;
    });
    /* #chExp is a photograph, not a cream ground — keep the header dark there */
    var ex = $("#chExp");
    if(ex){ var er = ex.getBoundingClientRect(); if(er.top <= y && er.bottom > y) light = false }
    hdr.classList.toggle("solid", scrollY > 40);
    hdr.classList.toggle("on-light", light);
  }
  addEventListener("scroll", groundAt, {passive:true});
  addEventListener("resize", groundAt);
  addEventListener("load", groundAt);
  groundAt();

  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduced){ hero.classList.add("static"); return }

  /* GSAP is deferred now, so it is NOT defined while this inline script
     parses. Wait for DOMContentLoaded (deferred scripts are guaranteed to
     have executed by then) and only fall back to static if it genuinely
     failed to load — e.g. the CDN is blocked. */
  function startHero(){
    if(typeof gsap === "undefined" || typeof ScrollTrigger === "undefined"){
      hero.classList.add("static"); return;
    }
    buildHeroTimeline();
  }
  if(document.readyState === "loading") addEventListener("DOMContentLoaded", startHero);
  else startHero();

  function buildHeroTimeline(){
  gsap.registerPlugin(ScrollTrigger);
  var scenes = $$(".hs", hero);

  gsap.matchMedia().add({
    isMobile:"(max-width: 760px)",
    isDesktop:"(min-width: 761px)"
  }, function(ctx){
    hero.classList.toggle("short", ctx.conditions.isMobile);

    /* the sequenced transition the directive specifies: outgoing text
       exits first, the incoming image reveals through a directional wipe
       (opacity stays 1 — the wipe edge divides the two photographs, so no
       frame ever shows two full-strength images blended), then the
       incoming text enters once the image has settled. */
    gsap.set(scenes[0], {clipPath:"inset(0 0 0 0)"});
    gsap.set([scenes[1],scenes[2]], {clipPath:"inset(0 0 0 100%)", opacity:1});
    gsap.set([scenes[1],scenes[2]].map(function(s){return s.querySelector("img")}),
      {scale:1.08});
    gsap.set([scenes[1],scenes[2]].map(function(s){return s.querySelector(".in")}),
      {opacity:0,y:24});

    var tl = gsap.timeline({
      scrollTrigger:{trigger:hero, start:"top top", end:"bottom bottom", scrub:1}
    });
    tl.to(scenes[0].querySelector(".in"),{opacity:0,y:-22,duration:.24,ease:"power2.in"},0)
      .to(scenes[0].querySelector("img"),{opacity:.8,duration:.5,ease:"none"},.3)
      .to(scenes[1].querySelector("img"),{scale:1.02,duration:.8,ease:"power1.out"},.25)
      .to(scenes[1],{clipPath:"inset(0 0 0 0%)",duration:.55,ease:"none"},.25)
      .to(scenes[1].querySelector(".in"),{opacity:1,y:0,duration:.2,ease:"power2.out"},.8)
      .to(scenes[1].querySelector(".in"),{opacity:0,y:-22,duration:.24,ease:"power2.in"},1.0)
      .to(scenes[1].querySelector("img"),{opacity:.8,duration:.5,ease:"none"},1.3)
      .to(scenes[2].querySelector("img"),{scale:1.02,duration:.8,ease:"power1.out"},1.25)
      .to(scenes[2],{clipPath:"inset(0 0 0 0%)",duration:.55,ease:"none"},1.25)
      .to(scenes[2].querySelector(".in"),{opacity:1,y:0,duration:.2,ease:"power2.out"},1.8);

    return function(){ tl.scrollTrigger && tl.scrollTrigger.kill(); tl.kill(); };
  });
  }
})();

/* ── entrance reveals for everything below the hero ──────────────────── */
(function(){
  var els = $$(".reveal");
  if(!els.length) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)){
    els.forEach(function(el){ el.classList.add("in") });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        entry.target.classList.add("in");
        io.unobserve(entry.target);
      }
    });
  },{threshold:0.18,rootMargin:"0px 0px -8% 0px"});
  els.forEach(function(el){ io.observe(el) });
})();

$("#yr").textContent = new Date().getFullYear();
paint();
</script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   THE LIVING LAYER — cursor glow, magnetic CTAs, molten hero
   split, count-ups, marquee, and the horizontal signature journey.
   ~6KB, no libraries beyond the GSAP already on the page. Every effect
   individually disabled under prefers-reduced-motion.
   ══════════════════════════════════════════════════════════════════════ */
(function(){
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var fine = matchMedia("(pointer:fine)").matches;
  var $ = function(s,r){return (r||document).querySelector(s)};
  var $$ = function(s,r){return [].slice.call((r||document).querySelectorAll(s))};

  /* ── hero headline: word-level molten reveal (Arabic-safe) ────────── */
  function splitHero(){
    var h = $("h1.ar-head"); if(!h) return;
    var words = h.textContent.trim().split(/\s+/);
    h.classList.remove("go");
    h.innerHTML = words.map(function(w,i){
      return '<span class="hw" style="transition-delay:'+(0.25+i*0.09).toFixed(2)+'s">'+w+'</span>';
    }).join(" ");
    requestAnimationFrame(function(){requestAnimationFrame(function(){h.classList.add("go")})});
  }
  splitHero();

  /* ── count-ups ────────────────────────────────────────────────────── */
  (function(){
    var els = $$("[data-count]"); if(!els.length) return;
    function run(el){
      var target = parseInt(el.dataset.count,10), t0 = null;
      if(reduced){ el.textContent = target; return }
      function tick(ts){
        if(!t0) t0 = ts;
        var p = Math.min(1,(ts-t0)/1200), e = 1-Math.pow(1-p,3);
        el.textContent = Math.round(target*e);
        if(p<1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }
    if(!("IntersectionObserver" in window)){ els.forEach(run); return }
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ run(e.target); io.unobserve(e.target) } });
    },{threshold:.4});
    els.forEach(function(el){ io.observe(el) });
  })();

  /* ── cursor glow + magnetic CTAs (one rAF, desktop only) ─────────── */
  (function(){
    if(!fine || reduced) return;
    var cur = $("#cur"); if(!cur) return;
    var mx=-100, my=-100, cx=-100, cy=-100, mag=null, magB=null;
    addEventListener("mousemove",function(e){
      mx=e.clientX; my=e.clientY;
      var t=e.target.closest("a,button,[data-open],.svc-card,.rf-res");
      cur.classList.toggle("big",!!t);
      var b=e.target.closest(".cta");
      if(b!==magB){ if(magB)magB.style.transform=""; magB=b }
    },{passive:true});
    (function loop(){
      requestAnimationFrame(loop);
      cx+=(mx-cx)*.18; cy+=(my-cy)*.18;
      cur.style.left=cx+"px"; cur.style.top=cy+"px";
      if(magB){
        var r=magB.getBoundingClientRect(),
            dx=mx-(r.left+r.width/2), dy=my-(r.top+r.height/2);
        magB.style.transform="translate("+(dx*.12).toFixed(1)+"px,"+(dy*.18).toFixed(1)+"px)";
      }
    })();
  })();

  /* ── the horizontal signature journey ─────────────────────────────── */
  var hzST = null;
  function buildHz(){
    var track = $("#hzTrack"), sec = $("#chMoments");
    if(!track || !sec) return;
    if(hzST){ hzST.kill(); hzST = null;
      if(window.gsap) gsap.set(track,{clearProps:"x"});
      track.classList.remove("hz-on");
    }
    if(reduced || !window.gsap || !window.ScrollTrigger) return;
    if(matchMedia("(max-width:900px)").matches) return;
    track.classList.add("hz-on");
    var dist = track.scrollWidth - innerWidth;
    if(dist < 60){ track.classList.remove("hz-on"); return }
    var rtl = document.documentElement.dir === "rtl";
    hzST = gsap.to(track,{x: rtl? dist : -dist, ease:"none",
      scrollTrigger:{trigger:sec, start:"top top", end:"+="+dist,
        scrub:.7, pin:true, anticipatePin:1}
    }).scrollTrigger;
  }
  /* mobile: the swipe gallery drives the progress dots */
  (function(){
    var track=$("#hzTrack"), dots=$("#hzDots"); if(!track||!dots) return;
    var d=[].slice.call(dots.children);
    function sync(){
      if(track.classList.contains("hz-on")) return;   // desktop pin owns it
      var w=track.clientWidth||1;
      var i=Math.round(Math.abs(track.scrollLeft)/w);
      d.forEach(function(x,k){ x.classList.toggle("on",k===Math.min(d.length-1,i)) });
    }
    track.addEventListener("scroll", sync, {passive:true});
    addEventListener("resize", sync);
    sync();
  })();

  function safeHz(){ try{ buildHz() }catch(e){} }
  if(document.readyState==="complete") safeHz(); else addEventListener("load", safeHz);
  addEventListener("resize", function(){ clearTimeout(window.__hzT);
    window.__hzT = setTimeout(buildHz, 250) });

  /* ── the ticker engine: rAF + measured pixels, wraps modulo one
     segment's width. No CSS keyframes, no percentages, no masks — the
     three things that each broke on iOS. Pauses offscreen and when the
     tab hides; reduced motion never starts it (CSS shows a static,
     centered single segment instead). ─────────────────────────────── */
  (function(){
    var row = $("#tkA"); if(!row) return;
    if(reduced) { window.__tkStart = function(){}; return; }
    var x = 0, segW = 0, last = 0, raf = 0, onscreen = true;
    var SPEED = 42;                       // px per second — calm, readable
    function measure(){
      var seg = row.querySelector(".tk-seg");
      segW = seg ? seg.getBoundingClientRect().width : 0;
    }
    function frame(ts){
      raf = requestAnimationFrame(frame);
      if(!last){ last = ts; return }
      var dt = Math.min(64, ts - last); last = ts;
      if(!segW){ measure(); if(!segW) return }
      x -= SPEED * dt / 1000;
      if(-x >= segW) x += segW;
      row.style.transform = "translate3d(" + x.toFixed(1) + "px,0,0)";
    }
    function start(){ if(!raf && onscreen && !document.hidden){ last = 0; raf = requestAnimationFrame(frame) } }
    function stop(){ cancelAnimationFrame(raf); raf = 0 }
    window.__tkStart = function(){ x = 0; segW = 0; measure(); start() };
    document.addEventListener("visibilitychange", function(){ document.hidden ? stop() : start() });
    if("IntersectionObserver" in window){
      new IntersectionObserver(function(es){
        onscreen = es[0].isIntersecting;
        onscreen ? start() : stop();
      },{rootMargin:"80px"}).observe(row.parentElement);
    }
    addEventListener("resize", function(){ segW = 0 });
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ segW = 0 });
    window.__tkStart();
  })();

  /* photographs fade up from their plate once decoded */
  (function(){
    function mark(img){ img.classList.add("ld") }
    function wire(){
      $$(".jewel img").forEach(function(img){
        var box = img.closest(".jewel");
        if(img.complete && img.naturalWidth){
          if(box) box.classList.add("fx");
          mark(img); return;
        }
        if(box) box.classList.add("fx");
        img.addEventListener("load", function(){ mark(img) }, {once:true});
        img.addEventListener("error", function(){ mark(img) }, {once:true});
      });
    }
    wire();
    /* cards are rebuilt on language switch — re-wire after each repaint */
    var lb = $("#langBtn");
    if(lb) lb.addEventListener("click", function(){ setTimeout(wire, 80) });
    addEventListener("load", wire);
  })();

  /* ── the card river: same pixel engine as the ticker + finger drag.
     Drift pauses while touching, resumes 1.6s after release; a drag of
     more than 6px swallows the click so cards never open by accident. ── */
  (function(){
    var track = $("#svcGrid"); if(!track) return;
    if(reduced){ window.__svStart = function(){}; return; }
    var x=0, half=0, last=0, raf=0, onscreen=true, holding=false, resumeT=0;
    var SPEED = 26;
    function measure(){ half = track.scrollWidth / 2 }
    function apply(){
      if(half){ while(-x >= half) x += half; while(x > 0) x -= half; }
      track.style.transform = "translate3d(" + x.toFixed(1) + "px,0,0)";
    }
    function frame(ts){
      raf = requestAnimationFrame(frame);
      if(!last){ last = ts; return }
      var dt = Math.min(64, ts - last); last = ts;
      if(holding || ts < resumeT) return;
      if(!half){ measure(); if(!half) return }
      x -= SPEED * dt / 1000;
      apply();
    }
    function start(){ if(!raf && onscreen && !document.hidden){ last = 0; raf = requestAnimationFrame(frame) } }
    function stop(){ cancelAnimationFrame(raf); raf = 0 }
    window.__svStart = function(){ x = 0; half = 0; measure(); apply(); start() };
    /* drag */
    var px=0, moved=0;
    track.addEventListener("pointerdown", function(e){
      holding = true; moved = 0; px = e.clientX;
      track.classList.add("drag");
      track.setPointerCapture && track.setPointerCapture(e.pointerId);
    });
    track.addEventListener("pointermove", function(e){
      if(!holding) return;
      var dx = e.clientX - px; px = e.clientX;
      moved += Math.abs(dx);
      x += dx; apply();
    });
    function release(){
      if(!holding) return;
      holding = false; track.classList.remove("drag");
      resumeT = performance.now() + 1600;
    }
    track.addEventListener("pointerup", release);
    track.addEventListener("pointercancel", release);
    track.addEventListener("click", function(e){
      if(moved > 6){ e.stopPropagation(); e.preventDefault() }
    }, true);
    document.addEventListener("visibilitychange", function(){ document.hidden ? stop() : start() });
    if("IntersectionObserver" in window){
      new IntersectionObserver(function(es){
        onscreen = es[0].isIntersecting;
        onscreen ? start() : stop();
      },{rootMargin:"80px"}).observe(track.parentElement);
    }
    addEventListener("resize", function(){ half = 0 });
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ half = 0 });
    window.__svStart();
  })();

  /* ── smart service search: type anything, land in booking ────────── */
  /* Arabic search that actually behaves: strips tashkeel, folds
     alef/ya/ta-marbuta variants and the ال prefix, so "الاظافر" finds
     "الأظافر" and "صبغه" finds "صبغة". Plain lowercase matching failed
     every one of those. */
  function normAr(x){
    return (x||"").toLowerCase()
      .replace(/[\u064B-\u0652\u0640]/g,"")
      .replace(/[\u0623\u0625\u0622\u0671]/g,"\u0627")
      .replace(/\u0649/g,"\u064A").replace(/\u0629/g,"\u0647")
      .replace(/\u0624/g,"\u0648").replace(/\u0626/g,"\u064A")
      .replace(/^ال/,"").replace(/\s+/g," ").trim();
  }
  /* everyday words a customer types that never appear in the menu */
  var SYN={ "وش":"وجه بشرة", "وجه":"بشرة هيدرافيشل", "شعري":"شعر",
    "ايدي":"يد اظافر", "ايد":"يد اظافر", "رجلي":"قدم", "رجل":"قدم",
    "ضفاير":"تسريحة", "عروسة":"عرايس", "عروس":"عرايس", "زفاف":"عرايس مكياج",
    "تنعيم":"معالج كيراتين", "كيراتين":"معالج تنعيم", "حواجب":"حاجب",
    "مساچ":"مساج", "استرخاء":"مساج", "تدليك":"مساج", "سبا":"مساج حمام",
    "نظافة":"تنظيف", "بديكير":"قدم تنظيف", "منيكير":"يد تنظيف" };
  function expand(q){
    var out=[q]; var w=q.split(" ");
    w.forEach(function(x){ if(SYN[x]) out.push(SYN[x]) });
    return out.join(" ");
  }

  (function(){
    var inp=$("#svcFind"), box=$("#svcHits"); if(!inp||typeof CONFIG==="undefined") return;
    var sel=-1, hits=[], ALL=null;
    function flatten(){
      var out=[];
      CONFIG.menu.forEach(function(c){c.items.forEach(function(it){out.push({c:c,it:it})})});
      return out;
    }
    function hide(){ box.hidden=true; inp.setAttribute("aria-expanded","false"); sel=-1 }
    function paintHits(q){
      box.innerHTML=""; sel=-1;
      if(!q){ hide(); return }
      ALL = ALL || flatten();
      var terms = normAr(expand(normAr(q))).split(" ").filter(Boolean);
      hits = ALL.filter(function(x){
        var hay = normAr(x.it.a + " " + x.it.e + " " + x.c.ar + " " + x.c.en);
        return terms.some(function(t){ return t.length>1 && hay.indexOf(t)>-1 });
      });
      /* an exact phrase match should outrank a synonym expansion */
      var exact = normAr(q);
      hits.sort(function(a,b){
        var A = normAr(a.it.a+" "+a.it.e).indexOf(exact)>-1 ? 0 : 1;
        var B = normAr(b.it.a+" "+b.it.e).indexOf(exact)>-1 ? 0 : 1;
        return A-B;
      });
      if(!hits.length){ hide(); return }
      clearTimeout(window.__sTrk);
      window.__sTrk=setTimeout(function(){track("service_search",{q:q,hits:hits.length})},600);
      hits.slice(0,6).forEach(function(x){
        var p=priceOf(x.it);
        var b=document.createElement("button");
        b.type="button"; b.className="svc-hit"; b.setAttribute("role","option");
        b.innerHTML='<span class="h-n"><b></b><i></i></span><span class="h-v"></span>';
        b.querySelector("b").textContent=nameOf(x.it);
        b.querySelector("i").textContent=catName(x.c);
        b.querySelector(".h-v").textContent=p.v+" "+t.sar;
        b.addEventListener("click",function(){ hide(); inp.value=""; pick(x.c,x.it,p) });
        box.appendChild(b);
      });
      if(hits.length>6){
        var m=document.createElement("button");
        m.type="button"; m.className="svc-hit more";
        m.textContent=t.svcMore(hits.length-6);
        m.addEventListener("click",function(){
          var q2=inp.value; hide();
          /* open the category holding the MOST matches, not the first
             match's category — "تنظيف" belongs in nails (20 hits), not
             hair (1 hit) */
          var counts={};
          hits.forEach(function(x){ counts[x.c.k]=(counts[x.c.k]||0)+1 });
          var best=hits[0].c.k;
          Object.keys(counts).forEach(function(k){ if(counts[k]>counts[best]) best=k });
          openList(best);
          $("#plFind").value=q2; paintList();
        });
        box.appendChild(m);
      }
      box.hidden=false; inp.setAttribute("aria-expanded","true");
    }
    inp.addEventListener("input",function(){ paintHits(inp.value.trim()) });
    inp.addEventListener("keydown",function(e){
      var os=[].slice.call(box.querySelectorAll(".svc-hit"));
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){
        e.preventDefault();
        sel += e.key==="ArrowDown"?1:-1;
        sel = Math.max(0,Math.min(os.length-1,sel));
        os.forEach(function(o,i){o.classList.toggle("sel",i===sel)});
      } else if(e.key==="Enter"){
        e.preventDefault();
        if(os[sel]) os[sel].click(); else if(os[0]) os[0].click();
      } else if(e.key==="Escape"){ hide() }
    });
    document.addEventListener("click",function(e){
      if(!e.target.closest(".svc-search")) hide();
    });
    var un=$("#svcUnsure");
    if(un) un.addEventListener("click",function(){
      track("ritual_start",{source:"svc_search"});
      rfStep(rf.sel.length?3:0); openDlg($("#rfDlg"));
    });
  })();

  /* how far in you are — one rAF-free scroll handler */
  (function(){
    var bar=$("#prog"); if(!bar) return; var i=bar.firstElementChild;
    function up(){
      var h=document.documentElement.scrollHeight-innerHeight;
      i.style.width=(h>0?Math.min(100,(scrollY/h)*100):0).toFixed(1)+"%";
    }
    addEventListener("scroll",up,{passive:true}); addEventListener("resize",up); up();
  })();

  /* share: the owner sends this link to her own customers — native sheet
     where it exists, clipboard everywhere else */
  (function(){
    var b=$("#shareBtn"); if(!b) return;
    b.addEventListener("click",function(){
      var url=location.href;
      track("share_click",{});
      if(navigator.share){
        navigator.share({title:t.shareTitle,text:t.shareText,url:url}).catch(function(){});
        return;
      }
      try{ navigator.clipboard.writeText(url) }catch(e){}
      b.classList.add("ok");
      var old=b.getAttribute("aria-label");
      b.setAttribute("aria-label",t.shared);
      setTimeout(function(){ b.classList.remove("ok"); b.setAttribute("aria-label",old) },1800);
    });
  })();

  /* "/" focuses search from anywhere — the shortcut power users expect */
  addEventListener("keydown",function(e){
    if(e.key==="/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)
       && !document.querySelector("dialog[open]")){
      var f=$("#svcFind"); if(f){ e.preventDefault();
        f.scrollIntoView({block:"center"}); setTimeout(function(){f.focus()},260) }
    }
  });

  /* ── the index: a floating arrow that opens the page map ─────────── */
  (function(){
    var btn=$("#idxBtn"), panel=$("#idxPanel"); if(!btn) return;
    function close(){ panel.classList.remove("open"); btn.setAttribute("aria-expanded","false") }
    btn.addEventListener("click",function(e){
      e.stopPropagation();
      var open=panel.classList.toggle("open");
      btn.setAttribute("aria-expanded",open?"true":"false");
      if(open){
        var ids=["hero","chExp","rf","chMoments","chServices","chVisit"], cur="hero";
        ids.forEach(function(id){ var el=document.getElementById(id);
          if(el && el.getBoundingClientRect().top<=innerHeight*.5) cur=id });
        [].slice.call(panel.querySelectorAll("a")).forEach(function(a){
          a.classList.toggle("now", a.getAttribute("href")==="#"+cur)});
      }
    });
    panel.addEventListener("click",function(e){ if(e.target.closest("a")) close() });
    document.addEventListener("click",function(e){ if(!e.target.closest("#idx")) close() });
    document.addEventListener("keydown",function(e){ if(e.key==="Escape") close() });
  })();

  /* language toggle: re-split the hero + rebuild the horizontal pin —
     registered after the main script's own listener, so paint() has
     already refilled every data-t hook by the time this runs. */
  var lb = $("#langBtn");
  if(lb) lb.addEventListener("click", function(){
    try{ splitHero() }catch(e){}
    setTimeout(function(){ try{ buildHz() }catch(e){} }, 60);
  });
})();
</script>
