<!doctype html><meta charset="utf-8">
<style>html,body{margin:0}#f{width:390px;height:844px;border:0;display:block}</style>
<iframe id="f" src="index.html"></iframe>
<script>
function ready(){var w=document.getElementById("f").contentWindow;
  return w&&w.document&&w.document.readyState==="complete"&&w.document.body}
function go(){
  if(!ready()){setTimeout(go,120);return}
  setTimeout(function(){
    var w=document.getElementById("f").contentWindow,d=w.document;
    var de=d.documentElement, out=[];
    out.push("VIEWPORT client="+de.clientWidth+" scroll="+de.scrollWidth+
             " overflow="+(de.scrollWidth-de.clientWidth));
    out.push("dir="+de.dir+" lang="+de.lang);
    var rows=[];
    d.querySelectorAll("*").forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.width===0&&r.height===0) return;
      var over = Math.max(r.right-de.clientWidth, -r.left);
      if(over>1){
        rows.push([over, el.tagName.toLowerCase()+
          (el.id?"#"+el.id:"")+(el.className&&el.className.baseVal===undefined?"."+String(el.className).trim().split(/\s+/).join("."):"")+
          " L"+Math.round(r.left)+" R"+Math.round(r.right)+" W"+Math.round(r.width)]);
      }
    });
    rows.sort(function(a,b){return b[0]-a[0]});
    rows.slice(0,18).forEach(function(x){out.push("  +"+Math.round(x[0])+"  "+x[1])});
    out.push("STICKY-BREAKING ANCESTORS:");
    ["html","body"].forEach(function(sel){
      var cs=w.getComputedStyle(d.querySelector(sel));
      out.push("  "+sel+" overflow-x="+cs.overflowX+" overflow-y="+cs.overflowY);
    });
    document.title="RPT"+out.join(" || ");
  },1800);
}
go();
</script>
