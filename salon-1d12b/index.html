<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   AXIS — demo template v6  ·  "the arrival"
   v5 fixed the colour. This one is about the first four seconds and the
   scroll: a curtain that lifts, a name that unmasks line by line, tiles
   that deal in, headings that wipe open as they enter, photographs that
   stack and recede, a rail that travels sideways while the page travels
   down, and counters that count. Still zero animation libraries — every
   frame is CSS, on animation-timeline.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --fa:"Tajawal",system-ui,sans-serif;
  --fl:"Outfit",system-ui,sans-serif;
  --f:var(--fa);
  --e:cubic-bezier(.16,1,.3,1);
  --eo:cubic-bezier(.34,1.56,.64,1);
  --r:clamp(20px,3.4vw,28px);
  --r-s:16px;
  --pad:clamp(3.5rem,8vw,6.5rem);
  --sx:1;
}
html[lang="en"]{--f:var(--fl)}
html[dir="rtl"]{--sx:-1}

html[data-theme="light"]{
  --paper:#FAF4EA;  --paper:oklch(96.5% .020 88);
  --paper2:#F1E7D8; --paper2:oklch(93% .030 86);
  --card:#FFFFFF;   --card:oklch(100% 0 0);
  --ink:#241C15;    --ink:oklch(22% .026 60);
  --dim:rgba(36,28,21,.60); --dim:oklch(22% .026 60/.60);
  --green:#4E8C56;  --green:oklch(58% .115 150);
  --green-s:#DCEBD6;--green-s:oklch(91% .045 148);
  --coral:#E2624A;  --coral:oklch(65% .155 35);
  --coral-s:#FBDDD3;--coral-s:oklch(91% .045 40);
  --plum:#8E4585;   --plum:oklch(48% .135 330);
  --plum-s:#F0DCEE; --plum-s:oklch(90% .045 330);
  --amber:#C98A21;  --amber:oklch(68% .130 80);
  --amber-s:#FAEBCB;--amber-s:oklch(93% .050 85);
  --line:rgba(36,28,21,.11); --line:oklch(22% .026 60/.11);
  --on:#FFFFFF;     --on:oklch(100% 0 0);
  --sh:0 14px 34px -18px rgba(60,44,24,.30);
  --sh-l:0 30px 70px -30px rgba(60,44,24,.38);
  --img:saturate(1.06) contrast(1.02);
  --sheen:oklch(22% .026 60/.05);
}
html[data-theme="dark"]{
  --paper:#0F1113;  --paper:oklch(16% .008 250);
  --paper2:#15181B; --paper2:oklch(19.5% .010 250);
  --card:#1B1F23;   --card:oklch(23% .012 250);
  --ink:#F2F0EC;    --ink:oklch(95% .006 90);
  --dim:rgba(242,240,236,.62); --dim:oklch(95% .006 90/.62);
  --green:#7FCB86;  --green:oklch(78% .125 150);
  --green-s:#22362A;--green-s:oklch(28% .045 150);
  --coral:#FF8A6E;  --coral:oklch(76% .140 35);
  --coral-s:#3A241F;--coral-s:oklch(28% .050 35);
  --plum:#E08AD4;   --plum:oklch(75% .130 330);
  --plum-s:#332231; --plum-s:oklch(28% .050 330);
  --amber:#F0BE5E;  --amber:oklch(82% .120 82);
  --amber-s:#3A2E19;--amber-s:oklch(28% .050 82);
  --line:rgba(242,240,236,.13); --line:oklch(95% .006 90/.13);
  --on:#0F1113;     --on:oklch(16% .008 250);
  --sh:0 14px 34px -18px rgba(0,0,0,.7);
  --sh-l:0 30px 70px -30px rgba(0,0,0,.85);
  --img:saturate(1.03) contrast(1.05) brightness(.94);
  --sheen:oklch(95% .006 90/.07);
}

*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f);
  font-size:clamp(1rem,.95rem + .22vw,1.09rem);line-height:1.8;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;transition:background .5s var(--e),color .5s var(--e)}
html[lang="en"] .tr{letter-spacing:.15em;text-transform:uppercase}
html[lang="ar"] .tr{letter-spacing:normal}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
h1,h2,h3{font-weight:800;line-height:1.3;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.42}
p{text-wrap:pretty}
::selection{background:var(--green);color:var(--on)}
.wrap{width:min(1200px,92vw);margin-inline:auto;position:relative}
section{position:relative}

/* ══════════════ THE ARRIVAL ══════════════
   A curtain in the page colour lifts away, so the first thing that happens
   is the salon's name resolving — not a spinner, and not a blank white
   frame while fonts decide to arrive. */
#curtain{position:fixed;inset:0;z-index:300;background:var(--paper);
  display:grid;place-items:center;animation:lift 1s var(--e) 1.15s forwards}
#curtain .mk{display:flex;gap:.5rem;align-items:center;animation:mkOut .5s ease .95s forwards}
#curtain .dot{width:12px;height:12px;border-radius:50%;background:var(--green);
  animation:bounce .9s var(--eo) infinite alternate}
#curtain .dot:nth-child(2){background:var(--coral);animation-delay:.12s}
#curtain .dot:nth-child(3){background:var(--plum);animation-delay:.24s}
@keyframes bounce{from{transform:translateY(6px) scale(.85);opacity:.5}to{transform:translateY(-6px) scale(1);opacity:1}}
@keyframes mkOut{to{opacity:0;transform:scale(.85)}}
@keyframes lift{to{transform:translateY(-101%)}}
/* the sweep that follows the curtain up */
#sweep{position:fixed;inset-inline:0;top:0;height:4px;z-index:301;transform-origin:0 50%;
  background:linear-gradient(90deg,var(--green),var(--amber),var(--coral),var(--plum));
  animation:sweepIn .7s var(--e) .3s both,sweepOut .5s var(--e) 1.5s forwards}
@keyframes sweepIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sweepOut{to{opacity:0}}
html[dir="rtl"] #sweep{transform-origin:100% 50%}

/* staged entrance — each piece has its own beat */
.in-1,.in-2,.in-3,.in-4,.in-5{animation:enter .8s var(--e) both}
.in-1{animation-delay:1.25s}.in-2{animation-delay:1.4s}.in-3{animation-delay:1.62s}
.in-4{animation-delay:1.78s}.in-5{animation-delay:1.92s}
@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
/* the name unmasks word by word from behind its own baseline */
.h-name span{display:inline-block;animation:unmask .85s var(--e) both}
@keyframes unmask{from{opacity:0;clip-path:inset(0 0 105% 0);transform:translateY(.42em)}
                  to{opacity:1;clip-path:inset(0 0 -18% 0);transform:none}}
/* tiles are dealt onto the table */
.bento .tile{animation:deal .8s var(--eo) both}
.bento .tile:nth-child(1){animation-delay:1.95s}
.bento .tile:nth-child(2){animation-delay:2.05s}
.bento .tile:nth-child(3){animation-delay:2.13s}
.bento .tile:nth-child(4){animation-delay:2.21s}
.bento .tile:nth-child(5){animation-delay:2.29s}
@keyframes deal{from{opacity:0;transform:translateY(56px) rotate(calc(var(--sx) * -3deg)) scale(.94)}
                to{opacity:1;transform:none}}

/* ══════════════ SCROLL CHOREOGRAPHY ══════════════ */
.rv{opacity:1}
@supports (animation-timeline: view()){
  .rv{animation:rise both;animation-timeline:view();animation-range:entry 2% cover 26%}
  @keyframes rise{from{opacity:0;transform:translateY(38px) scale(.97)}to{opacity:1;transform:none}}

  /* headings wipe open as they enter */
  .mask{animation:wipe linear both;animation-timeline:view();animation-range:entry 12% entry 88%}
  @keyframes wipe{from{clip-path:inset(0 0 100% 0);opacity:.25}to{clip-path:inset(0 0 -12% 0);opacity:1}}

  /* cards arrive in sequence, each with its own tilt */
  .stagger>*{animation:tilt both;animation-timeline:view();animation-range:entry 0% cover 24%}
  @keyframes tilt{from{opacity:0;transform:translateY(48px) rotate(calc(var(--sx) * -2deg)) scale(.95)}
                  to{opacity:1;transform:none}}

  .drift img{animation:drift linear both;animation-timeline:view();animation-range:cover}
  @keyframes drift{from{transform:scale(1.24) translateY(-5%)}to{transform:scale(1.24) translateY(5%)}}

  #recede{animation:recede linear both;animation-timeline:view();animation-range:exit 0% exit 100%}
  @keyframes recede{to{opacity:0;transform:translateY(-46px) scale(.95);filter:blur(6px)}}

  .num{animation:tick .1s linear both;animation-timeline:view();animation-range:entry 22% entry 92%}
  @keyframes tick{to{--n:var(--to)}}

  #prog{animation:fill linear both;animation-timeline:scroll(root)}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  .rail{animation:slide linear both;animation-timeline:view();animation-range:cover}
  @keyframes slide{from{transform:translateX(calc(var(--sx) * -4%))}
                   to{transform:translateX(calc(var(--sx) * 26%))}}

  /* stacked photographs: each recedes as the next arrives on top */
  .stack .ph{animation:sink linear both;animation-timeline:view();animation-range:exit -12% exit 92%}
  @keyframes sink{to{transform:scale(.9) translateY(-4%);opacity:.45;filter:saturate(.55)}}
}
@property --n{syntax:"<integer>";initial-value:0;inherits:false}
.num{counter-reset:n var(--n)}
.num::after{content:counter(n)}

#prog{position:fixed;top:0;inset-inline:0;height:3px;z-index:130;transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--green),var(--amber),var(--coral),var(--plum))}
html[dir="rtl"] #prog{transform-origin:100% 50%}

#ctrl{position:fixed;top:0;inset-inline-end:0;z-index:140;display:flex;gap:.45rem;
  padding:.8rem clamp(.8rem,3vw,1.4rem);padding-top:calc(.8rem + env(safe-area-inset-top));
  animation:enter .7s var(--e) 1.5s both}
#ctrl button{cursor:pointer;font-family:var(--f);display:inline-flex;align-items:center;justify-content:center;
  height:42px;min-width:46px;padding:0 .85rem;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:.82rem;font-weight:700;box-shadow:var(--sh);
  transition:transform .3s var(--e)}
#ctrl button:hover{transform:translateY(-2px)}
#ctrl button:active{transform:scale(.93)}
#ctrl svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#themeBtn .sun{display:none}
html[data-theme="dark"] #themeBtn .sun{display:block}
html[data-theme="dark"] #themeBtn .moon{display:none}

/* ══ atoms ══ */
.chip{display:inline-flex;align-items:center;gap:.42rem;padding:.44rem 1rem;border-radius:999px;
  font-size:.85rem;font-weight:600;background:var(--card);border:1px solid var(--line);
  white-space:nowrap;flex:none}
.chip.g{background:var(--green-s);border-color:transparent;color:var(--green)}
.chip.c{background:var(--coral-s);border-color:transparent;color:var(--coral)}
.chip.p{background:var(--plum-s);border-color:transparent;color:var(--plum)}
.chip.a{background:var(--amber-s);border-color:transparent;color:var(--amber)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
/* one clean line that scrolls, instead of a ragged three-row wrap */
.row{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;
  -ms-overflow-style:none;padding-block:.15rem;
  -webkit-mask-image:linear-gradient(to var(--fade,left),#000 82%,transparent);
  mask-image:linear-gradient(to var(--fade,left),#000 82%,transparent)}
html[dir="rtl"] .row{--fade:left}
html[dir="ltr"] .row{--fade:right}
.row::-webkit-scrollbar{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;padding:1.02rem 1.5rem;
  border-radius:999px;font-family:var(--f);font-weight:700;font-size:1rem;position:relative;overflow:hidden;
  transition:transform .3s var(--e),box-shadow .4s;box-shadow:var(--sh)}
.btn svg{width:20px;height:20px;flex:none}
.btn-p{background:var(--green);color:var(--on)}
.btn-p::after{content:"";position:absolute;top:0;bottom:0;width:35%;inset-inline-start:-50%;
  background:linear-gradient(105deg,transparent,color-mix(in oklab,var(--on) 45%,transparent),transparent);
  transform:skewX(-18deg);animation:gleam 4.5s ease-in-out 2.6s infinite}
@keyframes gleam{0%,62%{inset-inline-start:-50%}84%,100%{inset-inline-start:125%}}
.btn-o{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:hover{transform:translateY(-3px);box-shadow:var(--sh-l)}
.btn:active{transform:scale(.97)}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:700;color:var(--coral)}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:currentColor}
.h2{font-size:clamp(1.75rem,4.8vw,3rem);margin:.7rem 0 0}
.lead{color:var(--dim);margin-top:.85rem;max-width:56ch}
.ph{position:relative;overflow:hidden;background:var(--paper2);border-radius:var(--r)}
.ph img{width:100%;height:100%;object-fit:cover;filter:var(--img)}
.ph img.dead{display:none}

/* ══ HERO ══ */
#hero{padding:clamp(5.5rem,13vh,8rem) 0 clamp(2rem,5vw,3rem);overflow:hidden}
.blob{position:absolute;border-radius:50%;pointer-events:none;z-index:0;filter:blur(8px);
  animation:float 22s ease-in-out infinite alternate}
.blob.b1{inset-inline-end:-20vw;top:-24vh;width:74vw;aspect-ratio:1;
  background:radial-gradient(circle,color-mix(in oklab,var(--coral) 40%,transparent),transparent 68%)}
.blob.b2{inset-inline-start:-24vw;top:26vh;width:64vw;aspect-ratio:1;animation-delay:-8s;
  background:radial-gradient(circle,color-mix(in oklab,var(--green) 42%,transparent),transparent 68%)}
.blob.b3{inset-inline-end:8vw;top:52vh;width:40vw;aspect-ratio:1;animation-delay:-15s;
  background:radial-gradient(circle,color-mix(in oklab,var(--plum) 34%,transparent),transparent 68%)}
@keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(3%,5%,0) scale(1.14)}}
#hero .wrap{z-index:2}
.h-top{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.h-name{font-size:clamp(2.3rem,8.4vw,5.6rem);font-weight:900;margin:1rem 0 0}
.h-cta{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1.8rem;max-width:520px}
.h-strip{margin-top:1.3rem}

/* ══ BENTO ══ */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(10px,1.4vw,15px);
  margin-top:clamp(1.8rem,4.5vw,2.8rem)}
.tile{border-radius:var(--r);padding:clamp(1.15rem,2.3vw,1.7rem);position:relative;overflow:hidden;
  box-shadow:var(--sh);transition:transform .35s var(--e),box-shadow .35s;
  background:var(--card);border:1px solid var(--line)}
.tile:hover{transform:translateY(-4px)!important;box-shadow:var(--sh-l)}
/* a slow light passes over the tiles so the grid is never fully still */
.tile::before{content:"";position:absolute;top:-40%;bottom:-40%;width:45%;inset-inline-start:-60%;
  pointer-events:none;transform:skewX(-16deg);
  background:linear-gradient(100deg,transparent,var(--sheen),transparent);
  animation:pass 9s ease-in-out infinite}
.tile:nth-child(2)::before{animation-delay:-1.6s}
.tile:nth-child(3)::before{animation-delay:-3.1s}
.tile:nth-child(4)::before{animation-delay:-4.6s}
.tile:nth-child(5)::before{animation-delay:-6.1s}
@keyframes pass{0%,55%{inset-inline-start:-60%}90%,100%{inset-inline-start:135%}}
.tile .k{font-size:.75rem;font-weight:700;margin-bottom:.35rem;opacity:.9}
.tile .big{font-size:clamp(1.9rem,5vw,3.1rem);font-weight:900;line-height:1.08}
.tile .sm{font-size:.86rem;opacity:.72;margin-top:.25rem}
.t-photo{padding:0;grid-column:span 3;min-height:clamp(210px,26vw,320px);border:0}
.t-photo .ph{position:absolute;inset:0;border-radius:inherit}
.t-rate{grid-column:span 3;background:var(--green-s);border-color:transparent;color:var(--green);
  display:flex;flex-direction:column;justify-content:center}
.t-rate .stars{font-size:1.1rem;letter-spacing:2px}
.t-a{grid-column:span 2;background:var(--amber-s);border-color:transparent;color:var(--amber)}
.t-c{grid-column:span 2;background:var(--coral-s);border-color:transparent;color:var(--coral)}
.t-wa{grid-column:span 2;background:var(--green);border-color:transparent;color:var(--on);
  display:flex;flex-direction:column;justify-content:space-between;gap:.9rem;min-height:150px}
.t-wa .go{display:inline-flex;align-items:center;gap:.45rem;font-weight:700;font-size:.94rem}
.t-wa svg{width:19px;height:19px}
.t-wa .big{font-size:clamp(1.25rem,3vw,1.7rem)}
@media(max-width:900px){
  .bento{grid-template-columns:repeat(4,1fr)}
  .t-photo,.t-rate{grid-column:span 4}
  .t-a,.t-c{grid-column:span 2}
  .t-wa{grid-column:span 4}
}
@media(max-width:560px){
  .bento{grid-template-columns:repeat(2,1fr)}
  .t-photo,.t-rate,.t-wa{grid-column:span 2}
  .t-a,.t-c{grid-column:span 1}
}

/* ══ TICKER ══ */
#ticker{margin-top:clamp(2rem,5vw,3rem);padding:.9rem 0;overflow:hidden;
  border-block:1px solid var(--line);background:var(--paper2)}
#ticker .run{display:flex;width:max-content;animation:run 32s linear infinite}
#ticker span{display:flex;align-items:center;gap:1.8rem;padding-inline-end:1.8rem;
  font-weight:700;font-size:1.02rem;white-space:nowrap;color:var(--dim)}
#ticker b{width:7px;height:7px;border-radius:50%;background:var(--coral);flex:none}
@keyframes run{to{transform:translateX(-50%)}}
html[dir="rtl"] #ticker .run{animation-name:runr}
@keyframes runr{to{transform:translateX(50%)}}

/* ══ SERVICES ══ */
#svc{padding:var(--pad) 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));
  gap:clamp(10px,1.4vw,15px);margin-top:clamp(1.8rem,4.5vw,2.8rem)}
.svc{border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:1.45rem 1.35rem;
  display:flex;flex-direction:column;gap:.3rem;box-shadow:var(--sh);position:relative;overflow:hidden;
  transition:transform .35s var(--e),box-shadow .35s}
.svc:hover{transform:translateY(-5px)!important;box-shadow:var(--sh-l)}
.svc::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--green)}
.svc:nth-child(4n+2)::before{background:var(--coral)}
.svc:nth-child(4n+3)::before{background:var(--plum)}
.svc:nth-child(4n+4)::before{background:var(--amber)}
.svc .no{font-family:var(--fl);font-size:.76rem;font-weight:700;opacity:.5}
.svc .nm{font-size:1.14rem;font-weight:700}
.svc .ds{font-size:.87rem;color:var(--dim);flex:1}
.svc .pr{margin-top:.75rem;align-self:flex-start;display:inline-flex;align-items:baseline;gap:.28rem;
  padding:.32rem .85rem;border-radius:999px;font-weight:800;font-size:1.02rem;background:var(--paper2)}
.svc .pr small{font-size:.66em;font-weight:600;opacity:.7}

/* ══ GALLERY — stacked, each recedes under the next ══ */
#gal{padding:var(--pad) 0;background:var(--paper2);overflow:clip}
.stack{margin-top:clamp(1.8rem,4.5vw,2.8rem);display:flex;flex-direction:column;gap:clamp(1rem,3vw,2rem)}
.stack .ph{position:sticky;top:clamp(4.5rem,14vh,7rem);aspect-ratio:4/3;box-shadow:var(--sh-l)}
@media(min-width:900px){.stack .ph{aspect-ratio:16/9}}

/* ══ REVIEWS ══ */
#say{padding:var(--pad) 0}
.says{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,285px),1fr));
  gap:clamp(10px,1.4vw,15px);margin-top:clamp(1.8rem,4.5vw,2.8rem)}

$("#langBtn").addEventListener("click",function(){
  swap(function(){lang=lang==="ar"?"en":"ar";
    try{localStorage.setItem("axis-lang",lang)}catch(e){}paint()})});
$("#themeBtn").addEventListener("click",function(){
  swap(function(){var n=root.getAttribute("data-theme")==="light"?"dark":"light";
    root.setAttribute("data-theme",n);
    try{localStorage.setItem("axis-theme",n)}catch(e){}
    var m=$("#metaTheme");if(m)m.setAttribute("content",n==="light"?"#FAF4EA":"#0F1113")})});

paint();

/* the curtain is animation-only; remove it once it is gone so it can never
   sit on top of a tap target if an animation event is missed */
setTimeout(function(){var c=$("#curtain");if(c&&c.parentNode)c.parentNode.removeChild(c);
  var s=$("#sweep");if(s&&s.parentNode)s.parentNode.removeChild(s)},2600);

addEventListener("scroll",function(){
  $("#bar").classList.toggle("on",scrollY>420)},{passive:true});

if(!CSS.supports("animation-timeline: view()")&&"IntersectionObserver" in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
    e.target.animate([{opacity:0,transform:"translateY(30px)"},{opacity:1,transform:"none"}],
      {duration:700,easing:"cubic-bezier(.16,1,.3,1)",fill:"both"});io.unobserve(e.target)}})},
    {threshold:.1});
  $$(".rv").concat($$(".stagger>*")).forEach(function(e){io.observe(e)});
}
})();
</script>
</body>
</html>
