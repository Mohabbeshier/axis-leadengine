<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E0A07" id="metaTheme">
<meta name="robots" content="noindex">
<title>صالون</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<!-- non-blocking: this is opened cold on salon owners' phones over WhatsApp —
     a slow/dead connection to the font host must never leave the page blank -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"></noscript>

<!-- pre-paint: pick theme + language before first frame so there is no flash -->
<script>
(function(){try{
  var t=localStorage.getItem("axis-theme");
  if(!t)t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
  document.documentElement.setAttribute("data-theme",t);
  var l=localStorage.getItem("axis-lang")||"ar";
  document.documentElement.setAttribute("lang",l);
  document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");
}catch(e){}})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════════
   AXIS · غرفة الذهب — bilingual, dual-theme, living imagery
   Two full color-worlds (noir-gold / ivory-gold). Photographs stay
   photographs: the scrim guarantees contrast, it never buries them.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --fd:"Aref Ruqaa",serif;
  --fb:"El Messiri",sans-serif;
  --fl:"Cormorant Garamond",serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
html[lang="en"]{--fd:"Cormorant Garamond",serif;--fb:"Cormorant Garamond",serif}

/* ── DARK WORLD ── */
html[data-theme="dark"]{
  --bg:#0E0A07; --bg2:#161009; --bg3:#1E1610;
  --card:rgba(201,162,94,.05);
  --text:#F5EBD9; --dim:rgba(245,235,217,.66);
  --g1:#8C6E3C; --g2:#C9A25E; --g3:#F1DFB0; --g4:#FFE9B8;
  --gold:#C9A25E; --gold-lt:#F1DFB0; --gold-deep:#8C6E3C;
  --hair:rgba(201,162,94,.28);
  --ink:#241A0E;                     /* text on a gold button */
  --img-f:sepia(.16) saturate(1.02) brightness(.94) contrast(1.04);
  --scrim:linear-gradient(180deg,rgba(14,10,7,.55),rgba(14,10,7,.18) 38%,rgba(14,10,7,.82));
  --scrim-soft:linear-gradient(180deg,rgba(14,10,7,.28),rgba(14,10,7,.52));
  --vig:radial-gradient(125% 95% at 50% 45%,transparent 26%,rgba(14,10,7,.80) 100%);
  --hero-ink:#F5EBD9;
  --glass:rgba(14,10,7,.55);
  --shadow:0 30px 80px -30px rgba(0,0,0,.85);
}
/* ── LIGHT WORLD ── */
html[data-theme="light"]{
  --bg:#FBF7F0; --bg2:#F3EADC; --bg3:#FFFFFF;
  --card:rgba(169,128,60,.06);
  --text:#2B2119; --dim:rgba(43,33,25,.68);
  --g1:#6E5426; --g2:#A9803C; --g3:#D8B872; --g4:#B98F45;
  --gold:#A9803C; --gold-lt:#8C6E3C; --gold-deep:#6E5426;
  --hair:rgba(169,128,60,.34);
  --ink:#FFF9EF;
  --img-f:sepia(.05) saturate(1.06) brightness(1.04) contrast(1.02);
  --scrim:linear-gradient(180deg,rgba(255,252,246,.72),rgba(255,252,246,.40) 40%,rgba(255,252,246,.88));
  --scrim-soft:linear-gradient(180deg,rgba(255,252,246,.55),rgba(255,252,246,.72));
  --vig:radial-gradient(125% 95% at 50% 45%,rgba(255,252,246,.20) 26%,rgba(255,252,246,.86) 100%);
  --hero-ink:#2B2119;
  --glass:rgba(255,252,246,.72);
  --shadow:0 30px 70px -32px rgba(90,70,40,.40);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:auto}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--fb);line-height:1.8;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background .5s ease,color .5s ease;
}
::selection{background:var(--gold);color:var(--ink)}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
h1,h2,h3{font-weight:400}
/* every decorative mandala is a line drawing — never a filled blob */
svg.orna *{fill:none;stroke:currentColor;stroke-width:.8}

/* ── photographs: graded, never buried ── */
.graded{position:relative;overflow:hidden;background:var(--bg3)}
.graded img{width:100%;height:100%;object-fit:cover;filter:var(--img-f)}
.graded::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--scrim-soft)}
.graded img.is-dead{display:none}

/* full-bleed living background: slow ken-burns, ON MOBILE TOO */
.bgimg{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--bg3)}
.bgimg img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:var(--img-f);will-change:transform,opacity;
  animation:kb 26s ease-in-out infinite alternate;
}
@keyframes kb{
  from{transform:scale(1.04) translate3d(0,0,0)}
  to  {transform:scale(1.20) translate3d(0,-2.5%,0)}
}
/* hero: three photographs cross-fading — the background is alive */
.bgimg.fade img{opacity:0;animation:kb 24s ease-in-out infinite alternate,xfade 21s linear infinite}
.bgimg.fade img:nth-child(1){animation-delay:0s,0s}
.bgimg.fade img:nth-child(2){animation-delay:-8s,-7s}
.bgimg.fade img:nth-child(3){animation-delay:-16s,-14s}
@keyframes xfade{0%{opacity:0}4%{opacity:1}29%{opacity:1}36%{opacity:0}100%{opacity:0}}
.bgimg.fade img:only-child{opacity:1;animation:kb 26s ease-in-out infinite alternate}

/* ── molten-gold text ── */
.gold{
  background:linear-gradient(100deg,var(--g1) 0%,var(--g2) 30%,var(--g3) 50%,var(--g2) 70%,var(--g1) 100%);
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 7s ease-in-out infinite;
}
@keyframes shimmer{0%,100%{background-position:100% 0}45%,55%{background-position:0 0}}

/* ── page-wide layers ── */
#dust{position:fixed;inset:0;z-index:3;pointer-events:none}
.wrap{width:min(1160px,92vw);margin-inline:auto;position:relative;z-index:4}
section{position:relative}

/* ═══ CONTROL BAR — language + theme ═══ */
#ctrl{
  position:fixed;top:0;inset-inline:0;z-index:120;display:flex;justify-content:flex-end;
  gap:.5rem;padding:.85rem clamp(.9rem,3vw,1.8rem);
  padding-top:calc(.85rem + env(safe-area-inset-top));
  pointer-events:none;
}
#ctrl button{
  pointer-events:auto;cursor:pointer;font-family:var(--fb);
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  height:40px;min-width:40px;padding:0 .85rem;border-radius:999px;
  border:1px solid var(--hair);background:var(--glass);color:var(--gold);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font-size:.78rem;font-weight:600;letter-spacing:.08em;
  transition:transform .3s var(--ease),border-color .3s,color .3s;
}
#ctrl button:hover{border-color:var(--gold);color:var(--text);transform:translateY(-2px)}
#ctrl button:active{transform:scale(.94)}
#ctrl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
#themeBtn .sun{display:none}
html[data-theme="light"] #themeBtn .sun{display:block}
html[data-theme="light"] #themeBtn .moon{display:none}

/* ── ornaments ── */
.orn{display:flex;align-items:center;justify-content:center;gap:16px;color:var(--gold)}
.orn .l{height:1px;width:min(110px,16vw);background:linear-gradient(90deg,transparent,var(--gold))}
.orn .l:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.orn svg{width:38px;height:38px;display:block}
.kick{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);
  font-size:.74rem;font-weight:600;letter-spacing:.42em;padding-inline-start:.42em}
.kick::before,.kick::after{content:"";height:1px;width:30px;background:var(--hair)}

/* ── buttons ── */
.btn{position:relative;display:inline-flex;align-items:center;gap:.75rem;overflow:hidden;
  padding:1.05rem 2.5rem;border-radius:2px;font-family:var(--fb);font-weight:600;font-size:1.05rem;
  transition:transform .35s var(--ease),box-shadow .5s}
.btn svg{width:21px;height:21px;flex:none}
.btn-gold{color:var(--ink);
  background:linear-gradient(110deg,var(--g1),var(--g2) 35%,var(--g3) 50%,var(--g2) 65%,var(--g1));
  background-size:200% 100%;
  box-shadow:0 12px 40px -12px rgba(169,128,60,.60),inset 0 0 0 1px rgba(255,245,225,.28)}
.btn-gold::after{content:"";position:absolute;top:0;bottom:0;width:40%;inset-inline-start:-60%;
  background:linear-gradient(105deg,transparent,rgba(255,246,222,.55),transparent);
  transform:skewX(-20deg);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,55%{inset-inline-start:-60%}75%,100%{inset-inline-start:130%}}
.btn-gold:hover{transform:translateY(-3px);box-shadow:0 20px 55px -12px rgba(169,128,60,.8)}
.btn-gold:active{transform:scale(.97)}
.btn-ghost{color:var(--gold);border:1px solid var(--hair);background:var(--glass);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn-ghost:hover{border-color:var(--gold);transform:translateY(-3px)}

/* ═══ LOADER ═══ */
#loader{position:fixed;inset:0;z-index:300;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem}
#loader.done{opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
#loader .mandala{width:clamp(120px,26vw,180px);height:auto;color:var(--gold);opacity:.9}
#loader .name{font-family:var(--fd);font-size:clamp(1.5rem,5vw,2.4rem);text-align:center;
  padding-inline:1.5rem;opacity:0;transform:translateY(14px)}
#loader .mark{font-family:var(--fl);font-style:italic;letter-spacing:.5em;text-transform:uppercase;
  font-size:.72rem;color:var(--gold-deep);opacity:0}
@media(prefers-reduced-motion:reduce){#loader{display:none}}

/* ═══ HERO ═══ */
#hero{min-height:100svh;display:grid;place-items:center;text-align:center;overflow:hidden;background:var(--bg)}
#hero .vig{position:absolute;inset:0;z-index:1;background:var(--vig)}
#hero .scrim{position:absolute;inset:0;z-index:1;background:var(--scrim)}
#hero .mandala-bg{position:absolute;z-index:2;top:50%;left:50%;width:min(150vw,1050px);aspect-ratio:1;
  transform:translate(-50%,-52%);color:var(--gold);opacity:.09;pointer-events:none;
  animation:spin 120s linear infinite}
@keyframes spin{to{transform:translate(-50%,-52%) rotate(360deg)}}
#hero .frame{position:absolute;inset:clamp(14px,2.5vw,28px);z-index:2;pointer-events:none}
#hero .frame path{fill:none;stroke:var(--gold);stroke-width:1;opacity:.7}
#hero .inner{position:relative;z-index:5;padding:clamp(5rem,12vh,7rem) 1.2rem 4.5rem;width:min(1000px,94vw);
  color:var(--hero-ink)}
.h-city{font-size:.8rem;letter-spacing:.5em;color:var(--gold);opacity:0}
.h-name{font-family:var(--fd);font-size:clamp(2.6rem,10vw,7rem);line-height:1.5;margin:.6rem 0 0;
  filter:drop-shadow(0 6px 34px rgba(169,128,60,.28))}
.h-tag{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.9rem;
  font-size:clamp(.85rem,2vw,1.02rem);margin-top:1.4rem;opacity:0}
.h-tag .d{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none;opacity:.85}
.h-rate{display:inline-flex;align-items:center;gap:1rem;margin-top:2rem;padding:.7rem 1.6rem;
  border:1px solid var(--hair);background:var(--glass);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);opacity:0}
.h-rate .stars{color:var(--gold);letter-spacing:3px;font-size:.85rem}
.h-rate .num{font-family:var(--fl);font-style:italic;font-size:1.5rem;color:var(--gold)}
.h-rate .cnt{font-size:.78rem;opacity:.8}
.h-ctas{display:flex;align-items:center;justify-content:center;gap:1.1rem;flex-wrap:wrap;margin-top:2.4rem;opacity:0}
.h-cue{position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:.5rem;color:var(--gold);
  font-size:.68rem;letter-spacing:.35em;opacity:.85}
.h-cue .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:fall 2.2s ease-in-out infinite}
@keyframes fall{0%{transform:translateY(-8px);opacity:0}45%{opacity:1}100%{transform:translateY(10px);opacity:0}}

/* ═══ MARQUEE ═══ */
#marquee{border-block:1px solid var(--hair);background:var(--bg2);overflow:hidden;padding:1.05rem 0;position:relative;z-index:4}
#marquee .track{display:flex;gap:3rem;width:max-content;animation:mq 34s linear infinite}
#marquee span{display:flex;align-items:center;gap:3rem;font-family:var(--fd);font-size:1.12rem;
  color:var(--gold);white-space:nowrap;opacity:.95}
#marquee i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);flex:none;opacity:.6}
@keyframes mq{to{transform:translateX(-50%)}}
html[dir="rtl"] #marquee .track{animation-name:mqr}
@keyframes mqr{to{transform:translateX(50%)}}

/* ═══ PHILOSOPHY — the light band ═══ */
#phil{padding:clamp(5rem,12vw,8.5rem) 0;background:
  radial-gradient(80% 60% at 15% 20%,rgba(169,128,60,.09),transparent 55%),var(--bg)}
#phil .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2.5rem,6vw,5rem);align-items:center}
#phil .txt h2{font-family:var(--fd);font-size:clamp(1.9rem,4.6vw,3.1rem);line-height:1.65;margin:1.1rem 0 1.3rem}
#phil .txt p{color:var(--dim);max-width:52ch}
#phil .pills{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.8rem}
#phil .pills span{font-size:.8rem;color:var(--gold);border:1px solid var(--hair);
  padding:.45rem 1.1rem;background:var(--card)}
#phil .pic{aspect-ratio:4/5;position:relative}
#phil .pic .frame2{position:absolute;inset:0;border:1px solid var(--hair);transform:translate(14px,14px);z-index:0}
#phil .pic .graded{position:absolute;inset:0;z-index:1;box-shadow:var(--shadow)}
#phil .pic .graded img{animation:kb 30s ease-in-out infinite alternate}
@media(max-width:860px){#phil .grid{grid-template-columns:1fr}#phil .pic{max-width:460px;margin-inline:auto}}

/* ═══ SERVICES — the deep band ═══ */
#services{padding:clamp(5rem,12vw,8.5rem) 0;background:var(--bg2);overflow:hidden}
#services .bgorn{position:absolute;top:-4rem;inset-inline-start:-6rem;width:34rem;color:var(--gold);
  opacity:.06;pointer-events:none;animation:spin 160s linear infinite reverse}
#services .head{text-align:center;margin-bottom:clamp(2.6rem,6vw,4.2rem)}
#services .head h2{font-family:var(--fd);font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.55;margin:.8rem 0 1rem}
.svc{list-style:none;max-width:880px;margin-inline:auto}
.svc li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1.4rem 1.8rem;
  padding:1.55rem .6rem;border-bottom:1px solid var(--hair);position:relative;transition:background .4s}
.svc li::before{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(169,128,60,.10),transparent);
  opacity:0;transition:opacity .4s}
.svc li:hover::before{opacity:1}
.svc .n{font-family:var(--fl);font-style:italic;font-size:1.35rem;color:var(--gold-deep);min-width:2.2rem}
.svc .nm{font-size:clamp(1.05rem,2.4vw,1.3rem);font-weight:500}
.svc .ds{font-size:.85rem;color:var(--dim);margin-top:.15rem}
.svc .pr{font-family:var(--fl);font-size:clamp(1.15rem,2.4vw,1.45rem);color:transparent;white-space:nowrap;
  background:linear-gradient(100deg,var(--g1),var(--g2) 40%,var(--g3) 55%,var(--g2));
  -webkit-background-clip:text;background-clip:text}
.svc .pr small{font-size:.68em}
#services .cta{text-align:center;margin-top:2.8rem}

/* ═══ EXPERIENCE — cinematic band ═══ */
#exp{min-height:74svh;display:grid;place-items:center;text-align:center;overflow:hidden}
#exp .vig{position:absolute;inset:0;z-index:1;background:var(--vig)}
#exp .inner{position:relative;z-index:2;padding:6rem 1.4rem;color:var(--hero-ink)}
#exp h2{font-family:var(--fd);font-size:clamp(2rem,6.5vw,4.4rem);line-height:1.7;max-width:900px}
#exp .sub{margin-top:1.2rem;opacity:.78;font-size:.95rem;letter-spacing:.05em}

/* ═══ GALLERY ═══ */
#gallery{padding:clamp(5rem,12vw,8.5rem) 0;background:var(--bg)}
#gallery .head{text-align:center;margin-bottom:clamp(2.6rem,6vw,4rem)}
#gallery .head h2{font-family:var(--fd);font-size:clamp(2rem,5.2vw,3.4rem);margin:.8rem 0 1rem;line-height:1.55}
.mosaic{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(150px,16vw,230px);gap:10px}
.mosaic .cell{position:relative;overflow:hidden;border:1px solid var(--hair)}
.mosaic .cell:nth-child(1){grid-column:span 2;grid-row:span 2}
.mosaic .cell:nth-child(4){grid-row:span 2}
.mosaic .cell:nth-child(6){grid-column:span 2}
.mosaic .cell .graded{position:absolute;inset:0}
/* each tile breathes on its own clock — the grid is never static */
.mosaic .cell:nth-child(odd) .graded img{animation:kb 32s ease-in-out infinite alternate}
.mosaic .cell:nth-child(even) .graded img{animation:kb 27s ease-in-out infinite alternate-reverse}
.mosaic .cell .glow{position:absolute;inset:0;
  background:radial-gradient(60% 60% at 50% 50%,rgba(201,162,94,.22),transparent 70%);
  opacity:0;transition:opacity .5s;pointer-events:none}
.mosaic .cell:hover .glow{opacity:1}
@media(max-width:640px){.mosaic{grid-template-columns:repeat(2,1fr)}
  .mosaic .cell:nth-child(1){grid-column:span 2}
  .mosaic .cell:nth-child(6){grid-column:span 2}}

/* ═══ TESTIMONIALS (conditional) ═══ */
#testi{padding:clamp(5rem,12vw,8rem) 0;background:var(--bg2)}
#testi .head{text-align:center;margin-bottom:3rem}
#testi .head h2{font-family:var(--fd);font-size:clamp(2rem,5vw,3.2rem);margin:.8rem 0;line-height:1.55}
#testi .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1.2rem}
#testi .card{border:1px solid var(--hair);background:var(--card);padding:2rem 1.6rem;position:relative}
#testi .card .q{font-family:var(--fl);font-size:3.4rem;line-height:0;color:var(--gold);opacity:.55;
  display:block;margin-bottom:1.4rem}
#testi .card p{font-size:.95rem;color:var(--dim)}
#testi .card .who{display:block;margin-top:1.2rem;font-size:.75rem;letter-spacing:.22em;color:var(--gold)}

/* ═══ BOOKING ═══ */
#booking{min-height:88svh;display:grid;place-items:center;text-align:center;overflow:hidden}
#booking .vig{position:absolute;inset:0;z-index:1;background:var(--vig)}
#booking .inner{position:relative;z-index:2;padding:6.5rem 1.4rem;width:min(860px,94vw);color:var(--hero-ink)}
#booking h2{font-family:var(--fd);font-size:clamp(2.2rem,6.6vw,4.4rem);line-height:1.6}
#booking .sub{margin:1.1rem 0 2.4rem;opacity:.8}
#booking .info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;
  background:var(--hair);border:1px solid var(--hair);margin-top:3rem}
#booking .info>div{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:1.5rem 1.2rem}
#booking .info .lb{font-size:.66rem;letter-spacing:.34em;color:var(--gold);margin-bottom:.5rem}
#booking .info .vl{font-size:.92rem;opacity:.95}
#booking .info a.vl{color:var(--gold);display:inline-flex;align-items:center;gap:.4rem;
  border-bottom:1px solid transparent;transition:border-color .3s}
#booking .info a.vl:hover{border-color:var(--gold)}
#booking .info a.vl svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ═══ FOOTER ═══ */
footer{background:var(--bg);border-top:1px solid var(--hair);padding:3.2rem 0 2.6rem;text-align:center}
footer .nm{font-family:var(--fd);font-size:1.5rem}
footer .ct{font-size:.72rem;letter-spacing:.26em;color:var(--gold);opacity:.9;margin-top:.4rem}

    });

  var r=Math.max(0,Math.min(5,Math.round(rN)));
  $("#hStars").textContent="★★★★★☆☆☆☆☆".slice(5-r,10-r);
  $("#hCnt").textContent=(C.reviews_count?"+"+C.reviews_count+" ":"")+t.reviewsSuffix;
  $("#hNum").textContent=rN.toFixed(1);

  /* whatsapp link carries the message in the visitor's language */
  var msg=(lang==="en"&&C.whatsapp_msg_en)?C.whatsapp_msg_en:C.whatsapp_msg;
  var wa="https://wa.me/"+encodeURIComponent(C.whatsapp)+"?text="+encodeURIComponent(msg||"");
  ["ctaHero","ctaSvc","ctaBook","ctaBar"].forEach(function(id){var e=$("#"+id);if(e)e.href=wa});

  /* marquee */
  var names=(C.services||[]).map(function(s){return (lang==="en"&&s.name_en)?s.name_en:s.name});
  var tr=$("#mqTrack");tr.textContent="";
  for(var k=0;k<4;k++){
    var sp=document.createElement("span");
    names.forEach(function(n){
      var b=document.createElement("b");b.style.fontWeight="400";b.textContent=n;sp.appendChild(b);
      sp.appendChild(document.createElement("i"));
    });
    tr.appendChild(sp);
  }

  /* services */
  var ul=$("#svcList");ul.textContent="";
  (C.services||[]).slice(0,7).forEach(function(s,i){
    var li=document.createElement("li");li.className="rv";
    var n=document.createElement("span");n.className="n";n.textContent=t.nums[i]||String(i+1);
    var tx=document.createElement("div");
    var nm=document.createElement("div");nm.className="nm";
    nm.textContent=esc((lang==="en"&&s.name_en)?s.name_en:s.name);
    var ds=document.createElement("div");ds.className="ds";
    ds.textContent=esc((lang==="en"&&s.desc_en)?s.desc_en:s.desc);
    tx.appendChild(nm);tx.appendChild(ds);
    /* price may arrive as "80", "80 SAR" or "٨٠ ر.س" — keep the digits only,
       the template owns the currency word so it can switch language */
    var digits=String(s.price==null?"":s.price).replace(/[^\d٠-٩]/g,"")||esc(s.price);
    var pr=document.createElement("div");pr.className="pr";
    pr.textContent=digits+" ";
    var sm=document.createElement("small");sm.textContent=t.currency;pr.appendChild(sm);
    li.appendChild(n);li.appendChild(tx);li.appendChild(pr);
    ul.appendChild(li);
  });

  /* booking card — a field with no data must not leave an empty box */
  function cell(wrapId,valId,text,isLink){
    var box=$("#"+wrapId),v=$("#"+valId);
    if(!text){box.style.display="none";return}
    box.style.display="";
    if(!isLink)v.textContent=text;
  }
  cell("cAddr","bAddr",F("address"));
  cell("cHours","bHours",F("hours"));
  cell("cPhone","bPhone",C.phone,true);
  if(C.phone){$("#bPhone").textContent=C.phone;$("#bPhone").href="tel:"+String(C.phone).replace(/\s/g,"")}
  cell("cMap","bMap",C.maps_url,true);
  if(C.maps_url)$("#bMap").href=C.maps_url;

  if(window.ScrollTrigger&&ScrollTrigger.refresh)ScrollTrigger.refresh();
}

/* ══ language + theme switches ══ */
$("#langBtn").addEventListener("click",function(){
  lang=lang==="ar"?"en":"ar";
  try{localStorage.setItem("axis-lang",lang)}catch(e){}
  paint();
});
$("#themeBtn").addEventListener("click",function(){
  var next=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",next);
  try{localStorage.setItem("axis-theme",next)}catch(e){}
  var m=$("#metaTheme");if(m)m.setAttribute("content",next==="dark"?"#0E0A07":"#FBF7F0");
});

["#philImg","#expImg","#bookImg"].forEach(function(s){var e=$(s);if(e)dead(e)});
paint();

/* ── gold dust ── */
(function(){
  if(reduced)return;
  var cv=$("#dust"),ctx=cv.getContext("2d"),P=[],N=mobile?14:30,W,H;
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  size();addEventListener("resize",size);
  for(var i=0;i<N;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.6+.4,s:Math.random()*.35+.12,tw:Math.random()*Math.PI*2});
  (function tick(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var p=P[i];
      p.y-=p.s;p.tw+=.02;p.x+=Math.sin(p.tw*.7)*.15;
      if(p.y<-4){p.y=H+4;p.x=Math.random()*W}
      var a=.25+Math.sin(p.tw)*.2;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);
      ctx.fillStyle="rgba(201,162,94,"+a.toFixed(3)+")";ctx.fill()}
    requestAnimationFrame(tick)
  })();
})();

/* ── mobile sticky wa bar ── */
(function(){
  var bar=$("#wabar");if(!bar)return;
  addEventListener("scroll",function(){
    bar.classList.toggle("on",scrollY>innerHeight*.85)
  },{passive:true});
})();

/* ── motion ── */
function boot(){
  var hasG=typeof gsap!=="undefined"&&typeof ScrollTrigger!=="undefined";
  var loader=$("#loader");
  function openHero(){
    if(!hasG){["#hCity","#hTag","#hRate","#hCtas"].forEach(function(s){var e=$(s);if(e)e.style.opacity=1});return}
    gsap.timeline()
      .fromTo("#hName",{opacity:0,y:36,filter:"blur(10px)"},{opacity:1,y:0,filter:"blur(0px)",duration:1.2,ease:"power3.out"})
      .to("#hCity",{opacity:1,duration:.7},"-=.7")
      .to("#hTag",{opacity:1,duration:.7},"-=.4")
      .to("#hRate",{opacity:1,duration:.7},"-=.4")
      .to("#hCtas",{opacity:1,duration:.7},"-=.4");
    var num={v:0};
    gsap.to(num,{v:rN,duration:1.6,ease:"power2.out",delay:.4,
      onUpdate:function(){$("#hNum").textContent=num.v.toFixed(1)}});
  }
  function closeLoader(){if(loader&&!loader.classList.contains("done")){loader.classList.add("done");openHero()}}
  if(reduced||!hasG){closeLoader()}
  else{
    gsap.timeline({onComplete:closeLoader})
      .fromTo("#loader .mandala",{rotate:-30,opacity:0,scale:.85},{rotate:0,opacity:.9,scale:1,duration:.8,ease:"power2.out"})
      .to("#loader .name",{opacity:1,y:0,duration:.6,ease:"power3.out"},"-=.3")
      .to("#loader .mark",{opacity:1,duration:.4},"-=.2")
      .to({},{duration:.35});
    setTimeout(closeLoader,2600); /* failsafe */
  }
  if(!hasG){$$(".rv").forEach(function(e){e.style.opacity=1;e.style.transform="none"});return}

  gsap.registerPlugin(ScrollTrigger);

  if(!reduced&&!mobile&&typeof Lenis!=="undefined"){
    var lenis=new Lenis({duration:1.15,smoothTouch:false});
    lenis.on("scroll",ScrollTrigger.update);
    gsap.ticker.add(function(t){lenis.raf(t*1000)});
    gsap.ticker.lagSmoothing(0);
  }

  ScrollTrigger.batch(".rv",{start:"top 90%",
    onEnter:function(b){gsap.to(b,{opacity:1,y:0,duration:.9,stagger:.06,ease:"power3.out"})}});

  /* parallax on top of the CSS ken-burns — desktop only, it is a bonus */
  if(!mobile&&!reduced){
    [["#exp .bgimg img",10],["#booking .bgimg img",9]].forEach(function(p){
      var el=document.querySelector(p[0]);if(!el)return;
      gsap.to(el,{yPercent:p[1],ease:"none",
        scrollTrigger:{trigger:el.closest("section"),start:"top bottom",end:"bottom top",scrub:true}});
    });
  }
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot)}else{boot()}
})();
</script>
