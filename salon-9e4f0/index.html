<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>صالون</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"></noscript>

<script>
(function(){try{var l=localStorage.getItem("axis-lang")||"ar";
  document.documentElement.setAttribute("lang",l);
  document.documentElement.setAttribute("dir",l==="ar"?"rtl":"ltr");}catch(e){}})();
</script>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   AXIS — demo template v10
   Built against how the region's largest beauty groups actually structure a
   site. N.Bar: service categories, a price list of its own, locations, FAQ.
   Pastels: a since-2004 story, our work, press. Both are white,
   photography-led and multi-section. The gradient-and-glass pass read as a
   product landing page precisely because it had neither.
   Platform: native CSS carousel (::scroll-button / ::scroll-marker), native
   masonry (grid-lanes), scroll-state container queries, dialog, @scope,
   :has(), @property counters, scroll-driven animation, view transitions.
   Everything degrades — no library is loaded and nothing here is required
   for the page to work.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --fa:"Tajawal",system-ui,sans-serif;
  --fl:"Outfit",system-ui,sans-serif;
  --f:var(--fa);
  --e:cubic-bezier(.16,1,.3,1);
  --eo:cubic-bezier(.34,1.4,.64,1);
  --sx:1;

  --paper:#FFFFFF;
  --paper2:#FBF7F6;  --paper2:oklch(98% .006 20);
  --tint:#FDF1F3;    --tint:oklch(96% .018 8);
  --ink:#1C1517;     --ink:oklch(19% .014 20);
  --dim:rgba(28,21,23,.60); --dim:oklch(19% .014 20/.60);
  --line:rgba(28,21,23,.11);--line:oklch(19% .014 20/.11);
  --rose:#C43E63;    --rose:oklch(55% .165 8);
  --rose-s:#FBE3EA;  --rose-s:oklch(93% .035 6);
  --lilac:#7B4FBF;   --lilac:oklch(50% .155 300);
  --lilac-s:#EDE4FA; --lilac-s:oklch(93% .038 300);
  --peach:#C4622F;   --peach:oklch(58% .130 45);
  --peach-s:#FCE7DA; --peach-s:oklch(94% .038 50);
  --gold:#A5791A;    --gold:oklch(58% .110 88);
  --gold-s:#FAF0D3;  --gold-s:oklch(95% .045 90);
  --wa:#25D366;
  --sh:0 10px 30px -18px rgba(60,20,35,.28);
  --sh-l:0 26px 60px -30px rgba(60,20,35,.30);
  --r:22px; --r-s:14px;
  --pad:clamp(3.4rem,8vw,6rem);
}
html[lang="en"]{--f:var(--fl)}
html[dir="rtl"]{--sx:-1}

*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f);
  font-size:clamp(1rem,.95rem + .2vw,1.08rem);line-height:1.8;overflow-x:hidden;
  -webkit-font-smoothing:antialiased}
html[lang="en"] .tr{letter-spacing:.14em;text-transform:uppercase}
html[lang="ar"] .tr{letter-spacing:normal}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
h1,h2,h3{font-weight:800;line-height:1.28;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.42}
/* text-box-trim clips Arabic descenders, so it is scoped to Latin only */
@supports (text-box: trim-both cap alphabetic){
  html[lang="en"] h1,html[lang="en"] h2{text-box:trim-both cap alphabetic}
}
p{text-wrap:pretty}
::selection{background:var(--rose);color:#fff}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:8px}
.wrap{width:min(1180px,92vw);margin-inline:auto;position:relative}
section{position:relative}
.pad{padding:var(--pad) 0}
.tinted{background:var(--paper2)}

/* ══ intro ══ */
#intro{position:fixed;inset:0;z-index:400;background:var(--paper);display:grid;place-items:center;
  animation:lift .9s var(--e) .95s forwards}
#intro .mk{display:flex;gap:.5rem;animation:mkOut .4s ease .8s forwards}
#intro i{width:12px;height:12px;border-radius:50%;background:var(--rose);
  animation:bounce .8s var(--eo) infinite alternate}
#intro i:nth-child(2){background:var(--lilac);animation-delay:.11s}
#intro i:nth-child(3){background:var(--peach);animation-delay:.22s}
@keyframes bounce{from{transform:translateY(6px) scale(.85);opacity:.5}to{transform:translateY(-6px);opacity:1}}
@keyframes mkOut{to{opacity:0;transform:scale(.85)}}
@keyframes lift{to{transform:translateY(-101%)}}
.in-1,.in-2,.in-3,.in-4{animation:enter .75s var(--e) both}
.in-1{animation-delay:1.3s}.in-2{animation-delay:1.42s}
.in-3{animation-delay:1.54s}.in-4{animation-delay:1.66s}
@keyframes enter{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.h-name span{display:inline-block;animation:unmask .8s var(--e) both}
@keyframes unmask{from{opacity:0;clip-path:inset(0 0 105% 0);transform:translateY(.4em)}
                  to{opacity:1;clip-path:inset(0 0 -18% 0);transform:none}}

/* ══ scroll choreography ══ */
.rv{opacity:1}
@supports (animation-timeline: view()){
  .rv{animation:rise both;animation-timeline:view();animation-range:entry 2% cover 26%}
  @keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
  .stagger>*{animation:rise both;animation-timeline:view();animation-range:entry 0% cover 24%}
  .mask{animation:wipe linear both;animation-timeline:view();animation-range:entry 12% entry 86%}
  @keyframes wipe{from{clip-path:inset(0 0 100% 0);opacity:.3}to{clip-path:inset(0 0 -12% 0);opacity:1}}
  .drift img{animation:drift linear both;animation-timeline:view();animation-range:cover}
  @keyframes drift{from{transform:scale(1.18) translateY(-4%)}to{transform:scale(1.18) translateY(4%)}}
  .num{animation:tick .1s linear both;animation-timeline:view();animation-range:entry 20% entry 90%}
  @keyframes tick{to{--n:var(--to)}}
  #prog{animation:fill linear both;animation-timeline:scroll(root)}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
@property --n{syntax:"<integer>";initial-value:0;inherits:false}
.num{counter-reset:n var(--n)}
.num::after{content:counter(n)}
#prog{position:fixed;top:0;inset-inline:0;height:2px;z-index:200;transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--rose),var(--lilac),var(--peach))}
html[dir="rtl"] #prog{transform-origin:100% 50%}

/* ══ header — condenses once it is stuck, via a scroll-state query ══ */
header.top{position:sticky;top:0;z-index:150;background:rgba(255,255,255,.9);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);container-type:scroll-state;
  animation:enter .7s var(--e) 1.25s both}
header.top .bar{width:min(1180px,94vw);margin-inline:auto;height:66px;
  display:flex;align-items:center;gap:.7rem;transition:height .3s var(--e)}
@supports (container-type: scroll-state){
  @container scroll-state(stuck: top){ .bar{height:56px} .brand .nm{font-size:.9rem} }
}
.brand{display:flex;align-items:center;gap:.5rem;min-width:0;flex:1}
.brand .mk{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--rose);color:#fff;font-weight:900;font-size:.95rem}
.brand .nm{font-weight:800;font-size:.96rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:font-size .3s var(--e)}
nav.links{display:none;gap:.1rem}
nav.links a{font-size:.87rem;font-weight:600;color:var(--dim);padding:.4rem .65rem;border-radius:999px}
nav.links a:hover,nav.links a.active{color:var(--rose);background:var(--rose-s)}
@media(min-width:960px){nav.links{display:flex}}
.icons{display:flex;gap:.35rem;flex:none}
.icons button{cursor:pointer;font-family:var(--f);display:grid;place-items:center;
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);font-size:.76rem;font-weight:700;transition:transform .25s var(--e)}
.icons button:hover{transform:translateY(-2px);color:var(--rose)}
.book-pill{display:inline-flex;align-items:center;gap:.4rem;background:var(--wa);color:#fff;
  font-weight:700;font-size:.86rem;padding:.55rem 1rem;border-radius:999px;white-space:nowrap;flex:none;
  box-shadow:0 8px 20px -10px rgba(37,211,102,.9);transition:transform .25s var(--e)}
.book-pill:hover{transform:translateY(-2px)}
.book-pill svg{width:17px;height:17px;flex:none}
@media(max-width:430px){.book-pill{padding:.5rem .8rem;font-size:.82rem}
  .brand .nm{max-width:15ch}}

/* ══ atoms ══ */
.chip{display:inline-flex;align-items:center;gap:.38rem;padding:.4rem .9rem;border-radius:999px;
  font-size:.83rem;font-weight:600;background:var(--paper2);border:1px solid var(--line)}
.chip.r{background:var(--rose-s);border-color:transparent;color:var(--rose)}
.chip.l{background:var(--lilac-s);border-color:transparent;color:var(--lilac)}
.chip.p{background:var(--peach-s);border-color:transparent;color:var(--peach)}
.chip.a{background:var(--gold-s);border-color:transparent;color:var(--gold)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:1rem 1.5rem;
  border-radius:999px;font-family:var(--f);font-weight:700;font-size:clamp(.92rem,2.6vw,1rem);
  white-space:nowrap;position:relative;overflow:hidden;box-shadow:var(--sh);
  transition:transform .3s var(--e),box-shadow .4s}
.btn svg{width:19px;height:19px;flex:none}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 14px 32px -16px rgba(37,211,102,.95)}
.btn-wa::after{content:"";position:absolute;top:0;bottom:0;width:34%;inset-inline-start:-50%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-18deg);animation:gleam 5s ease-in-out 2.2s infinite}
@keyframes gleam{0%,64%{inset-inline-start:-50%}86%,100%{inset-inline-start:125%}}
.btn-o{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn:hover{transform:translateY(-3px);box-shadow:var(--sh-l)}
.btn:active{transform:scale(.97)}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:700;color:var(--rose)}
.eyebrow::before{content:"";width:20px;height:2px;border-radius:2px;background:currentColor}
.h2{font-size:clamp(1.7rem,4.4vw,2.7rem);margin:.6rem 0 0}
.lead{color:var(--dim);margin-top:.8rem;max-width:56ch}
.ph{position:relative;overflow:hidden;background:var(--paper2);border-radius:var(--r)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph img.dead{display:none}

/* ══ hero — photography leads, the way the references do ══ */
#hero{padding:clamp(2.4rem,6vw,4rem) 0 0}
.hero-grid{display:grid;grid-template-columns:1fr;gap:clamp(1.6rem,4vw,3rem);align-items:center}
@media(min-width:900px){.hero-grid{grid-template-columns:1.05fr .95fr}}
.hero-shot{aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-l);background:var(--tint)}
@media(max-width:899px){
  .hero-shot{order:2;aspect-ratio:4/3;border-radius:0;box-shadow:none;
    width:100vw;margin-inline:calc(50% - 50vw)}
}
.h-name{font-size:clamp(2.1rem,7vw,4.4rem);font-weight:900;margin:.8rem 0 0}
.h-cta{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.6rem}
.h-cta .btn{flex:1 1 auto}

/* ══ trust strip ══ */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border-block:1px solid var(--line);margin-top:clamp(2.4rem,6vw,4rem)}
.trust>div{background:var(--paper);padding:1.3rem .8rem;text-align:center}
.trust .big{font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;line-height:1.1;color:var(--rose)}
.trust .k{font-size:.74rem;color:var(--dim);margin-top:.2rem}
@media(max-width:620px){.trust{grid-template-columns:repeat(2,1fr)}}

/* ══ categories ══ */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(46%,190px),1fr));
  gap:clamp(10px,1.4vw,14px);margin-top:clamp(1.6rem,4vw,2.6rem)}
.cat{border-radius:var(--r);border:1px solid var(--line);background:var(--paper);padding:1.4rem 1.2rem;
  box-shadow:var(--sh);transition:transform .3s var(--e),box-shadow .3s;cursor:pointer;text-align:start;
  font-family:var(--f);color:inherit}
.cat:hover{transform:translateY(-4px);box-shadow:var(--sh-l)}
.cat[aria-pressed="true"]{border-color:var(--rose);box-shadow:0 0 0 2px var(--rose) inset,var(--sh-l)}
.cat .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin-bottom:.7rem;
  background:var(--rose-s);color:var(--rose)}
.cat:nth-child(2) .ic{background:var(--lilac-s);color:var(--lilac)}
.cat:nth-child(3) .ic{background:var(--peach-s);color:var(--peach)}
.cat:nth-child(4) .ic{background:var(--gold-s);color:var(--gold)}
.cat .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat h3{font-size:1.05rem}
.cat .n{font-size:.83rem;color:var(--dim);margin-top:.15rem}

/* ══ price list ══ */
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.2rem}
.filters button{cursor:pointer;font-family:var(--f);font-size:.84rem;font-weight:600;
  padding:.4rem .95rem;border-radius:999px;border:1px solid var(--line);background:var(--paper);
  color:var(--dim);transition:.25s var(--e)}
.filters button[aria-pressed="true"]{background:var(--rose);border-color:transparent;color:#fff}
.filters .c{font-size:.72em;font-weight:700;margin-inline-start:.45rem;
  min-width:1.35em;padding:0 .35em;border-radius:999px;display:inline-block;text-align:center;
  background:color-mix(in oklab,var(--ink) 9%,transparent)}
.filters button[aria-pressed="true"] .c{background:rgba(255,255,255,.28)}
@scope (.cards){
  :scope{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,268px),1fr));
    gap:clamp(10px,1.4vw,14px);margin-top:1.2rem}
  article{border-radius:var(--r);background:var(--paper);border:1px solid var(--line);
    padding:1.4rem 1.3rem;display:flex;flex-direction:column;gap:.26rem;box-shadow:var(--sh);
    position:relative;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none;
    transition:transform .3s var(--e),box-shadow .3s}
  article:hover{transform:translateY(-4px);box-shadow:var(--sh-l)}
  article::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--rose)}
  article:nth-child(4n+2)::before{background:var(--lilac)}
  article:nth-child(4n+3)::before{background:var(--peach)}
  article:nth-child(4n+4)::before{background:var(--gold)}
  article[aria-pressed="true"]{border-color:transparent;
    box-shadow:0 0 0 2px var(--rose) inset,var(--sh-l);background:var(--rose-s)}
  .tick{position:absolute;inset-inline-end:1rem;top:1rem;width:25px;height:25px;border-radius:50%;
    border:2px solid var(--line);display:grid;place-items:center;transition:.25s var(--e)}
  .tick svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;
    stroke-linejoin:round;opacity:0;transform:scale(.5);transition:.22s var(--eo)}
  article[aria-pressed="true"] .tick{background:var(--rose);border-color:var(--rose)}
  article[aria-pressed="true"] .tick svg{opacity:1;transform:none}
  .nm{font-size:1.1rem;font-weight:700;padding-inline-end:2rem}
  .ds{font-size:.86rem;color:var(--dim);flex:1}
  .foot{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.85rem}
  .pr{display:inline-flex;align-items:baseline;gap:.24rem;padding:.28rem .8rem;border-radius:999px;
    font-weight:800;font-size:1rem;background:var(--paper2)}
  .pr small{font-size:.66em;font-weight:600;opacity:.7}
  .go{font-size:.8rem;font-weight:700;color:var(--wa);display:inline-flex;align-items:center;gap:.28rem}
  .go svg{width:14px;height:14px}
}
/* the section itself reacts once anything in it is chosen */
#svc:has(article[aria-pressed="true"]) .filters{opacity:.55}

/* ══ our work — native CSS carousel, no script ══ */
.reel{display:flex;gap:clamp(10px,1.4vw,14px);overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;padding-block:.2rem;margin-top:clamp(1.6rem,4vw,2.6rem)}
.reel::-webkit-scrollbar{display:none}
.reel>figure{flex:0 0 min(78vw,420px);scroll-snap-align:center;aspect-ratio:4/3;cursor:zoom-in}
@supports (scroll-marker-group: after){
  .reel{scroll-marker-group:after}
  .reel::scroll-marker-group{display:flex;gap:.4rem;justify-content:center;padding-top:1rem}
  .reel>figure::scroll-marker{content:"";width:8px;height:8px;border-radius:50%;
    background:var(--line);transition:.25s var(--e)}
  .reel>figure::scroll-marker:target-current{background:var(--rose);width:22px;border-radius:99px}
}
/* ══ gallery — native masonry where it exists ══ */
.masonry{margin-top:clamp(1.6rem,4vw,2.6rem);display:grid;gap:clamp(10px,1.4vw,14px);
  grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.masonry figure{aspect-ratio:1;cursor:zoom-in}
@supports (grid-template-rows: masonry){
  .masonry{grid-template-rows:masonry}
  .masonry figure{aspect-ratio:auto}
}
@supports (display: grid-lanes){
  .masonry{display:grid-lanes}
  .masonry figure{aspect-ratio:auto}
}

/* ══ values ══ */
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));
  gap:clamp(10px,1.4vw,14px);margin-top:clamp(1.6rem,4vw,2.6rem)}
.vals article{border-radius:var(--r);background:var(--paper);border:1px solid var(--line);
  padding:1.5rem 1.3rem;box-shadow:var(--sh)}
.vals .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin-bottom:.7rem;
  background:var(--rose-s);color:var(--rose)}
.vals article:nth-child(2) .ic{background:var(--lilac-s);color:var(--lilac)}
.vals article:nth-child(3) .ic{background:var(--peach-s);color:var(--peach)}
.vals article:nth-child(4) .ic{background:var(--gold-s);color:var(--gold)}
.vals .ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vals h3{font-size:1.02rem}
.vals p{font-size:.87rem;color:var(--dim);margin-top:.2rem}

/* ══ reviews ══ */
.says{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));
  gap:clamp(10px,1.4vw,14px);margin-top:clamp(1.6rem,4vw,2.6rem)}
.say{border-radius:var(--r);background:var(--paper);border:1px solid var(--line);padding:1.5rem 1.4rem;box-shadow:var(--sh)}
.say .q{font-family:var(--fl);font-size:2.2rem;line-height:.4;color:var(--rose);display:block;margin-bottom:.9rem}
.say p{font-size:.92rem;color:var(--dim)}
.say cite{display:block;margin-top:.85rem;font-size:.78rem;font-weight:700;font-style:normal;color:var(--lilac)}

/* ══ branch + hours ══ */
.two{display:grid;grid-template-columns:1fr;gap:clamp(1.2rem,3vw,2rem);margin-top:clamp(1.6rem,4vw,2.6rem);align-items:start}
@media(min-width:860px){.two{grid-template-columns:1.05fr .95fr}}
.panel{border-radius:var(--r);background:var(--paper);border:1px solid var(--line);
  padding:1.5rem 1.4rem;box-shadow:var(--sh)}
.panel h3{font-size:1.05rem;margin-bottom:.8rem}
.line{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;
  border-bottom:1px dashed var(--line);font-size:.9rem}
.line:last-of-type{border-bottom:0}
.line span:last-child{color:var(--dim);font-variant-numeric:tabular-nums}
.line.today{color:var(--rose);font-weight:700}
.line.today span:last-child{color:var(--rose)}
.kv{display:flex;flex-direction:column;gap:.9rem}
.kv .k{font-size:.7rem;font-weight:700;color:var(--rose)}
.kv .v{font-size:.93rem}
.kv a.v{color:var(--lilac);font-weight:700;display:inline-flex;align-items:center;gap:.35rem}
.kv a.v svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act{display:flex;gap:.5rem;margin-top:1.1rem;flex-wrap:wrap}
.act button{cursor:pointer;font-family:var(--f);font-size:.83rem;font-weight:600;
  display:inline-flex;align-items:center;gap:.4rem;padding:.48rem .95rem;border-radius:999px;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:.25s var(--e)}
.act button:hover{transform:translateY(-2px);color:var(--rose)}
.act svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ══ faq ══ */
.qa{display:grid;gap:.55rem;margin-top:clamp(1.6rem,4vw,2.6rem)}
details{border-radius:var(--r-s);background:var(--paper);border:1px solid var(--line);overflow:hidden}
summary{cursor:pointer;list-style:none;padding:1rem 1.15rem;font-weight:700;font-size:.96rem;
  display:flex;align-items:center;justify-content:space-between;gap:1rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;flex:none;border-inline-end:2px solid var(--rose);
  border-block-end:2px solid var(--rose);transform:rotate(45deg);transition:transform .3s var(--e)}
details[open] summary::after{transform:rotate(-135deg)}
details p{padding:0 1.15rem 1.05rem;color:var(--dim);font-size:.89rem}

/* ══ closing ══ */
.close{border-radius:var(--r);background:var(--tint);padding:clamp(2.2rem,6vw,3.6rem) clamp(1.3rem,4vw,2.6rem);
  text-align:center}
.close h2{font-size:clamp(1.6rem,4.6vw,2.6rem)}
.close p{margin:.7rem auto 1.6rem;max-width:44ch;color:var(--dim)}

footer{padding:2.4rem 0 5.5rem;text-align:center;border-top:1px solid var(--line);margin-top:var(--pad)}
footer .n{font-size:1.15rem;font-weight:800}
footer .c{font-size:.82rem;color:var(--dim);margin-top:.1rem}
footer .a{font-family:var(--fl);font-size:.76rem;color:var(--dim);margin-top:1.1rem;opacity:.7}

/* ══ bars, lightbox, toast ══ */
#bar,#selbar{position:fixed;bottom:0;inset-inline:0;z-index:120;
  padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);transform:translateY(120%);transition:transform .42s var(--e)}
#bar{display:none}
#bar.on,#selbar.on{transform:none}
#bar.hushed{transform:translateY(120%)}
#bar .btn{width:100%}
@media(max-width:768px){#bar{display:block}}
#selbar{display:flex;align-items:center;gap:.7rem;z-index:125}
#selbar .sum{flex:1;min-width:0;line-height:1.3}
#selbar .sum b{display:block;font-size:.94rem;font-weight:800}
#selbar .sum span{font-size:.79rem;color:var(--dim)}
#selbar .clr{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--paper);color:var(--dim);cursor:pointer;display:grid;place-items:center}
#selbar .clr svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

#lb{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh;overflow:visible}
#lb::backdrop{background:rgba(20,12,16,.92)}
#lb img{max-width:94vw;max-height:86vh;border-radius:14px;object-fit:contain}
#lb .x{position:fixed;top:calc(.9rem + env(safe-area-inset-top));inset-inline-end:.9rem;
  width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;
  cursor:pointer;display:grid;place-items:center}
#lb .x svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

#toast{position:fixed;bottom:calc(6.2rem + env(safe-area-inset-bottom));inset-inline:0;margin-inline:auto;
  width:max-content;max-width:88vw;background:var(--ink);color:#fff;padding:.6rem 1.1rem;
  border-radius:999px;font-size:.85rem;font-weight:600;opacity:0;transform:translateY(14px);
  pointer-events:none;transition:.3s var(--e);z-index:260}
#toast.on{opacity:1;transform:none}
#up{position:fixed;inset-inline-end:1rem;bottom:calc(6.2rem + env(safe-area-inset-bottom));z-index:118;
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--paper);
  border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;color:var(--rose);
  opacity:0;pointer-events:none;transition:.3s var(--e)}
#up.on{opacity:1;pointer-events:auto}
#up svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;
    transition-duration:.01ms!important}
  #intro{display:none}
  html{scroll-behavior:auto}
}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}
</style>

var lang=root.getAttribute("lang")==="en"?"en":"ar";

function dead(i){i.addEventListener("error",function(){i.classList.add("dead")})}
function priceOf(s){return parseInt(S(s.price).replace(/[^\d]/g,""),10)||0}
function nameOf(s){return S((lang==="en"&&s.name_en)?s.name_en:s.name)}
function descOf(s){return S((lang==="en"&&s.desc_en)?s.desc_en:s.desc)}

function target(el,n){if(!el)return;el.style.setProperty("--to",n);
  if(!CSS.supports("animation-timeline: view()"))el.style.setProperty("--n",n)}
function initial(s){return S(s).replace(/^(صالون|مركز|مشغل)\s+/,"").trim().charAt(0)||"•"}

function countLabel(n){
  if(lang==="en")return n+" service"+(n===1?"":"s");
  if(n===1)return "خدمة واحدة";
  if(n===2)return "خدمتان";
  if(n>=3&&n<=10)return n+" خدمات";
  return n+" خدمة";
}

   never an invention. Anything unmatched simply has no category card. */

 ["cHair",/شعر|قص|صبغ|تصفيف|كيرات|هاي\s*لايت|فرد|بروتين|hair|cut|colou?r|blow|styl|kerat/i,

];
function catOf(s){
  var t=S(s.name)+" "+S(s.name_en)+" "+S(s.desc);
  for(var i=0;i<CATS.length;i++)if(CATS[i][1].test(t))return i;
  return -1;
}

var BANDS=[["fAll",function(){return true}],
           ["fLow",function(p){return p<200}],
           ["fMid",function(p){return p>=200&&p<=300}],
           ["fHigh",function(p){return p>300}]];
var band=0,catFilter=null;

/* several sub-paths per icon, split on "|" */
function icon(d){
  var g=document.createElementNS(SVG,"svg");g.setAttribute("viewBox","0 0 24 24");
  String(d).split("|").forEach(function(seg){
    var p=document.createElementNS(SVG,"path");p.setAttribute("d",seg);g.appendChild(p)});
  return g;
}
function waIcon(){
  var g=document.createElementNS(SVG,"svg");g.setAttribute("viewBox","0 0 24 24");
  g.setAttribute("fill","currentColor");
  var u=document.createElementNS(SVG,"use");u.setAttribute("href","#wa");g.appendChild(u);return g;
}

function drawCats(){
  var t=TXT[lang],box=$("#catBox");box.textContent="";
  var counts={};
  (C.services||[]).forEach(function(s){var c=catOf(s);if(c>-1)counts[c]=(counts[c]||0)+1});
  CATS.forEach(function(cat,i){
    if(!counts[i])return;
    var b=document.createElement("button");b.type="button";b.className="cat";
    b.setAttribute("aria-pressed",catFilter===i?"true":"false");
    var ic=document.createElement("div");ic.className="ic";ic.appendChild(icon(cat[2]));
    var h=document.createElement("h3");h.textContent=t[cat[0]];
    var n=document.createElement("div");n.className="n";n.textContent=countLabel(counts[i]);
    b.appendChild(ic);b.appendChild(h);b.appendChild(n);
    b.addEventListener("click",function(){
      catFilter=(catFilter===i)?null:i;band=0;
      $$("#filters button").forEach(function(x,j){x.setAttribute("aria-pressed",j===0?"true":"false")});
      drawCats();drawCards();
      $("#svc").scrollIntoView({behavior:"smooth",block:"start"});
    });
    box.appendChild(b);
  });
}

function drawCards(){
  var t=TXT[lang],box=$("#cards");box.textContent="";
  (C.services||[]).forEach(function(s,i){
    if(!BANDS[band][1](priceOf(s)))return;
    if(catFilter!==null&&catOf(s)!==catFilter)return;
    var c=document.createElement("article");
    c.setAttribute("role","button");c.setAttribute("tabindex","0");
    c.setAttribute("aria-pressed",PICK[i]?"true":"false");
    var tick=document.createElement("div");tick.className="tick";
    tick.appendChild(icon("M5 13l4 4L19 7"));
    var a=document.createElement("div");a.className="nm";a.textContent=nameOf(s);
    var b=document.createElement("div");b.className="ds";b.textContent=descOf(s);
    var f=document.createElement("div");f.className="foot";
    var pr=document.createElement("div");pr.className="pr";
    pr.textContent=(S(s.price).replace(/[^\d٠-٩]/g,"")||S(s.price))+" ";
    var sm=document.createElement("small");sm.textContent=t.cur;pr.appendChild(sm);
    var go=document.createElement("span");go.className="go";
    go.appendChild(waIcon());go.appendChild(document.createTextNode(t.ask));
    f.appendChild(pr);f.appendChild(go);
    c.appendChild(tick);c.appendChild(a);c.appendChild(b);c.appendChild(f);
    function toggle(){PICK[i]=!PICK[i];c.setAttribute("aria-pressed",PICK[i]?"true":"false");
      savePick();drawSel();toast(PICK[i]?t.tAdded:t.tRemoved)}
    c.addEventListener("click",toggle);
    c.addEventListener("keydown",function(e){
      if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle()}});
    box.appendChild(c);
  });
}

function drawSel(){
  var t=TXT[lang],picked=[],total=0;
  (C.services||[]).forEach(function(s,i){if(PICK[i]){picked.push(s);total+=priceOf(s)}});
  $("#selbar").classList.toggle("on",picked.length>0);
  $("#bar").classList.toggle("hushed",picked.length>0);
  if(!picked.length)return;
  $("#selCount").textContent=picked.length+" "+(picked.length===1?t.selOne:t.selMany);
  $("#selTotal").textContent=t.selTotal+" · "+total+" "+t.cur;
  var lines=picked.map(function(s){return "• "+nameOf(s)+" — "+priceOf(s)+" "+t.cur});
  $("#selGo").href="https://wa.me/"+encodeURIComponent(C.whatsapp)+"?text="+
    encodeURIComponent(t.waPick+"\n"+lines.join("\n")+"\n"+t.waTotal+": "+total+" "+t.cur);
}

var DAYS_AR=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var DAYS_EN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var TD_AR=DAYS_AR[new Date().getDay()],TD_EN=DAYS_EN[new Date().getDay()];
function drawHours(){
  var body=$("#hrBody");body.textContent="";
  var raw=F("hours");
  if(!raw){body.textContent="—";return}
  raw.split(/[،,]/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(part){
    var m=part.match(/^(.*?)([\d٠-٩].*)$/);
    var d=document.createElement("div");d.className="line";
    var label=m?m[1].trim():part;
    if(label.indexOf(TD_AR)>-1||label.indexOf(TD_EN)>-1)d.classList.add("today");
    var a=document.createElement("span");a.textContent=label;
    var b=document.createElement("span");b.textContent=m?m[2].trim():"";
    d.appendChild(a);d.appendChild(b);body.appendChild(d);
  });
}

function paint(){
  var t=TXT[lang];
  root.setAttribute("lang",lang);
  root.setAttribute("dir",lang==="ar"?"rtl":"ltr");
  $("#langTxt").textContent=t.lang;
  $$("[data-t]").forEach(function(e){e.textContent=t[e.getAttribute("data-t")]||""});

  var name=F("salon_name"),city=F("city");
  document.title=name+" — "+city;
  $("#fName").textContent=name;$("#hCity").textContent=city;$("#fCity").textContent=city;
  $("#bNm").textContent=name;$("#bMk").textContent=initial(name);

  var h=$("#hName");h.textContent="";
  name.split(/\s+/).filter(Boolean).forEach(function(w,i){
    var s=document.createElement("span");s.textContent=w;
    s.style.animationDelay=(1.3+i*.08).toFixed(2)+"s";
    h.appendChild(s);h.appendChild(document.createTextNode(" "));
  });

  var tg=$("#hTags");tg.textContent="";
  F("tagline").split("·").map(function(x){return x.trim()}).filter(Boolean).forEach(function(x){
    var s=document.createElement("span");s.className="chip";s.textContent=x;tg.appendChild(s)});

  $("#tRate").textContent=RATE.toFixed(1);
  target($("#tRevs"),parseInt(C.reviews_count,10)||0);
  target($("#tSvc"),(C.services||[]).length);
  target($("#tFrom"),PRICES.length?Math.min.apply(null,PRICES):0);

  /* the About paragraph is written out of the salon's own numbers */
  var ab=$('[data-t="abP"]');
  if(ab)ab.textContent=t.abP.replace("{city}",city).replace("{n}",countLabel((C.services||[]).length))
    .replace("{r}",RATE.toFixed(1)).replace("{rv}",C.reviews_count||"—");

  var msg=(lang==="en"&&C.whatsapp_msg_en)?C.whatsapp_msg_en:C.whatsapp_msg;
  WA="https://wa.me/"+encodeURIComponent(C.whatsapp)+"?text="+encodeURIComponent(msg||"");
  ["ctaHero","ctaBook","ctaBar","ctaTop"].forEach(function(id){var e=$("#"+id);if(e)e.href=WA});

  var fl=$("#filters");fl.textContent="";
  BANDS.forEach(function(bnd,i){
    var n=(C.services||[]).filter(function(x){return bnd[1](priceOf(x))}).length;
    var b=document.createElement("button");b.type="button";b.textContent=t[bnd[0]];
    var cc=document.createElement("span");cc.className="c";cc.textContent=n;b.appendChild(cc);
    b.setAttribute("aria-pressed",i===band?"true":"false");
    b.addEventListener("click",function(){band=i;catFilter=null;
      $$("#filters button").forEach(function(x,j){x.setAttribute("aria-pressed",j===i?"true":"false")});
      drawCats();drawCards()});
    fl.appendChild(b);
  });
  drawCats();drawCards();drawSel();

  var qa=$("#qa");qa.textContent="";
  [1,2,3,4,5,6].forEach(function(i){
    var d=document.createElement("details");
    var su=document.createElement("summary");su.textContent=t["q"+i];
    var p=document.createElement("p");p.textContent=t["a"+i];
    d.appendChild(su);d.appendChild(p);qa.appendChild(d);
  });
  $("#hrFree").textContent=t.hrFree;drawHours();

  $("#vAddr").textContent=F("address")||"—";
  if(C.phone){$("#vPhone").textContent=C.phone;$("#vPhone").href="tel:"+S(C.phone).replace(/\s/g,"")}
  if(C.maps_url)$("#vMap").href=C.maps_url; else $("#vMap").hidden=true;
  var op=$("#hOpen"),hh=F("hours");
  if(hh){op.hidden=false;op.textContent=hh}else{op.hidden=true}
}

/* lightbox on a native dialog — backdrop, Escape and focus handling for free */
function openLb(e){
  var fig=e.target.closest("figure");if(!fig)return;
  var im=fig.querySelector("img");if(!im||im.classList.contains("dead"))return;
  $("#lbImg").src=im.src;$("#lb").showModal();
}

$("#btnShare").addEventListener("click",function(){
  var t=TXT[lang],d={title:F("salon_name"),text:F("salon_name")+" — "+F("city"),url:location.href};
  if(navigator.share){navigator.share(d).then(function(){toast(t.tShared)}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(location.href)
    .then(function(){toast(t.tShared)})}});
$("#btnCopy").addEventListener("click",function(){
  var t=TXT[lang],a=F("address");if(!a||!navigator.clipboard)return;
  navigator.clipboard.writeText(a).then(function(){toast(t.tCopied)})});
$("#up").addEventListener("click",function(){scrollTo({top:0,behavior:"smooth"})});

(function(){
  var links=$$("nav.links a");
  var secs=links.map(function(a){return $(a.getAttribute("href"))}).filter(Boolean);
  if(!secs.length||!("IntersectionObserver" in window))return;
  var spy=new IntersectionObserver(function(es){
    es.forEach(function(e){if(!e.isIntersecting)return;
      links.forEach(function(a){
        a.classList.toggle("active",a.getAttribute("href")==="#"+e.target.id)})})},
    {rootMargin:"-45% 0px -50% 0px"});
  secs.forEach(function(x){spy.observe(x)});
})();

addEventListener("scroll",function(){
  $("#bar").classList.toggle("on",scrollY>560);
  $("#up").classList.toggle("on",scrollY>900)},{passive:true});

setTimeout(function(){var i=$("#intro");if(i&&i.parentNode)i.parentNode.removeChild(i)},2100);

if(!CSS.supports("animation-timeline: view()")&&"IntersectionObserver" in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
    e.target.animate([{opacity:0,transform:"translateY(28px)"},{opacity:1,transform:"none"}],
      {duration:700,easing:"cubic-bezier(.16,1,.3,1)",fill:"both"});io.unobserve(e.target)}})},
    {threshold:.1});
  $$(".rv").concat($$(".stagger>*")).forEach(function(e){io.observe(e)});
}
})();
