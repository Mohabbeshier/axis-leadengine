<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F8F5F1">
<meta name="robots" content="noindex">
<title>صالون</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@300;400&family=Tajawal:wght@200;300;400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@300;400&family=Tajawal:wght@200;300;400;500&display=swap"></noscript>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   AXIS — demo template v12  ·  "المحجر"  (the quarry)
   Architecture, not cosmetics. Travertine, limestone, walnut, bronze and
   olive on warm ivory. Typography carries the emotion; photography is
   large, rare and force-graded so images from different sources read as
   one campaign. Motion is scroll-driven CSS with luxury easing — no
   library, because this page is opened cold from a WhatsApp link on a
   phone and every kilobyte of JS is paid for by the person we are trying
   to impress.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* the brief's palette, verbatim */
  --ivory:#F8F5F1;
  --surface:#EFE7DE;
  --travertine:#DDD0C2;
  --walnut:#7B614D;
  --bronze:#A88863;
  --stone:#AAA39A;
  --char:#171717;
  --olive:#7B8464;

  --fd:"Amiri",serif;            /* Arabic display  */
  --fl:"Cormorant Garamond",serif;/* Latin display  */
  --fb:"Tajawal",system-ui,sans-serif;
  --f:var(--fb);
  --slow:cubic-bezier(.19,1,.22,1);
  --sx:1;
  --gut:clamp(1.4rem,6vw,7rem);
  --air:clamp(6rem,18vh,14rem);
}
html[lang="en"]{--fd:var(--fl)}
html[dir="rtl"]{--sx:-1}

*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;background:var(--ivory)}
body{background:var(--ivory);color:var(--char);font-family:var(--f);
  font-weight:300;font-size:clamp(.98rem,.92rem + .22vw,1.06rem);line-height:2;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;letter-spacing:0}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--bronze);color:var(--ivory)}
:focus-visible{outline:1px solid var(--walnut);outline-offset:6px}
h1,h2,h3{font-weight:400;line-height:1.16;letter-spacing:-.005em}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.42;letter-spacing:0}
.serif{font-family:var(--fd)}
p{text-wrap:pretty;max-width:62ch}
.wrap{width:min(1440px,100% - var(--gut)*2);margin-inline:auto;position:relative}
section{position:relative}
/* jumping to a section must not park its heading under the floating nav */
section[id]{scroll-margin-top:clamp(4.5rem,12vh,7rem)}

/* Latin small-caps labels get tracking; Arabic is joined and never does */
.label{font-family:var(--fb);font-weight:400;font-size:.7rem;color:var(--walnut)}
html[lang="en"] .label{letter-spacing:.34em;text-transform:uppercase}
html[lang="ar"] .label{letter-spacing:normal;word-spacing:.28em}

/* ── one grade for every photograph, whatever its source ──
   This is the only way images from a mixed library read as a single
   campaign: force them all through the same transfer curve. */
.plate{position:relative;overflow:hidden;background:var(--travertine)}
.plate img{width:100%;height:100%;object-fit:cover;
  filter:sepia(.62) saturate(1.15) contrast(.96) brightness(1.06) hue-rotate(-12deg)}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(221,208,194,.34),rgba(123,97,77,.22));
  mix-blend-mode:multiply}
.plate img.dead{display:none}

/* ── the loading sequence: a bronze rule draws, the name settles, it lifts ── */
#veil{position:fixed;inset:0;z-index:500;background:var(--ivory);
  display:grid;place-items:center;animation:veil 1.1s var(--slow) 1.9s forwards}
#veil .in{text-align:center;padding-inline:2rem}
#veil .nm{font-family:var(--fd);font-size:clamp(1.3rem,4.4vw,2rem);color:var(--char);
  opacity:0;animation:veilName 1.2s var(--slow) .45s forwards}
#veil .rule{height:1px;width:0;background:var(--bronze);margin:1.4rem auto 0;
  animation:veilRule 1.5s var(--slow) .15s forwards}
@keyframes veilRule{to{width:min(260px,52vw)}}
@keyframes veilName{from{opacity:0;filter:blur(8px);transform:translateY(10px)}
                    to{opacity:1;filter:none;transform:none}}
@keyframes veil{to{opacity:0;visibility:hidden}}

/* entrance beats, after the veil */
.b1,.b2,.b3,.b4{animation:settle 1.5s var(--slow) both}
.b1{animation-delay:2.5s}.b2{animation-delay:2.68s}
.b3{animation-delay:2.86s}.b4{animation-delay:3.04s}
@keyframes settle{from{opacity:0;transform:translateY(26px);filter:blur(6px)}
                  to{opacity:1;transform:none;filter:none}}

/* ── motion: scroll-driven, physically slow ── */
.rise{opacity:1}
@supports (animation-timeline: view()){
  .rise{animation:riseIn both;animation-timeline:view();animation-range:entry 0% cover 32%}
  @keyframes riseIn{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
  /* an image is uncovered rather than faded in */
  .uncover{animation:uncoverIn linear both;animation-timeline:view();
    animation-range:entry 4% cover 40%}
  @keyframes uncoverIn{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
  .lineIn{animation:lineDraw linear both;animation-timeline:view();animation-range:entry 10% cover 34%}
  @keyframes lineDraw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .par img{animation:parY linear both;animation-timeline:view();animation-range:cover}
  @keyframes parY{from{transform:scale(1.16) translateY(-4.5%)}
                  to{transform:scale(1.16) translateY(4.5%)}}
  /* the statement type drifts a little slower than the page */
  .drag{animation:dragY linear both;animation-timeline:view();animation-range:cover}
  @keyframes dragY{from{transform:translateY(6%)}to{transform:translateY(-6%)}}
  /* the hero plate is not also a .par, so this owns transform alone */
  #hero .plate img{animation:heroPush linear both;animation-timeline:view();animation-range:exit}
  @keyframes heroPush{from{transform:scale(1.04)}to{transform:scale(1.14)}}
  #veilbar{animation:bar linear both;animation-timeline:scroll(root)}
  @keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
#veilbar{position:fixed;top:0;inset-inline:0;height:1px;z-index:300;background:var(--bronze);
  transform:scaleX(0);transform-origin:0 50%;opacity:.6}
html[dir="rtl"] #veilbar{transform-origin:100% 50%}

/* ══ navigation — floating, quiet, never a bar ══ */
nav.float{position:fixed;top:0;inset-inline:0;z-index:200;padding:clamp(1rem,3vw,2rem) var(--gut);
  padding-top:calc(clamp(1rem,3vw,2rem) + env(safe-area-inset-top));
  display:flex;align-items:center;gap:1.2rem;
  animation:settle 1.4s var(--slow) 2.4s both;
  transition:opacity .6s var(--slow),transform .6s var(--slow)}
nav.float.away{opacity:0;transform:translateY(-14px);pointer-events:none}
nav .mark{font-family:var(--fd);font-size:1.02rem;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav .set{display:none;gap:1.6rem;font-size:.78rem;color:var(--walnut)}
nav .set a{position:relative;padding-block:.2rem}
nav .set a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;
  background:currentColor;transform:scaleX(0);transform-origin:var(--sx-o,100%) 50%;
  transition:transform .5s var(--slow)}
nav .set a:hover::after,nav .set a.on::after{transform:scaleX(1)}
@media(min-width:1000px){nav .set{display:flex}}
nav .lang{font-size:.72rem;color:var(--walnut);letter-spacing:.1em}
nav .ask{font-size:.78rem;color:var(--char);border-bottom:1px solid var(--bronze);padding-bottom:.15rem}

/* ══ HERO — one photograph, one name, nothing else ══ */
#hero{height:100svh;min-height:560px;display:grid;align-items:end;overflow:hidden}
#hero .plate{position:absolute;inset:0}
#hero .vig{position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(180deg,rgba(23,20,17,.42) 0%,rgba(23,20,17,.16) 26%,
                    rgba(23,20,17,.30) 58%,rgba(23,20,17,.78) 100%),
    radial-gradient(120% 85% at 50% 42%,rgba(23,20,17,.10),rgba(23,20,17,.52) 100%)}
#hero .in{position:relative;z-index:2;text-align:start;width:100%;
  padding:0 var(--gut) clamp(5.5rem,14vh,9rem)}
.h-place{font-size:.72rem;color:var(--ivory);opacity:.9}
html[lang="en"] .h-place{letter-spacing:.4em;text-transform:uppercase}
.h-name{font-family:var(--fd);color:var(--ivory);margin-top:1rem;max-width:14ch;
  font-size:clamp(2.4rem,8.4vw,7.5rem);line-height:1.18;
  text-shadow:0 2px 40px rgba(23,23,23,.28)}
html[lang="ar"] .h-name{line-height:1.5}
.h-sub{margin-top:1.2rem;color:var(--ivory);opacity:.82;font-size:.86rem;font-weight:200;
  max-width:34ch}
.h-ask{display:inline-block;margin-top:2rem;color:var(--ivory);font-size:.82rem;
  border-bottom:1px solid rgba(248,245,241,.5);padding-bottom:.3rem;
  transition:border-color .5s var(--slow),letter-spacing .5s var(--slow)}
.h-ask:hover{border-color:var(--ivory)}
.h-scroll{position:absolute;bottom:clamp(1.2rem,3.4vh,2.4rem);inset-inline-end:var(--gut);z-index:2;
  color:var(--ivory);font-size:.6rem;opacity:.7;text-align:center}
.h-scroll i{display:block;width:1px;height:38px;background:currentColor;margin:.7rem auto 0;
  transform-origin:50% 0;animation:drop 2.6s var(--slow) infinite}
@keyframes drop{0%{transform:scaleY(0);opacity:0}30%{opacity:1}
                60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1) translateY(38px);opacity:0}}

/* ══ statement — type occupies the screen ══ */
.statement{padding:var(--air) 0}
.statement h2{font-family:var(--fd);font-size:clamp(1.9rem,6.4vw,5.4rem);max-width:16ch;
  color:var(--char)}
.statement .sig{margin-top:clamp(2rem,5vw,3.4rem);display:flex;gap:clamp(1.4rem,4vw,4rem);
  flex-wrap:wrap;color:var(--walnut);font-size:.78rem}

/* ── an editorial spread: image and text out of alignment on purpose ── */
.spread{display:grid;gap:clamp(1.6rem,4vw,4rem);align-items:end;padding-bottom:var(--air)}
@media(min-width:900px){
  .spread{grid-template-columns:repeat(12,1fr)}
  .spread .art{grid-column:1/8}
  .spread .say{grid-column:9/13;padding-bottom:clamp(1rem,6vw,5rem)}
  .spread.flip .art{grid-column:6/13}
  .spread.flip .say{grid-column:1/5}
}
.spread .art{aspect-ratio:4/5;border-radius:clamp(28px,3vw,40px);overflow:hidden}
.spread .say h3{font-family:var(--fd);font-size:clamp(1.5rem,3.4vw,2.6rem);margin:.9rem 0 1rem}
.spread .say p{color:var(--walnut);font-size:.94rem}

/* ── the index: services as an editorial contents page ── */
.index{border-top:1px solid var(--travertine)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:1rem clamp(1rem,3vw,2.6rem);
  align-items:baseline;padding:clamp(1.5rem,3.4vw,2.4rem) 0;
  border-bottom:1px solid var(--travertine);position:relative;
  cursor:pointer;-webkit-user-select:none;user-select:none;
  transition:padding-inline .6s var(--slow),background .6s var(--slow)}
.row:hover{padding-inline:clamp(.5rem,1.6vw,1.4rem);background:var(--surface)}
.row .no{font-family:var(--fl);font-size:.82rem;color:var(--stone)}
.row .nm{font-family:var(--fd);font-size:clamp(1.15rem,2.7vw,1.85rem);color:var(--char)}
.row .ds{grid-column:2;font-size:.84rem;color:var(--stone);margin-top:.15rem}
.row .pr{font-family:var(--fl);font-size:clamp(1rem,2.2vw,1.35rem);color:var(--walnut);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.row .pr b{font-weight:400}
.row .pr small{font-size:.62em;color:var(--stone);margin-inline-start:.35em}
.row .mark{position:absolute;inset-inline-start:-1.4rem;top:50%;translate:0 -50%;
  width:6px;height:6px;border-radius:50%;background:var(--olive);
  opacity:0;transform:scale(.4);transition:.5s var(--slow)}
.row[aria-pressed="true"]{background:var(--surface)}
.row[aria-pressed="true"] .mark{opacity:1;transform:none}
.row[aria-pressed="true"] .nm{color:var(--walnut)}

/* ── a full-bleed plate between chapters ── */
.bleed{height:clamp(58svh,70vh,86svh);overflow:hidden;margin-block:var(--air)}
.bleed .plate{height:100%}

/* ── numbers, spoken quietly ── */
.count{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(2rem,5vw,4rem) 1rem;
  padding-block:var(--air);border-top:1px solid var(--travertine)}
@media(min-width:800px){.count{grid-template-columns:repeat(4,1fr)}}
.count .v{font-family:var(--fl);font-size:clamp(2.4rem,6vw,4.4rem);color:var(--char);
  line-height:1;font-variant-numeric:tabular-nums}
.count .k{margin-top:.7rem;color:var(--stone);font-size:.76rem}
@property --n{syntax:"<integer>";initial-value:0;inherits:false}
.tally{counter-reset:n var(--n)}
.tally::after{content:counter(n)}
@supports (animation-timeline: view()){
  .tally{animation:tallyGo .1s linear both;animation-timeline:view();
    animation-range:entry 18% entry 88%}
  @keyframes tallyGo{to{--n:var(--to)}}
}

/* ── gallery: staggered, never a grid of equal squares ── */
.gal{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(.8rem,2vw,2rem);
  padding-bottom:var(--air)}
.gal figure{overflow:hidden;border-radius:clamp(28px,3vw,40px)}
.gal figure:nth-child(1){grid-column:1/9;aspect-ratio:4/3}
.gal figure:nth-child(2){grid-column:9/13;aspect-ratio:3/4;align-self:end}
.gal figure:nth-child(3){grid-column:3/13;aspect-ratio:16/9;margin-top:clamp(1rem,4vw,4rem)}
@media(max-width:760px){
  .gal figure:nth-child(1){grid-column:1/13;aspect-ratio:4/3}
  .gal figure:nth-child(2){grid-column:1/9;aspect-ratio:3/4}
  .gal figure:nth-child(3){grid-column:4/13;aspect-ratio:4/3}
}

/* ── a single voice, large ── */
.voice{padding-block:var(--air);border-top:1px solid var(--travertine)}
.voice blockquote{font-family:var(--fd);font-size:clamp(1.4rem,3.6vw,2.8rem);
  max-width:22ch;color:var(--char)}
.voice cite{display:block;margin-top:1.6rem;font-style:normal;color:var(--stone);font-size:.78rem}

/* ── visit ── */
.visit{display:grid;gap:clamp(1.6rem,4vw,3rem);padding-bottom:var(--air)}
@media(min-width:900px){.visit{grid-template-columns:repeat(12,1fr)}
  .visit .col{grid-column:span 4}}
.visit .col h4{font-family:var(--fb);font-weight:400;font-size:.72rem;color:var(--walnut);
  margin-bottom:1rem}
html[lang="en"] .visit .col h4{letter-spacing:.3em;text-transform:uppercase}
.visit .col p,.visit .col a{font-size:.95rem;color:var(--char)}
.visit .hr{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;
  border-bottom:1px solid var(--travertine);font-size:.88rem}
.visit .hr:last-child{border-bottom:0}
.visit .hr.today{color:var(--olive)}
.visit .hr span:last-child{color:var(--stone);font-variant-numeric:tabular-nums}

/* ── the whisper ── */
.whisper{text-align:center;padding-block:var(--air);border-top:1px solid var(--travertine)}
.whisper h2{font-family:var(--fd);font-size:clamp(1.8rem,5.4vw,4.2rem);max-width:18ch;
  margin-inline:auto}
.whisper .go{display:inline-block;margin-top:clamp(2rem,4vw,3rem);font-size:.86rem;
  color:var(--char);border-bottom:1px solid var(--bronze);padding-bottom:.35rem;
  transition:letter-spacing .6s var(--slow),border-color .6s var(--slow)}
.whisper .go:hover{border-color:var(--char)}
html[lang="en"] .whisper .go:hover{letter-spacing:.06em}

footer{padding-block:clamp(2.4rem,6vw,4rem);border-top:1px solid var(--travertine);
  display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;
  color:var(--stone);font-size:.74rem}
footer .n{font-family:var(--fd);color:var(--char);font-size:.95rem}

/* ── the standing invitation, only once the hero is behind you ── */
#dock{position:fixed;bottom:0;inset-inline:0;z-index:190;
  padding:1rem var(--gut) calc(1rem + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(248,245,241,0),rgba(248,245,241,.94) 42%);
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  transform:translateY(110%);transition:transform .8s var(--slow)}
#dock.up{transform:none}
#dock .sum{font-size:.78rem;color:var(--walnut);min-width:0}
#dock .sum b{font-family:var(--fl);font-weight:400;color:var(--char);
  font-variant-numeric:tabular-nums}
#dock .go{font-size:.82rem;white-space:nowrap;border-bottom:1px solid var(--bronze);
  padding-bottom:.25rem}

#lb{border:0;padding:0;background:transparent;max-width:100vw;max-height:100vh}
#lb::backdrop{background:rgba(23,23,23,.94)}
#lb img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:clamp(20px,2vw,28px)}
#lb .x{position:fixed;top:calc(1rem + env(safe-area-inset-top));inset-inline-end:1rem;
  color:var(--ivory);font-size:.76rem;letter-spacing:.2em}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;
    transition-duration:.01ms!important}
  #veil{display:none}
  html{scroll-behavior:auto}
}
::view-transition-old(root),::view-transition-new(root){animation-duration:.5s}
</style>
</head>
<body>

<div id="veil"><div class="in"><div class="nm" id="vName"></div><div class="rule"></div></div></div>
<div id="veilbar" aria-hidden="true"></div>

<nav class="float" id="nav">
  <span class="mark" id="nName"></span>
  <span class="set">
    <a href="#story" data-t="nStory"></a><a href="#index" data-t="nIndex"></a>
    <a href="#gallery" data-t="nGallery"></a><a href="#visit" data-t="nVisit"></a>
  </span>
  <button class="lang" id="langBtn" type="button"><span id="langTxt">EN</span></button>
  <a class="ask" id="ctaNav" href="#"><span data-t="ask"></span></a>
</nav>

<section id="hero">
  <div class="plate"><img id="p0" alt="" decoding="async" fetchpriority="high"></div>
  <div class="vig"></div>
  <div class="in">
    <p class="h-place b1" id="hPlace"></p>
    <h1 class="h-name b2" id="hName"></h1>
    <p class="h-sub b3" id="hSub"></p>
    <a class="h-ask b4" id="ctaHero" href="#"><span data-t="ask"></span></a>
  </div>
  <div class="h-scroll b4"><span data-t="scroll"></span><i></i></div>
</section>

<section id="story" class="statement"><div class="wrap">
  <h2 class="serif rise drag" data-t="stH"></h2>
  <div class="sig rise">
    <span data-t="sg1"></span><span data-t="sg2"></span><span data-t="sg3"></span>
  </div>
</div></section>

<div class="wrap">
  <div class="spread">
    <figure class="art plate par uncover"><img id="p1" alt="" loading="lazy" decoding="async"></figure>
    <div class="say rise">
      <span class="label" data-t="ch1"></span>
      <h3 class="serif" data-t="s1h"></h3>
      <p data-t="s1p"></p>
    </div>
  </div>
</div>

<div class="bleed plate par uncover"><img id="p2" alt="" loading="lazy" decoding="async"></div>

<section id="index" class="wrap">
  <span class="label rise" data-t="ixK"></span>
  <h2 class="serif rise" style="font-size:clamp(1.7rem,4.6vw,3.4rem);margin:.8rem 0 clamp(2rem,5vw,3.4rem)" data-t="ixH"></h2>
  <div class="index" id="rows"></div>
  <p class="rise" style="margin-top:1.6rem;color:var(--stone);font-size:.8rem" data-t="ixNote"></p>
</section>

<div class="wrap">
  <div class="spread flip" style="padding-top:var(--air)">
    <figure class="art plate par uncover"><img id="p3" alt="" loading="lazy" decoding="async"></figure>
    <div class="say rise">
      <span class="label" data-t="ch2"></span>
      <h3 class="serif" data-t="s2h"></h3>
      <p data-t="s2p"></p>
    </div>
  </div>
</div>

<section class="wrap"><div class="count">
  <div class="rise"><div class="v"><span class="tally" id="cRate"></span></div><div class="k" data-t="cRateK"></div></div>
  <div class="rise"><div class="v"><span class="tally" id="cRev"></span></div><div class="k" data-t="cRevK"></div></div>

<section id="gallery" class="wrap">
  <span class="label rise" data-t="glK"></span>
  <h2 class="serif rise" style="font-size:clamp(1.7rem,4.6vw,3.4rem);margin:.8rem 0 clamp(2rem,5vw,3.4rem)" data-t="glH"></h2>

<section class="wrap voice" id="voice" hidden>

<section id="visit" class="wrap">
  <span class="label rise" data-t="viK"></span>
  <h2 class="serif rise" style="font-size:clamp(1.7rem,4.6vw,3.4rem);margin:.8rem 0 clamp(2rem,5vw,3.4rem)" data-t="viH"></h2>
  <div class="visit">
    <div class="col rise"><h4 data-t="viAddr"></h4><p id="vAddr"></p>
      <p style="margin-top:1rem"><a id="vMap" href="#" target="_blank" rel="noopener" style="border-bottom:1px solid var(--bronze);padding-bottom:.2rem"><span data-t="viMap"></span></a></p></div>
    <div class="col rise"><h4 data-t="viHours"></h4><div id="vHours"></div></div>

      <p style="margin-top:.6rem"><a id="ctaVisit" href="#" style="border-bottom:1px solid var(--bronze);padding-bottom:.2rem"><span data-t="ask"></span></a></p></div>
  </div>
</section>

<section class="wrap whisper">
  <h2 class="serif rise" data-t="whH"></h2>
  <a class="go rise" id="ctaEnd" href="#"><span data-t="whGo"></span></a>
</section>

<footer class="wrap">
  <div><div class="n" id="fName"></div><div id="fCity"></div></div>
  <div>Crafted by Axis Marketing Agency</div>
</footer>

<div id="dock">
  <div class="sum" id="dockSum"></div>
  <a class="go" id="ctaDock" href="#"><span data-t="ask"></span></a>
</div>
<dialog id="lb"><button class="x" id="lbX" type="button">CLOSE</button><img id="lbImg" alt=""></dialog>

<script>
const CONFIG = {
  "salon_name": "صالون اكليد",
  "city": "الرياض · العارض",
  "tagline": "قص شعر · تمشيط وتصفيف · صبغ جزئي · صبغ كامل",

  "photos": [],

  "whatsapp_msg_en": "Hello, I would like to book an appointment"
};

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)},
    $$=function(s){return [].slice.call(document.querySelectorAll(s))},
    C=CONFIG,root=document.documentElement;

var TXT={
 ar:{lang:"EN",
  nStory:"الحكاية",nIndex:"الفهرس",nGallery:"المكان",nVisit:"الزيارة",
  ask:"اطلبي موعدك",scroll:"انزلي",
  stH:"مكانٌ صُنع ليُبطئ الوقت، لا ليملأه.",
  sg1:"للنساء وحدهنّ",sg2:"بالموعد فقط",sg3:"في {city}",
  ch1:"الفصل الأول",
  s1h:"الضوء أولاً",
  s1p:"بنينا المكان حول الضوء الطبيعي: حجرٌ دافئ، وخشبٌ صادق، وظلٌّ يتحرك ببطء على الجدار طوال النهار. لا شيء يلمع أكثر مما ينبغي.",
  ch2:"الفصل الثاني",
  s2h:"الأدوات، وما لا يُرى",
  s2p:"كل أداة تُعقّم بعد كل ضيفة، وكل خامة تُختار مرة واحدة ولا تُستبدل بأرخص منها. الفرق يظهر في التفاصيل التي لا تُصوَّر.",
  ixK:"الفهرس",ixH:"الخدمات والأسعار",
  ixNote:"اختاري ما يناسبك ويصلك الطلب مكتوباً على واتساب — بلا مكالمة، وبلا انتظار.",
  glK:"المكان",glH:"لمحات",
  viK:"الزيارة",viH:"أين نكون",
  viAddr:"العنوان",viHours:"المواعيد",viReach:"للتواصل",viMap:"افتحي الخريطة",
  whH:"موعدكِ ينتظر.",whGo:"اطلبيه الآن",
  cRateK:"تقييم جوجل",cRevK:"ضيفة قيّمتنا",cSvcK:"خدمة",cFromK:"تبدأ من (ريال)",
  dockOne:"خدمة واحدة",dockMany:"خدمات",dockTotal:"الإجمالي",
  waPick:"السلام عليكم، أرغب بحجز:",waTotal:"الإجمالي التقريبي",
  cur:"ريال"},
 en:{lang:"ع",
  nStory:"Story",nIndex:"Index",nGallery:"Space",nVisit:"Visit",
  ask:"Request an appointment",scroll:"Scroll",
  stH:"A place built to slow time down, not to fill it.",
  sg1:"Women only",sg2:"By appointment",sg3:"In {city}",
  ch1:"Chapter one",
  s1h:"Light, first",
  s1p:"The room was built around daylight: warm stone, honest wood, and a shadow that moves slowly across the wall all day. Nothing shines more than it should.",
  ch2:"Chapter two",
  s2h:"The tools, and what is never seen",
  s2p:"Every instrument is sterilised after every guest, and every material is chosen once and never quietly replaced with something cheaper. The difference shows in the details nobody photographs.",
  ixK:"Index",ixH:"Services and prices",
  ixNote:"Choose what suits you and the request arrives written on WhatsApp — no call, no waiting.",
  glK:"The space",glH:"Glimpses",
  viK:"Visit",viH:"Where we are",
  viAddr:"Address",viHours:"Hours",viReach:"Reach us",viMap:"Open map",
  whH:"Your appointment is waiting.",whGo:"Request it",
  cRateK:"Google rating",cRevK:"guests rated us",cSvcK:"services",cFromK:"from (SAR)",
  dockOne:"service",dockMany:"services",dockTotal:"Total",
  waPick:"Hello, I would like to book:",waTotal:"Approximate total",
  cur:"SAR"}
};

var lang=root.getAttribute("lang")==="en"?"en":"ar";
function F(k){if(lang==="en"&&C[k+"_en"])return C[k+"_en"];return C[k]||""}
function S(v){return String(v==null?"":v)}
function dead(i){i.addEventListener("error",function(){i.classList.add("dead")})}
function priceOf(s){return parseInt(S(s.price).replace(/[^\d]/g,""),10)||0}
function nameOf(s){return S((lang==="en"&&s.name_en)?s.name_en:s.name)}
function descOf(s){return S((lang==="en"&&s.desc_en)?s.desc_en:s.desc)}

/* Every photograph passes through the same grade in CSS, so a mixed
   library still reads as one campaign. Real salon photographs, when the
   pipeline has them, arrive here and are graded identically. */
var STOCK=[
 "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=2000&q=85",
 "https://images.unsplash.com/photo-1519415510236-718bdfcd89c8?auto=format&fit=crop&w=1600&q=85",
 "https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?auto=format&fit=crop&w=1600&q=85"];
var POOL=(C.photos&&C.photos.length)?C.photos.concat(STOCK):STOCK;
function pick(i){return POOL[i%POOL.length]}

var RATE=parseFloat(C.rating)||0;
var PRICES=(C.services||[]).map(priceOf).filter(function(n){return n>0});
var PKEY="axis-pick-"+location.pathname,PICK={};
try{PICK=JSON.parse(localStorage.getItem(PKEY)||"{}")||{}}catch(e){PICK={}}
function savePick(){try{localStorage.setItem(PKEY,JSON.stringify(PICK))}catch(e){}}
function tally(el,n){if(!el)return;el.style.setProperty("--to",n);
  if(!CSS.supports("animation-timeline: view()"))el.style.setProperty("--n",n)}

var DAYS_AR=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var DAYS_EN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var TD_AR=DAYS_AR[new Date().getDay()],TD_EN=DAYS_EN[new Date().getDay()];

function drawRows(){
  var t=TXT[lang],box=$("#rows");box.textContent="";
  (C.services||[]).forEach(function(s,i){
    var r=document.createElement("div");r.className="row rise";
    r.setAttribute("role","button");r.setAttribute("tabindex","0");
    r.setAttribute("aria-pressed",PICK[i]?"true":"false");
    var mk=document.createElement("span");mk.className="mark";
    var no=document.createElement("span");no.className="no";
    no.textContent=(i<9?"0":"")+(i+1);
    var mid=document.createElement("div");
    var nm=document.createElement("div");nm.className="nm";nm.textContent=nameOf(s);
    var ds=document.createElement("div");ds.className="ds";ds.textContent=descOf(s);
    mid.appendChild(nm);mid.appendChild(ds);
    var pr=document.createElement("div");pr.className="pr";
    var b=document.createElement("b");b.textContent=priceOf(s)||S(s.price);
    var sm=document.createElement("small");sm.textContent=t.cur;
    pr.appendChild(b);pr.appendChild(sm);
    r.appendChild(mk);r.appendChild(no);r.appendChild(mid);r.appendChild(pr);
    function toggle(){PICK[i]=!PICK[i];r.setAttribute("aria-pressed",PICK[i]?"true":"false");
      savePick();drawDock()}
    r.addEventListener("click",toggle);
    r.addEventListener("keydown",function(e){
      if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle()}});
    box.appendChild(r);
  });
}

function drawDock(){
  var t=TXT[lang],picked=[],total=0;
  (C.services||[]).forEach(function(s,i){if(PICK[i]){picked.push(s);total+=priceOf(s)}});
  var wa="https://wa.me/"+encodeURIComponent(C.whatsapp)+"?text=";
  if(!picked.length){
    $("#dockSum").textContent="";
    $("#ctaDock").href=wa+encodeURIComponent(
      (lang==="en"&&C.whatsapp_msg_en)?C.whatsapp_msg_en:C.whatsapp_msg||"");
    return;
  }
  $("#dockSum").innerHTML="";
  var lead=document.createTextNode(
    picked.length+" "+(picked.length===1?t.dockOne:t.dockMany)+" · "+t.dockTotal+" ");
  var strong=document.createElement("b");strong.textContent=total+" "+t.cur;
  $("#dockSum").appendChild(lead);$("#dockSum").appendChild(strong);
  var lines=picked.map(function(s){return "• "+nameOf(s)+" — "+priceOf(s)+" "+t.cur});
  $("#ctaDock").href=wa+encodeURIComponent(
    t.waPick+"\n"+lines.join("\n")+"\n"+t.waTotal+": "+total+" "+t.cur);
}

function drawHours(){
  var box=$("#vHours");box.textContent="";
  var raw=F("hours");
  if(!raw){box.textContent="—";return}
  raw.split(/[،,]/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(part){
    var m=part.match(/^(.*?)([\d٠-٩].*)$/);
    var d=document.createElement("div");d.className="hr";
    var label=m?m[1].trim():part;
    if(label.indexOf(TD_AR)>-1||label.indexOf(TD_EN)>-1)d.classList.add("today");
    var a=document.createElement("span");a.textContent=label;
    var b=document.createElement("span");b.textContent=m?m[2].trim():"";
    d.appendChild(a);d.appendChild(b);box.appendChild(d);
  });
}

function paint(){
  var t=TXT[lang];
  root.setAttribute("lang",lang);
  root.setAttribute("dir",lang==="ar"?"rtl":"ltr");
  $("#langTxt").textContent=t.lang;
  $$("[data-t]").forEach(function(e){e.textContent=t[e.getAttribute("data-t")]||""});

  var name=F("salon_name"),city=F("city");
  document.title=name+" — "+city;
  $("#vName").textContent=name;$("#nName").textContent=name;
  $("#hName").textContent=name;$("#fName").textContent=name;
  $("#hPlace").textContent=city;$("#fCity").textContent=city;
  $("#hSub").textContent=F("tagline").split("·").map(function(x){return x.trim()})
    .filter(Boolean).slice(0,3).join("  ·  ");
  $$('[data-t="sg3"]').forEach(function(e){e.textContent=t.sg3.replace("{city}",city)});

  tally($("#cRev"),parseInt(C.reviews_count,10)||0);
  tally($("#cSvc"),(C.services||[]).length);
  tally($("#cFrom"),PRICES.length?Math.min.apply(null,PRICES):0);
  $("#cRate").textContent=RATE.toFixed(1);
  $("#cRate").classList.remove("tally");

  var msg=(lang==="en"&&C.whatsapp_msg_en)?C.whatsapp_msg_en:C.whatsapp_msg;
  var wa="https://wa.me/"+encodeURIComponent(C.whatsapp)+"?text="+encodeURIComponent(msg||"");
  ["ctaNav","ctaHero","ctaVisit","ctaEnd"].forEach(function(id){var e=$("#"+id);if(e)e.href=wa});

  $("#vAddr").textContent=F("address")||"—";
  if(C.phone){$("#vPhone").textContent=C.phone;$("#vPhone").href="tel:"+S(C.phone).replace(/\s/g,"")}
  if(C.maps_url)$("#vMap").href=C.maps_url; else $("#vMap").parentNode.hidden=true;

  var r=(C.reviews||[])[0];
  if(r&&r.text){$("#voice").hidden=false;$("#vq").textContent="“"+S(r.text)+"”";
    $("#vc").textContent=S(r.who)}
  drawRows();drawDock();drawHours();
}

/* imagery */
[["#p0",0],["#p1",1],["#p2",2],["#p3",0]].forEach(function(x){
  var e=$(x[0]);if(!e)return;e.src=pick(x[1]);dead(e);
});
[0,1,2].forEach(function(i){
  var f=document.createElement("figure");f.className="plate par uncover";
  var m=document.createElement("img");m.src=pick(i);m.alt="";m.loading="lazy";
  m.decoding="async";dead(m);f.appendChild(m);$("#gal").appendChild(f);
});

function swap(fn){
  if(document.startViewTransition&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    document.startViewTransition(fn)}else{fn()}
}
$("#langBtn").addEventListener("click",function(){
  swap(function(){lang=lang==="ar"?"en":"ar";
    try{localStorage.setItem("axis-lang",lang)}catch(e){}paint()})});

paint();

/* the veil is animation-only; take it out so it can never hold a tap */
setTimeout(function(){var v=$("#veil");if(v&&v.parentNode)v.parentNode.removeChild(v)},3200);

$("#gal").addEventListener("click",function(e){
  var f=e.target.closest("figure");if(!f)return;
  var im=f.querySelector("img");if(!im||im.classList.contains("dead"))return;
  $("#lbImg").src=im.src;$("#lb").showModal()});
$("#lbX").addEventListener("click",function(){$("#lb").close()});
$("#lb").addEventListener("click",function(e){if(e.target===this)this.close()});
$("#lb").addEventListener("close",function(){$("#lbImg").removeAttribute("src")});

/* navigation withdraws while you read, returns when you look up */
var lastY=0;
addEventListener("scroll",function(){
  var y=scrollY;
  $("#dock").classList.toggle("up",y>innerHeight*.9);
  $("#nav").classList.toggle("away",y>lastY&&y>innerHeight*.6);
  lastY=y;
},{passive:true});

(function(){
  var links=$$("nav .set a");
  var secs=links.map(function(a){return $(a.getAttribute("href"))}).filter(Boolean);
  if(!secs.length||!("IntersectionObserver" in window))return;
  var spy=new IntersectionObserver(function(es){
    es.forEach(function(e){if(!e.isIntersecting)return;
      links.forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+e.target.id)})})},
    {rootMargin:"-45% 0px -50% 0px"});
  secs.forEach(function(x){spy.observe(x)});
})();

if(!CSS.supports("animation-timeline: view()")&&"IntersectionObserver" in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
    e.target.animate([{opacity:0,transform:"translateY(40px)"},{opacity:1,transform:"none"}],
      {duration:1100,easing:"cubic-bezier(.19,1,.22,1)",fill:"both"});io.unobserve(e.target)}})},
    {threshold:.08});
  $$(".rise").forEach(function(e){io.observe(e)});
}
})();
</script>
